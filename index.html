<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mina Film Studio V3</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#080b10;
    color:#eee;
    font-family:Arial,Helvetica,sans-serif;
}

header{
    background:linear-gradient(135deg,#111827,#05070a);
    border-bottom:1px solid #26303d;
    padding:18px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:28px;
    color:#fff;
}

header p{
    margin:7px 0 0;
    color:#9ca3af;
}

.container{
    max-width:1250px;
    margin:auto;
    padding:18px;
}

.panel{
    background:#11161d;
    border:1px solid #28313d;
    border-radius:14px;
    padding:18px;
    margin-bottom:18px;
}

h2{
    margin-top:0;
}

label{
    display:block;
    margin-bottom:7px;
    color:#cbd5e1;
    font-weight:bold;
}

input,textarea,button,select{
    font-family:inherit;
}

input[type=text],
textarea,
select{
    width:100%;
    background:#080c11;
    color:#fff;
    border:1px solid #34404d;
    border-radius:9px;
    padding:11px;
    outline:none;
}

textarea{
    min-height:130px;
    resize:vertical;
}

button{
    border:0;
    border-radius:9px;
    padding:11px 15px;
    cursor:pointer;
    font-weight:bold;
    margin:4px;
    background:#263241;
    color:#fff;
}

button:hover{
    filter:brightness(1.2);
}

.btn-green{
    background:#166534;
}

.btn-blue{
    background:#1d4ed8;
}

.btn-red{
    background:#991b1b;
}

.btn-orange{
    background:#9a3412;
}

.btn-purple{
    background:#6d28d9;
}

.status{
    background:#080c11;
    border:1px solid #303a46;
    padding:12px;
    border-radius:9px;
    margin-top:10px;
    color:#a7f3d0;
}

.layout{
    display:grid;
    grid-template-columns:360px 1fr;
    gap:18px;
}

@media(max-width:900px){
    .layout{
        grid-template-columns:1fr;
    }
}

.scene-list{
    max-height:650px;
    overflow:auto;
}

.scene-card{
    background:#0c1117;
    border:1px solid #293440;
    border-radius:11px;
    padding:12px;
    margin-bottom:10px;
    cursor:pointer;
}

.scene-card.active{
    border-color:#60a5fa;
    background:#101a27;
}

.scene-title{
    font-weight:bold;
    margin-bottom:7px;
}

.scene-info{
    font-size:12px;
    color:#94a3b8;
    line-height:1.5;
}

.audio-ok{
    color:#86efac;
}

.audio-none{
    color:#fca5a5;
}

canvas{
    width:100%;
    display:block;
    background:#000;
    border-radius:12px;
    border:1px solid #313b47;
}

.controls{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:5px;
    margin-top:12px;
}

.progress-wrap{
    height:12px;
    background:#202832;
    border-radius:20px;
    overflow:hidden;
    margin-top:12px;
}

.progress{
    width:0%;
    height:100%;
    background:#60a5fa;
}

.time{
    margin-top:8px;
    font-size:13px;
    color:#94a3b8;
}

.small{
    font-size:12px;
    color:#94a3b8;
}

.two{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

@media(max-width:650px){
    .two{
        grid-template-columns:1fr;
    }
}

.scene-editor{
    margin-top:12px;
}

.audio-box{
    border:1px dashed #465364;
    border-radius:10px;
    padding:12px;
    margin-top:10px;
    background:#0b1016;
}

input[type=file]{
    width:100%;
    color:#cbd5e1;
}

audio{
    width:100%;
    margin-top:10px;
}

.badge{
    display:inline-block;
    padding:4px 8px;
    border-radius:20px;
    font-size:11px;
    background:#263241;
    margin-right:5px;
}

.footer-note{
    text-align:center;
    color:#64748b;
    padding:20px;
    font-size:12px;
}
</style>
</head>

<body>

<header>
    <h1>🎬 Mina Film Studio V3</h1>
    <p>Film • Szene • Bewegung • Sprache • Untertitel • WebM</p>
</header>

<div class="container">

<div class="panel">

    <div class="two">

        <div>
            <label>Filmname</label>
            <input id="filmName" type="text" value="Das Haus am Waldrand">
        </div>

        <div>
            <label>Sprache</label>
            <select id="language">
                <option value="de-DE">Deutsch</option>
                <option value="tr-TR">Türkçe</option>
                <option value="en-US">English</option>
            </select>
        </div>

    </div>

    <div style="margin-top:15px">
        <label>Geschichte</label>

        <textarea id="story">Um 23:47 Uhr kam Anna an einem verlassenen Haus am Waldrand an. Seit Jahren hatte niemand dieses Haus betreten. Trotzdem ging plötzlich im oberen Stock ein Licht an. Anna hörte Schritte hinter sich. Die Haustür begann sich von selbst zu öffnen. Im oberen Fenster erschien eine dunkle Gestalt. Anna erkannte etwas, das sie nie wieder vergessen würde. Am nächsten Morgen war das Haus wieder dunkel.</textarea>
    </div>

    <div class="controls">

        <button class="btn-blue" onclick="generateFilm()">
            ✨ Film erstellen
        </button>

        <button onclick="saveProject()">
            💾 Projekt speichern
        </button>

        <button onclick="loadProject()">
            📂 Projekt laden
        </button>

        <button class="btn-orange" onclick="resetProject()">
            🔄 Zurücksetzen
        </button>

    </div>

    <div id="status" class="status">
        Bereit.
    </div>

</div>


<div class="layout">

<!-- SOL TARAF -->

<div>

<div class="panel">

    <h2>🎞️ Szenen</h2>

    <div id="sceneList" class="scene-list"></div>

</div>

</div>


<!-- SAĞ TARAF -->

<div>

<div class="panel">

    <h2>🎥 Vorschau</h2>

    <canvas id="canvas" width="1280" height="720"></canvas>

    <div class="progress-wrap">
        <div id="progress" class="progress"></div>
    </div>

    <div id="time" class="time">
        00:00 / 00:00
    </div>

    <div class="controls">

        <button class="btn-green" onclick="playPreview()">
            ▶ Vorschau
        </button>

        <button onclick="pausePreview()">
            ⏸ Pause
        </button>

        <button onclick="stopPreview()">
            ⏹ Stop
        </button>

        <button class="btn-purple" onclick="speakCurrent()">
            🔊 Nur anhören
        </button>

        <button class="btn-red" onclick="recordFilm()">
            🔴 FILM AUFNEHMEN
        </button>

    </div>

    <div id="recordStatus" class="status">
        Aufnahme noch nicht gestartet.
    </div>

</div>


<div class="panel">

    <h2>🎬 Aktuelle Szene</h2>

    <div id="sceneEditor"></div>

</div>

</div>

</div>

<div class="footer-note">
    Mina Film Studio V3 • Lokale Filmproduktion • Canvas + AudioStream + MediaRecorder
</div>

</div>


<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const sceneList = document.getElementById("sceneList");
const sceneEditor = document.getElementById("sceneEditor");

const progress = document.getElementById("progress");
const timeLabel = document.getElementById("time");

const statusBox = document.getElementById("status");
const recordStatus = document.getElementById("recordStatus");

let scenes = [];
let currentScene = 0;

let playing = false;
let recording = false;

let animationId = null;
let recordAnimationId = null;

let sceneStartTime = 0;
let globalStartTime = 0;

let mediaRecorder = null;
let recordedChunks = [];

let audioContext = null;
let audioDestination = null;

let audioElements = [];
let audioSources = [];

let selectedAudio = null;

let projectGenerated = false;


/* =========================================================
   FILM DATEN
========================================================= */

function generateFilm(){

    const story = document.getElementById("story").value.trim();

    if(!story){
        setStatus("Bitte zuerst eine Geschichte eingeben.");
        return;
    }

    scenes = [

        {
            title:"Die Ankunft",
            duration:7,
            narration:"Um 23 Uhr siebenundvierzig kam Anna an dem verlassenen Haus am Waldrand an.",
            imagePrompt:"Cinematic abandoned house at night, dense dark forest, heavy rain, German mystery thriller, realistic film still, moonlight, dramatic atmosphere",
            motionPrompt:"Slow cinematic camera movement toward the abandoned house, rain falling, trees moving gently in the wind",
            audio:null
        },

        {
            title:"Das Haus",
            duration:7,
            narration:"Seit Jahren hatte niemand dieses Haus betreten. Trotzdem wirkte es nicht völlig verlassen.",
            imagePrompt:"Old abandoned forest house, broken windows, wet wooden walls, dark night, cinematic German thriller",
            motionPrompt:"Camera slowly moves closer to the house, fog drifting across the ground",
            audio:null
        },

        {
            title:"Das Fenster",
            duration:7,
            narration:"Plötzlich ging im oberen Stock ein Licht an.",
            imagePrompt:"Abandoned house at night with one mysterious illuminated upstairs window, rain, cinematic horror thriller",
            motionPrompt:"Camera slowly zooms toward the glowing upstairs window, lightning briefly illuminates the forest",
            audio:null
        },

        {
            title:"Der Wald",
            duration:7,
            narration:"Anna hörte Schritte hinter sich. Langsam drehte sie sich um.",
            imagePrompt:"Young woman standing near abandoned forest house at night, dark forest behind her, rain, cinematic mystery",
            motionPrompt:"Camera slowly rotates around Anna while shadows move between trees",
            audio:null
        },

        {
            title:"Die Tür",
            duration:7,
            narration:"Die Haustür begann sich von selbst zu öffnen.",
            imagePrompt:"Old wooden door of abandoned house opening by itself at night, darkness inside, rain, cinematic thriller",
            motionPrompt:"Camera slowly approaches the door as it opens by itself, darkness visible inside",
            audio:null
        },

        {
            title:"Der Schatten",
            duration:7,
            narration:"Im oberen Fenster erschien eine dunkle Gestalt.",
            imagePrompt:"Dark human silhouette standing behind upstairs window of abandoned house, night rain, terrifying mystery",
            motionPrompt:"Camera slowly zooms toward the silhouette while lightning flashes behind the house",
            audio:null
        },

        {
            title:"Die Wahrheit",
            duration:7,
            narration:"Anna erkannte etwas, das sie nie wieder vergessen würde.",
            imagePrompt:"Terrified woman looking toward mysterious abandoned house, cinematic close-up, dark blue night",
            motionPrompt:"Slow close-up toward Anna's face, wind moving her hair, rain falling",
            audio:null
        },

        {
            title:"Das Ende",
            duration:7,
            narration:"Am nächsten Morgen war das Haus wieder dunkel. Doch Anna wusste, dass dort jemand gewesen war.",
            imagePrompt:"Abandoned forest house at dawn, mist, empty windows, mysterious cinematic ending, realistic film",
            motionPrompt:"Slow camera pullback from the house while morning fog moves through the forest",
            audio:null
        }

    ];

    currentScene = 0;
    projectGenerated = true;

    renderSceneList();
    selectScene(0);

    setStatus("Film erstellt. Lade jetzt für jede Szene eine MP3- oder WAV-Datei hoch.");
}


/* =========================================================
   SAHNE LİSTESİ
========================================================= */

function renderSceneList(){

    sceneList.innerHTML = "";

    scenes.forEach((scene,index)=>{

        const div = document.createElement("div");

        div.className = "scene-card" +
            (index===currentScene ? " active" : "");

        const audioText = scene.audio
            ? '<span class="audio-ok">🔊 Audio vorhanden</span>'
            : '<span class="audio-none">🔇 Kein Audio</span>';

        div.innerHTML = `
            <div class="scene-title">
                ${index+1}. ${scene.title}
            </div>

            <div class="scene-info">
                Dauer: ${scene.duration}s<br>
                ${audioText}
            </div>
        `;

        div.onclick = ()=>{
            selectScene(index);
        };

        sceneList.appendChild(div);

    });
}


/* =========================================================
   SAHNE SEÇ
========================================================= */

function selectScene(index){

    if(!scenes.length) return;

    currentScene = index;

    renderSceneList();
    renderSceneEditor();

    drawFrame(0);

}


/* =========================================================
   SAHNE EDITÖRÜ
========================================================= */

function renderSceneEditor(){

    const scene = scenes[currentScene];

    if(!scene) return;

    sceneEditor.innerHTML = `

        <div>
            <span class="badge">
                Szene ${currentScene+1}
            </span>

            <span class="badge">
                ${scene.duration} Sekunden
            </span>
        </div>

        <br>

        <label>Titel</label>

        <input
            type="text"
            value="${escapeHTML(scene.title)}"
            onchange="updateSceneTitle(this.value)"
        >

        <br>

        <label>Deutsche Sprecheraufnahme</label>

        <div class="audio-box">

            <div class="small">
                MP3 oder WAV auswählen.
                Diese Datei wird später direkt in die WebM-Aufnahme eingebaut.
            </div>

            <br>

            <input
                type="file"
                accept="audio/*"
                onchange="loadSceneAudio(this.files[0])"
            >

            ${
                scene.audio
                ?
                `
                <audio
                    id="sceneAudioPlayer"
                    controls
                    src="${scene.audio.url}">
                </audio>

                <div class="audio-ok">
                    ✅ Audiodatei geladen:
                    ${escapeHTML(scene.audio.name)}
                </div>
                `
                :
                `
                <div class="audio-none">
                    ❌ Noch keine Audiodatei
                </div>
                `
            }

        </div>

        <br>

        <label>Sprechertext</label>

        <textarea onchange="updateNarration(this.value)">${escapeHTML(scene.narration)}</textarea>

        <br>

        <label>Bild-Prompt</label>

        <textarea onchange="updateImagePrompt(this.value)">${escapeHTML(scene.imagePrompt)}</textarea>

        <br>

        <label>Bewegungs-Prompt</label>

        <textarea onchange="updateMotionPrompt(this.value)">${escapeHTML(scene.motionPrompt)}</textarea>

    `;
}


/* =========================================================
   SCENE AUDIO
========================================================= */

function loadSceneAudio(file){

    if(!file) return;

    const scene = scenes[currentScene];

    if(scene.audio && scene.audio.url){
        URL.revokeObjectURL(scene.audio.url);
    }

    const url = URL.createObjectURL(file);

    scene.audio = {
        name:file.name,
        type:file.type,
        url:url
    };

    renderSceneList();
    renderSceneEditor();

    setStatus(
        "Audio geladen: " +
        file.name +
        " — Szene " +
        (currentScene+1)
    );
}


/* =========================================================
   AUDIO CONTEXT
========================================================= */

async function setupAudioContext(){

    if(!audioContext){

        audioContext = new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

        audioDestination =
            audioContext.createMediaStreamDestination();

    }

    if(audioContext.state === "suspended"){
        await audioContext.resume();
    }

}


/* =========================================================
   AUDIO ELEMENT
========================================================= */

function createAudioElement(scene){

    if(!scene.audio){
        return null;
    }

    const audio = new Audio();

    audio.src = scene.audio.url;
    audio.preload = "auto";
    audio.crossOrigin = "anonymous";

    audio.volume = 1;

    return audio;
}


/* =========================================================
   RECORD AUDIO SETUP
========================================================= */

async function prepareRecordingAudio(){

    await setupAudioContext();

    audioElements = [];
    audioSources = [];

    for(let i=0;i<scenes.length;i++){

        const scene = scenes[i];

        if(!scene.audio){
            audioElements.push(null);
            audioSources.push(null);
            continue;
        }

        const audio = createAudioElement(scene);

        const source =
            audioContext.createMediaElementSource(audio);

        /*
        Ses hem hoparlöre hem kayıt kanalına gider.
        */

        source.connect(audioContext.destination);
        source.connect(audioDestination);

        audioElements.push(audio);
        audioSources.push(source);
    }

}


/* =========================================================
   SESİ TEK SAHNEDE DİNLE
========================================================= */

async function speakCurrent(){

    const scene = scenes[currentScene];

    if(!scene){
        return;
    }

    if(scene.audio){

        try{

            const audio = new Audio(scene.audio.url);

            await audio.play();

        }catch(e){

            alert(
                "Audio konnte nicht abgespielt werden.\n\n" +
                e.message
            );

        }

        return;
    }

    /*
    Ses dosyası yoksa browser TTS sadece önizleme içindir.
    */

    if("speechSynthesis" in window){

        speechSynthesis.cancel();

        const utterance =
            new SpeechSynthesisUtterance(scene.narration);

        utterance.lang =
            document.getElementById("language").value;

        utterance.rate = 0.9;
        utterance.pitch = 0.9;

        speechSynthesis.speak(utterance);

    }else{

        alert("Dieser Browser unterstützt keine Sprachausgabe.");

    }

}


/* =========================================================
   PREVIEW
========================================================= */

function playPreview(){

    if(!scenes.length){
        generateFilm();
        return;
    }

    if(playing) return;

    playing = true;

    sceneStartTime =
        performance.now();

    globalStartTime =
        performance.now();

    previewLoop();

}


function previewLoop(){

    if(!playing) return;

    const now =
        performance.now();

    const elapsed =
        (now - sceneStartTime) / 1000;

    const scene =
        scenes[currentScene];

    if(elapsed >= scene.duration){

        if(currentScene < scenes.length - 1){

            currentScene++;

            renderSceneList();
            renderSceneEditor();

            sceneStartTime =
                performance.now();

        }else{

            stopPreview();
            return;
        }

    }

    const current =
        scenes[currentScene];

    const sceneElapsed =
        (performance.now() - sceneStartTime) / 1000;

    drawFrame(sceneElapsed);

    updateProgress(
        currentScene,
        sceneElapsed
    );

    animationId =
        requestAnimationFrame(previewLoop);

}


function pausePreview(){

    playing = false;

    if(animationId){
        cancelAnimationFrame(animationId);
        animationId = null;
    }

}


function stopPreview(){

    playing = false;

    if(animationId){
        cancelAnimationFrame(animationId);
        animationId = null;
    }

    currentScene = 0;

    renderSceneList();
    renderSceneEditor();

    drawFrame(0);
    updateProgress(0,0);

}


/* =========================================================
   FRAME ÇİZİMİ
========================================================= */

function drawFrame(t){

    const scene =
        scenes[currentScene];

    if(!scene){

        drawDefault();

        return;
    }

    const w = canvas.width;
    const h = canvas.height;

    /*
    Arka plan
    */

    const gradient =
        ctx.createLinearGradient(0,0,0,h);

    gradient.addColorStop(0,"#03050a");
    gradient.addColorStop(0.55,"#0a1119");
    gradient.addColorStop(1,"#020305");

    ctx.fillStyle = gradient;
    ctx.fillRect(0,0,w,h);


    /*
    Ay
    */

    ctx.beginPath();

    ctx.arc(
        w*0.78,
        h*0.20,
        60,
        0,
        Math.PI*2
    );

    ctx.fillStyle =
        "rgba(220,230,240,.8)";

    ctx.fill();


    /*
    Dağ / orman
    */

    ctx.fillStyle="#030506";

    for(let i=0;i<20;i++){

        const x =
            i * 75;

        const treeH =
            100 + ((i*37)%140);

        drawTree(
            x,
            h-70,
            treeH
        );

    }


    /*
    Ev
    */

    const houseX =
        w*0.30;

    const houseY =
        h*0.38;

    const houseW =
        w*0.40;

    const houseH =
        h*0.40;

    ctx.fillStyle="#111";

    ctx.fillRect(
        houseX,
        houseY,
        houseW,
        houseH
    );


    /*
    Çatı
    */

    ctx.beginPath();

    ctx.moveTo(
        houseX-50,
        houseY
    );

    ctx.lineTo(
        houseX + houseW/2,
        houseY-130
    );

    ctx.lineTo(
        houseX+houseW+50,
        houseY
    );

    ctx.closePath();

    ctx.fillStyle="#080909";

    ctx.fill();


    /*
    Pencereler
    */

    const windowGlow =
        currentScene >= 2
        ? 0.8
        : 0.05;

    drawWindow(
        houseX+houseW*0.65,
        houseY+50,
        windowGlow
    );


    drawWindow(
        houseX+houseW*0.22,
        houseY+100,
        0.08
    );


    /*
    Kapı
    */

    ctx.fillStyle="#080808";

    ctx.fillRect(
        houseX+houseW*0.43,
        houseY+houseH-145,
        90,
        145
    );


    /*
    Sahne 4+ gölge
    */

    if(currentScene >= 5){

        const sx =
            houseX+houseW*0.65+20;

        const sy =
            houseY+65;

        ctx.beginPath();

        ctx.ellipse(
            sx,
            sy,
            27,
            45,
            0,
            0,
            Math.PI*2
        );

        ctx.fillStyle=
            "rgba(0,0,0,.95)";

        ctx.fill();

    }


    /*
    Yağmur
    */

    drawRain(t);


    /*
    Sis
    */

    for(let i=0;i<5;i++){

        const fogX =
            ((t*15)+(i*300))%
            (w+400)-200;

        const fogY =
            h-130+(i*25);

        ctx.beginPath();

        ctx.ellipse(
            fogX,
            fogY,
            240,
            45,
            0,
            0,
            Math.PI*2
        );

        ctx.fillStyle=
            "rgba(180,200,210,.04)";

        ctx.fill();

    }


    /*
    Vignette
    */

    const vignette =
        ctx.createRadialGradient(
            w/2,
            h/2,
            150,
            w/2,
            h/2,
            750
        );

    vignette.addColorStop(
        0,
        "rgba(0,0,0,0)"
    );

    vignette.addColorStop(
        1,
        "rgba(0,0,0,.75)"
    );

    ctx.fillStyle=vignette;

    ctx.fillRect(
        0,
        0,
        w,
        h
    );


    /*
    Altyazı
    */

    drawSubtitle(
        scene.narration
    );

}


/* =========================================================
   DEFAULT
========================================================= */

function drawDefault(){

    ctx.fillStyle="#030507";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.fillStyle="#fff";

    ctx.font="42px Arial";

    ctx.textAlign="center";

    ctx.fillText(
        "Mina Film Studio V3",
        canvas.width/2,
        canvas.height/2
    );

}


/* =========================================================
   AĞAÇ
========================================================= */

function drawTree(x,y,height){

    ctx.fillStyle="#050708";

    ctx.fillRect(
        x-8,
        y-height*0.35,
        16,
        height*0.35
    );

    ctx.beginPath();

    ctx.moveTo(
        x,
        y-height
    );

    ctx.lineTo(
        x-height*0.28,
        y-height*0.45
    );

    ctx.lineTo(
        x+height*0.28,
        y-height*0.45
    );

    ctx.closePath();

    ctx.fill();

    ctx.beginPath();

    ctx.moveTo(
        x,
        y-height*0.75
    );

    ctx.lineTo(
        x-height*0.35,
        y-height*0.20
    );

    ctx.lineTo(
        x+height*0.35,
        y-height*0.20
    );

    ctx.closePath();

    ctx.fill();

}


/* =========================================================
   PENCERE
========================================================= */

function drawWindow(x,y,glow){

    ctx.fillStyle =
        `rgba(255,210,90,${glow})`;

    ctx.fillRect(
        x,
        y,
        85,
        100
    );

    ctx.strokeStyle="#080808";

    ctx.lineWidth=7;

    ctx.strokeRect(
        x,
        y,
        85,
        100
    );

    ctx.beginPath();

    ctx.moveTo(
        x+42,
        y
    );

    ctx.lineTo(
        x+42,
        y+100
    );

    ctx.moveTo(
        x,
        y+50
    );

    ctx.lineTo(
        x+85,
        y+50
    );

    ctx.stroke();

}


/* =========================================================
   YAĞMUR
========================================================= */

function drawRain(t){

    const w=canvas.width;
    const h=canvas.height;

    ctx.lineWidth=1;

    for(let i=0;i<180;i++){

        const x =
            (i*83)%w;

        const y =
            ((i*47)+(t*300))%h;

        ctx.strokeStyle=
            "rgba(180,210,240,.25)";

        ctx.beginPath();

        ctx.moveTo(
            x,
            y
        );

        ctx.lineTo(
            x-7,
            y+22
        );

        ctx.stroke();

    }

}


/* =========================================================
   ALTYAZI
========================================================= */

function drawSubtitle(text){

    if(!text) return;

    const maxWidth=1000;

    ctx.font="30px Arial";

    const words=text.split(" ");

    let lines=[];
    let line="";

    words.forEach(word=>{

        const test =
            line
            ? line+" "+word
            : word;

        if(ctx.measureText(test).width > maxWidth){

            lines.push(line);

            line=word;

        }else{

            line=test;

        }

    });

    if(line){
        lines.push(line);
    }

    const lineHeight=38;

    const boxH =
        lines.length*lineHeight+34;

    const boxY =
        canvas.height-boxH-35;

    ctx.fillStyle=
        "rgba(0,0,0,.72)";

    ctx.fillRect(
        80,
        boxY,
        canvas.width-160,
        boxH
    );

    ctx.fillStyle="#fff";

    ctx.textAlign="center";

    lines.forEach((line,i)=>{

        ctx.fillText(
            line,
            canvas.width/2,
            boxY+35+i*lineHeight
        );

    });

}


/* =========================================================
   PROGRESS
========================================================= */

function updateProgress(index,sceneTime){

    let total=0;

    for(let i=0;i<index;i++){
        total+=scenes[i].duration;
    }

    total+=sceneTime;

    let duration=0;

    scenes.forEach(s=>{
        duration+=s.duration;
    });

    const percent =
        duration
        ? Math.min(
            100,
            total/duration*100
        )
        : 0;

    progress.style.width =
        percent+"%";

    timeLabel.textContent =
        formatTime(total)
        +" / "
        +formatTime(duration);

}


/* =========================================================
   FILM KAYDI
========================================================= */

async function recordFilm(){

    if(recording){
        return;
    }

    if(!scenes.length){

        alert(
            "Bitte zuerst den Film erstellen."
        );

        return;
    }


    /*
    Ses dosyası kontrolü
    */

    const audioCount =
        scenes.filter(
            s=>s.audio
        ).length;

    if(audioCount===0){

        const continueWithout =
            confirm(
                "Keine MP3/WAV-Dateien wurden geladen.\n\n" +
                "Die Browser-Sprache kann nicht zuverlässig in die WebM-Datei aufgenommen werden.\n\n" +
                "Ohne Audio aufnehmen?"
            );

        if(!continueWithout){
            return;
        }

    }


    recording=true;

    recordedChunks=[];

    recordStatus.textContent =
        "⏳ Aufnahme wird vorbereitet...";


    try{

        /*
        Audio vorbereiten
        */

        await prepareRecordingAudio();


        /*
        Video Stream
        */

        const videoStream =
            canvas.captureStream(30);


        /*
        Audio Stream
        */

        const tracks =
            [
                ...videoStream.getVideoTracks()
            ];


        if(audioDestination){

            audioDestination
                .stream
                .getAudioTracks()
                .forEach(track=>{
                    tracks.push(track);
                });

        }


        /*
        Gemeinsamer Stream
        */

        const combinedStream =
            new MediaStream(tracks);


        /*
        Codec seçimi
        */

        let mimeType =
            "";

        const codecs = [

            "video/webm;codecs=vp9,opus",

            "video/webm;codecs=vp8,opus",

            "video/webm"

        ];

        for(const codec of codecs){

            if(
                MediaRecorder.isTypeSupported(codec)
            ){

                mimeType=codec;
                break;

            }

        }


        mediaRecorder =
            new MediaRecorder(
                combinedStream,
                mimeType
                ? {mimeType}
                : undefined
            );


        mediaRecorder.ondataavailable =
            event=>{

                if(event.data &&
                   event.data.size>0){

                    recordedChunks.push(
                        event.data
                    );

                }

            };


        mediaRecorder.onstop =
            ()=>{

                const blob =
                    new Blob(
                        recordedChunks,
                        {
                            type:
                            mimeType ||
                            "video/webm"
                        }
                    );

                const url =
                    URL.createObjectURL(blob);

                const a =
                    document.createElement("a");

                a.href=url;

                a.download=
                    safeFileName(
                        document.getElementById(
                            "filmName"
                        ).value
                    )
                    +".webm";

                a.click();

                setTimeout(()=>{
                    URL.revokeObjectURL(url);
                },5000);

                recordStatus.textContent =
                    "✅ Film fertig! Die WebM-Datei wurde erstellt.";

                recording=false;

            };


        /*
        Recorder starten
        */

        mediaRecorder.start(250);


        recordStatus.textContent =
            "🔴 Aufnahme läuft...";


        /*
        Tüm sahneleri kaydet
        */

        await recordAllScenes();


        /*
        Recorder durdur
        */

        mediaRecorder.stop();

        videoStream
            .getTracks()
            .forEach(track=>{
                track.stop();
            });


    }catch(error){

        console.error(error);

        recording=false;

        recordStatus.textContent =
            "❌ Aufnahmefehler: "
            +error.message;

        alert(
            "Aufnahmefehler:\n\n"+
            error.message
        );

    }

}


/* =========================================================
   TÜM SAHNELERİ KAYDET
========================================================= */

function recordAllScenes(){

    return new Promise(async(resolve)=>{

        currentScene=0;

        renderSceneList();
        renderSceneEditor();

        const totalDuration =
            scenes.reduce(
                (sum,s)=>sum+s.duration,
                0
            );

        let completed=0;


        for(let i=0;i<scenes.length;i++){

            currentScene=i;

            renderSceneList();
            renderSceneEditor();

            drawFrame(0);


            /*
            Scene audio
            */

            const audio =
                audioElements[i];


            if(audio){

                try{

                    audio.currentTime=0;

                    await audio.play();

                }catch(e){

                    console.warn(
                        "Audio konnte nicht abgespielt werden",
                        e
                    );

                }

            }


            /*
            Sahne animasyonu
            */

            await new Promise(sceneResolve=>{

                const start =
                    performance.now();

                function loop(){

                    const elapsed =
                        (performance.now()-start)
                        /1000;

                    drawFrame(elapsed);

                    const overall =
                        completed+elapsed;

                    const percent =
                        Math.min(
                            100,
                            overall/
                            totalDuration*
                            100
                        );

                    progress.style.width =
                        percent+"%";

                    timeLabel.textContent =
                        formatTime(overall)
                        +" / "
                        +formatTime(totalDuration);


                    recordStatus.textContent =
                        "🔴 Aufnahme: Szene "
                        +(i+1)
                        +" / "
                        +scenes.length;


                    if(elapsed <
                       scenes[i].duration){

                        recordAnimationId =
                            requestAnimationFrame(
                                loop
                            );

                    }else{

                        if(audio){

                            audio.pause();

                            try{
                                audio.currentTime=0;
                            }catch(e){}

                        }

                        completed +=
                            scenes[i].duration;

                        sceneResolve();

                    }

                }

                loop();

            });

        }


        resolve();

    });

}


/* =========================================================
   PROJEKT KAYDET
========================================================= */

function saveProject(){

    if(!scenes.length){

        alert(
            "Önce film oluştur."
        );

        return;
    }


    /*
    Object URL'ler JSON içine kaydedilemez.
    Bu yüzden sadece audio adı tutuluyor.
    */

    const cleanScenes =
        scenes.map(scene=>({

            title:scene.title,
            duration:scene.duration,
            narration:scene.narration,
            imagePrompt:scene.imagePrompt,
            motionPrompt:scene.motionPrompt,
            audioName:
                scene.audio
                ? scene.audio.name
                : null

        }));


    const project={

        version:"3.0",

        filmName:
            document.getElementById(
                "filmName"
            ).value,

        language:
            document.getElementById(
                "language"
            ).value,

        story:
            document.getElementById(
                "story"
            ).value,

        scenes:cleanScenes

    };


    const blob =
        new Blob(
            [
                JSON.stringify(
                    project,
                    null,
                    2
                )
            ],
            {
                type:"application/json"
            }
        );


    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href=url;

    a.download=
        safeFileName(
            project.filmName
        )
        +".json";

    a.click();

    URL.revokeObjectURL(url);


    setStatus(
        "Projekt gespeichert."
    );

}


/* =========================================================
   PROJEKT LADEN
========================================================= */

function loadProject(){

    const input =
        document.createElement("input");

    input.type="file";

    input.accept=".json,application/json";

    input.onchange =
        async function(){

            const file =
                input.files[0];

            if(!file) return;

            try{

                const text =
                    await file.text();

                const project =
                    JSON.parse(text);


                document.getElementById(
                    "filmName"
                ).value =
                    project.filmName || "";


                document.getElementById(
                    "language"
                ).value =
                    project.language || "de-DE";


                document.getElementById(
                    "story"
                ).value =
                    project.story || "";


                scenes =
                    project.scenes || [];


                scenes.forEach(scene=>{
                    scene.audio=null;
                });


                currentScene=0;

                renderSceneList();
                renderSceneEditor();
                drawFrame(0);


                setStatus(
                    "Projekt geladen. Audio-Dateien müssen erneut ausgewählt werden."
                );


            }catch(error){

                alert(
                    "Projekt konnte nicht geladen werden.\n\n"+
                    error.message
                );

            }

        };

    input.click();

}

   RESET

function resetProject(){

    if(
        !confirm(
            "Projekt wirklich zurücksetzen?"
        )
    ){

        return;

    }


    scenes=[];

    currentScene=0;

    playing=false;

    recording=false;

    sceneList.innerHTML="";

    sceneEditor.innerHTML="";

/* =========================================================
   STATUS
========================================================= */

function setStatus(text){

    statusBox.textContent=text;

}


/* =========================================================
   TIME
========================================================= */

function formatTime(seconds){

    seconds =
        Math.max(
            0,
            Math.floor(seconds)
        );

    const min =
        Math.floor(
            seconds/60
        );

    const sec =
        seconds%60;

    return String(min).padStart(2,"0")
        +":"
        +String(sec).padStart(2,"0");

}


/* =========================================================
   DOSYA ADI
========================================================= */

function safeFileName(name){

    return (
        name ||
        "Mina_Film"
    )
    .replace(
        /[\\/:*?"<>|]/g,
        "_"
    )
    .replace(
        /\s+/g,
        "_"
    );

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(text){

    return String(text || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

========================================================= */

drawDefault();
