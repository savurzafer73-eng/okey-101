<script>
"use strict";

/* =========================================================
   MINA VIDEO AI V44
   STABLE AUDIO-SYNC ENGINE
========================================================= */

var scenes = [];
var recordingStream = null;
var mediaRecorder = null;
var recordingChunks = [];
var currentRecordingScene = -1;
var speechActive = false;
var stopRequested = false;
var generatedVideoURL = null;


/* =========================================================
   DOM
========================================================= */

var storyEl = document.getElementById("story");
var sceneCountEl = document.getElementById("sceneCount");
var formatEl = document.getElementById("format");
var renderModeEl = document.getElementById("renderMode");
var motionEl = document.getElementById("motion");
var subtitleModeEl = document.getElementById("subtitleMode");
var subtitleSizeEl = document.getElementById("subtitleSize");

var scenesEl = document.getElementById("scenes");
var statusEl = document.getElementById("status");
var progressBar = document.getElementById("progressBar");

var createScenesBtn = document.getElementById("createScenes");
var generateAllBtn = document.getElementById("generateAll");
var prepareAudioBtn = document.getElementById("prepareAudio");
var speakAllBtn = document.getElementById("speakAll");
var stopAllBtn = document.getElementById("stopAll");
var renderVideoBtn = document.getElementById("renderVideo");

var videoPreview = document.getElementById("videoPreview");
var downloadLink = document.getElementById("downloadLink");
var canvas = document.getElementById("canvas");
var ctx = canvas.getContext("2d", {
  alpha:false,
  desynchronized:true
});


/* =========================================================
   STATUS
========================================================= */

function setStatus(text, type){
  statusEl.textContent = text || "";
  statusEl.className = "status";

  if(type === "error") statusEl.classList.add("error");
  if(type === "ok") statusEl.classList.add("ok");
  if(type === "warning") statusEl.classList.add("warning");
}

function setProgress(value){
  value = Math.max(0,Math.min(100,value || 0));
  progressBar.style.width = value + "%";
}


/* =========================================================
   SENTENCE SPLITTER
========================================================= */

function splitSentences(text){

  text = String(text || "")
    .replace(/\r/g," ")
    .replace(/[ \t]+/g," ")
    .replace(/\n+/g," ")
    .trim();

  if(!text) return [];

  var matches = text.match(
    /[^.!?。！？]+[.!?。！？]+|[^.!?。！？]+$/g
  );

  if(!matches){
    return [text];
  }

  return matches
    .map(function(x){
      return x.trim();
    })
    .filter(function(x){
      return x.length > 0;
    });
}


/* =========================================================
   SCENE TEXT CREATION
========================================================= */

function makeSceneTexts(text,count){

  var sentences = splitSentences(text);

  if(!sentences.length) return [];

  var result = [];

  if(count === "auto"){
    count = Math.ceil(sentences.length / 2);
  }else{
    count = parseInt(count,10);
  }

  if(!count || count < 1) count = 1;

  /*
    İstenen sahne sayısı kadar böl.
    2 cümleli metinlerde doğal olarak 20 sahne oluşur.
  */

  var perScene = Math.ceil(sentences.length / count);

  if(perScene < 1) perScene = 1;

  for(var i=0;i<count;i++){

    var start = i * perScene;
    var end = Math.min(start + perScene,sentences.length);

    if(start >= sentences.length) break;

    var txt = sentences.slice(start,end).join(" ").trim();

    if(txt){
      result.push(txt);
    }
  }

  /*
    Eğer kullanıcı 20 seçtiyse ve metin 40 cümleyse
    yukarıdaki yöntem tam 20 sahne verir.
  */

  return result;
}


/* =========================================================
   PROMPT GENERATOR
========================================================= */

function makePrompt(text,index){

  var clean = text
    .replace(/\s+/g," ")
    .trim();

  return [
    "Cinematic documentary photograph for a German business success story.",
    "Subject: Harland Sanders and the early history of his chicken business.",
    "Scene " + (index+1) + ".",
    "Photorealistic human appearance.",
    "Historically appropriate clothing, environment and objects.",
    "Authentic documentary photography.",
    "Natural cinematic lighting.",
    "Realistic skin texture.",
    "Detailed environment.",
    "Professional film composition.",
    "35mm cinematic photography.",
    "Shallow depth of field where appropriate.",
    "No cartoon.",
    "No illustration.",
    "No fantasy.",
    "No text.",
    "No watermark.",
    "Story context: " + clean
  ].join(" ");
}


/* =========================================================
   CREATE SCENES
========================================================= */

function createScenes(){

  var text = storyEl.value.trim();

  if(!text){
    setStatus("Önce hikâyeyi yapıştır.", "warning");
    return;
  }

  var sceneTexts = makeSceneTexts(
    text,
    sceneCountEl.value
  );

  if(!sceneTexts.length){
    setStatus("Sahne oluşturulamadı.", "error");
    return;
  }

  scenes = sceneTexts.map(function(txt,i){

    return {
      id:i+1,
      text:txt,
      prompt:makePrompt(txt,i),

      image:null,
      imageURL:null,
      imageLoaded:null,

      audioBlob:null,
      audioURL:null,
      audioDuration:0,

      speaking:false,
      recording:false
    };

  });

  renderSceneCards();

  setProgress(100);

  setStatus(
    scenes.length +
    " sahne oluşturuldu. Her sahnenin metni hazır.",
    "ok"
  );
}


/* =========================================================
   SCENE CARD RENDER
========================================================= */

function renderSceneCards(){

  scenesEl.innerHTML = "";

  scenes.forEach(function(scene,index){

    var card = document.createElement("div");
    card.className = "scene";

    var head = document.createElement("div");
    head.className = "sceneHead";

    var title = document.createElement("strong");
    title.textContent = "SAHNE " + (index+1);

    var badge = document.createElement("span");
    badge.className = "badge";
    badge.id = "badge-" + index;
    badge.textContent = "Ses yok";

    head.appendChild(title);
    head.appendChild(badge);

    card.appendChild(head);


    var grid = document.createElement("div");
    grid.className = "sceneGrid";


    /* IMAGE PREVIEW */

    var left = document.createElement("div");

    var preview = document.createElement("div");
    preview.className = "preview";
    preview.id = "preview-" + index;

    var noimg = document.createElement("div");
    noimg.className = "noimg";
    noimg.textContent = "Görsel yok";

    preview.appendChild(noimg);
    left.appendChild(preview);


    var uploadImage = document.createElement("input");
    uploadImage.type = "file";
    uploadImage.accept = "image/*";

    uploadImage.addEventListener("change",function(){

      var file = this.files && this.files[0];

      if(!file) return;

      loadImageFile(index,file);

    });

    left.appendChild(uploadImage);


    var imageButtons = document.createElement("div");
    imageButtons.className = "row";

    var genBtn = document.createElement("button");
    genBtn.textContent = "🖼️ Görsel Üret";
    genBtn.addEventListener("click",function(){
      generateImage(index);
    });

    imageButtons.appendChild(genBtn);
    left.appendChild(imageButtons);

    grid.appendChild(left);


    /* RIGHT */

    var right = document.createElement("div");

    var textLabel = document.createElement("label");
    textLabel.textContent = "Sahne metni";

    right.appendChild(textLabel);

    var textArea = document.createElement("textarea");
    textArea.value = scene.text;
    textArea.style.minHeight = "120px";

    textArea.addEventListener("input",function(){
      scene.text = this.value;
      scene.prompt = makePrompt(this.value,index);
    });

    right.appendChild(textArea);


    var promptLabel = document.createElement("label");
    promptLabel.textContent = "Görsel promptu";
    promptLabel.style.marginTop = "10px";

    right.appendChild(promptLabel);

    var promptArea = document.createElement("textarea");
    promptArea.value = scene.prompt;
    promptArea.style.minHeight = "120px";

    promptArea.addEventListener("input",function(){
      scene.prompt = this.value;
    });

    right.appendChild(promptArea);


    var audioButtons = document.createElement("div");
    audioButtons.className = "row";


    var speakBtn = document.createElement("button");
    speakBtn.textContent = "🔊 Seslendir";
    speakBtn.addEventListener("click",function(){
      speakScene(index,false);
    });


    var recordBtn = document.createElement("button");
    recordBtn.className = "green";
    recordBtn.textContent = "🎙️ Seslendir + Kaydet";
    recordBtn.addEventListener("click",function(){
      speakScene(index,true);
    });


    var audioUpload = document.createElement("input");
    audioUpload.type = "file";
    audioUpload.accept = "audio/*";

    audioUpload.addEventListener("change",function(){

      var file = this.files && this.files[0];

      if(!file) return;

      loadAudioFile(index,file);

    });


    var listenBtn = document.createElement("button");
    listenBtn.textContent = "▶ Dinle";
    listenBtn.addEventListener("click",function(){

      if(scene.audioURL){
        var a = new Audio(scene.audioURL);
        a.play();
      }else{
        setStatus(
          "Sahne " + (index+1) + " için ses yok.",
          "warning"
        );
      }

    });


    var stopBtn = document.createElement("button");
    stopBtn.className = "red";
    stopBtn.textContent = "⏹ Durdur";

    stopBtn.addEventListener("click",function(){
      speechSynthesis.cancel();

      if(mediaRecorder &&
         mediaRecorder.state !== "inactive"){
        try{
          mediaRecorder.stop();
        }catch(e){}
      }
    });


    audioButtons.appendChild(speakBtn);
    audioButtons.appendChild(recordBtn);
    audioButtons.appendChild(audioUpload);
    audioButtons.appendChild(listenBtn);
    audioButtons.appendChild(stopBtn);

    right.appendChild(audioButtons);


    var audio = document.createElement("audio");
    audio.controls = true;
    audio.id = "audio-" + index;

    if(scene.audioURL){
      audio.src = scene.audioURL;
    }

    right.appendChild(audio);


    var info = document.createElement("div");
    info.className = "small";
    info.id = "info-" + index;
    info.style.marginTop = "7px";

    info.textContent = "Ses süresi: 0.00 sn";

    right.appendChild(info);

    grid.appendChild(right);

    card.appendChild(grid);

    scenesEl.appendChild(card);

  });
}


/* =========================================================
   IMAGE FILE
========================================================= */

function loadImageFile(index,file){

  var scene = scenes[index];

  var url = URL.createObjectURL(file);

  var img = new Image();

  img.onload = function(){

    scene.image = img;
    scene.imageURL = url;
    scene.imageLoaded = true;

    updateScenePreview(index);

    setStatus(
      "Sahne " + (index+1) + " görseli yüklendi.",
      "ok"
    );

  };

  img.onerror = function(){
    setStatus(
      "Görsel okunamadı.",
      "error"
    );
  };

  img.src = url;
}


/* =========================================================
   IMAGE PREVIEW
========================================================= */

function updateScenePreview(index){

  var scene = scenes[index];
  var box = document.getElementById("preview-" + index);

  if(!box) return;

  box.innerHTML = "";

  if(scene.imageURL){

    var img = document.createElement("img");
    img.src = scene.imageURL;
    img.alt = "";

    box.appendChild(img);

  }else{

    var n = document.createElement("div");
    n.className = "noimg";
    n.textContent = "Görsel yok";

    box.appendChild(n);
  }
}


/* =========================================================
   POLLINATIONS IMAGE
========================================================= */

async function generateImage(index){

  var scene = scenes[index];

  if(!scene){
    return;
  }

  setStatus(
    "Sahne " + (index+1) + " görseli hazırlanıyor...",
    "warning"
  );

  try{

    var prompt = encodeURIComponent(scene.prompt);

    var seed =
      Math.floor(Math.random()*999999999);

    var url =
      "https://image.pollinations.ai/prompt/" +
      prompt +
      "?width=1280" +
      "&height=720" +
      "&nologo=true" +
      "&seed=" + seed;

    var response = await fetch(url);

    if(!response.ok){
      throw new Error("Görsel sunucusu HTTP " + response.status);
    }

    var blob = await response.blob();

    var objectURL = URL.createObjectURL(blob);

    await loadImageURL(index,objectURL);

    setStatus(
      "Sahne " + (index+1) + " görseli hazır.",
      "ok"
    );

  }catch(err){

    console.error(err);

    setStatus(
      "Görsel üretilemedi: " + err.message,
      "error"
    );
  }
}


function loadImageURL(index,url){

  return new Promise(function(resolve,reject){

    var img = new Image();

    img.onload = function(){

      scenes[index].image = img;
      scenes[index].imageURL = url;
      scenes[index].imageLoaded = true;

      updateScenePreview(index);

      resolve();

    };

    img.onerror = reject;

    img.src = url;
  });
}


/* =========================================================
   GENERATE ALL IMAGES
========================================================= */

async function generateAllImages(){

  if(!scenes.length){
    setStatus("Önce sahneleri oluştur.", "warning");
    return;
  }

  generateAllBtn.disabled = true;

  try{

    for(var i=0;i<scenes.length;i++){

      if(stopRequested) break;

      setProgress((i/scenes.length)*100);

      await generateImage(i);

      /*
        Chrome'un nefes alması için kısa boşluk.
      */
      await sleep(180);

    }

    setProgress(100);

  }finally{

    generateAllBtn.disabled = false;
  }
}


/* =========================================================
   AUDIO UPLOAD
========================================================= */

async function loadAudioFile(index,file){

  var scene = scenes[index];

  try{

    var blob = file.slice(
      0,
      file.size,
      file.type
    );

    var duration = await getAudioDuration(blob);

    scene.audioBlob = blob;
    scene.audioURL = URL.createObjectURL(blob);
    scene.audioDuration = duration;

    updateAudioUI(index);

    setStatus(
      "Sahne " + (index+1) +
      " sesi yüklendi: " +
      duration.toFixed(2) +
      " sn",
      "ok"
    );

  }catch(err){

    setStatus(
      "Ses okunamadı: " + err.message,
      "error"
    );
  }
}


/* =========================================================
   AUDIO DURATION
========================================================= */

function getAudioDuration(blob){

  return new Promise(function(resolve,reject){

    var AudioCtx =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!AudioCtx){
      reject(new Error("AudioContext desteklenmiyor."));
      return;
    }

    var ac = new AudioCtx();

    var reader = new FileReader();

    reader.onload = function(){

      ac.decodeAudioData(
        reader.result,
        function(buffer){

          var d = buffer.duration;

          try{ac.close();}catch(e){}

          resolve(d);

        },
        function(err){

          try{ac.close();}catch(e){}

          reject(err || new Error("Ses çözülemedi."));
        }
      );

    };

    reader.onerror = function(){
      try{ac.close();}catch(e){}
      reject(new Error("Dosya okunamadı."));
    };

    reader.readAsArrayBuffer(blob);
  });
}


/* =========================================================
   AUDIO UI
========================================================= */

function updateAudioUI(index){

  var scene = scenes[index];

  var audio =
    document.getElementById("audio-" + index);

  var info =
    document.getElementById("info-" + index);

  var badge =
    document.getElementById("badge-" + index);

  if(audio && scene.audioURL){
    audio.src = scene.audioURL;
    audio.load();
  }

  if(info){
    info.textContent =
      "Ses süresi: " +
      (scene.audioDuration || 0).toFixed(2) +
      " sn";
  }

  if(badge){

    if(scene.audioDuration > 0){

      badge.textContent =
        scene.audioDuration.toFixed(1) + " sn";

      badge.style.background =
        "#14532d";

    }else{

      badge.textContent =
        "Ses yok";

      badge.style.background =
        "#1d2939";
    }
  }
}


/* =========================================================
   SPEECH
========================================================= */

function speakScene(index,record){

  var scene = scenes[index];

  if(!scene) return;

  speechSynthesis.cancel();

  var utter =
    new SpeechSynthesisUtterance(scene.text);

  utter.lang = detectLanguage(scene.text);

  utter.rate = 0.95;
  utter.pitch = 1.0;
  utter.volume = 1.0;

  if(!record){

    utter.onstart = function(){

      setStatus(
        "Sahne " + (index+1) + " seslendiriliyor...",
        "warning"
      );
    };

    utter.onend = function(){

      setStatus(
        "Sahne " + (index+1) + " tamamlandı.",
        "ok"
      );
    };

    speechSynthesis.speak(utter);

    return;
  }

  recordSpeechScene(index,utter);
}


/* =========================================================
   LANGUAGE DETECTION
========================================================= */

function detectLanguage(text){

  var lower = text.toLowerCase();

  var german =
    ["der ","die ","das ","und ","ist ","nicht ","für ","mit ","ein ","eine ","wurde ","hat "];

  var tr =
    [" ve "," bir "," için "," olan "," olan "," bu "," şu "," çok "," ile "];

  var gScore = 0;
  var tScore = 0;

  german.forEach(function(x){
    if(lower.indexOf(x)>=0) gScore++;
  });

  tr.forEach(function(x){
    if(lower.indexOf(x)>=0) tScore++;
  });

  return gScore >= tScore ? "de-DE" : "tr-TR";
}


/* =========================================================
   PREPARE AUDIO CAPTURE
========================================================= */

async function prepareAudio(){

  if(!navigator.mediaDevices ||
     !navigator.mediaDevices.getDisplayMedia){

    setStatus(
      "Chrome bu ses yakalama yöntemini desteklemiyor.",
      "error"
    );

    return;
  }

  try{

    setStatus(
      "Ses yakalama izni isteniyor. Açılan pencerede sekme sesini paylaş.",
      "warning"
    );

    recordingStream =
      await navigator.mediaDevices.getDisplayMedia({
        video:true,
        audio:true
      });

    recordingStream.getVideoTracks()
      .forEach(function(track){
        track.enabled = false;
      });

    setStatus(
      "Ses yakalama hazır.",
      "ok"
    );

  }catch(err){

    console.error(err);

    setStatus(
      "Ses yakalama iptal edildi.",
      "error"
    );
  }
}


/* =========================================================
   RECORD SPEECH SCENE
========================================================= */

async function recordSpeechScene(index,utter){

  if(!recordingStream){

    await prepareAudio();

    if(!recordingStream){
      return;
    }
  }

  try{

    speechActive = true;
    stopRequested = false;
    currentRecordingScene = index;

    recordingChunks = [];

    var mime =
      getSupportedMime();

    mediaRecorder =
      new MediaRecorder(
        recordingStream,
        mime ? {mimeType:mime} : undefined
      );

    mediaRecorder.ondataavailable =
      function(e){

        if(e.data && e.data.size > 0){
          recordingChunks.push(e.data);
        }

      };

    mediaRecorder.onstop =
      async function(){

        try{

          var blob =
            new Blob(
              recordingChunks,
              {
                type:
                  mediaRecorder.mimeType ||
                  "audio/webm"
              }
            );

          var duration =
            await getAudioDuration(blob);

          scenes[index].audioBlob = blob;
          scenes[index].audioURL =
            URL.createObjectURL(blob);

          scenes[index].audioDuration =
            duration;

          updateAudioUI(index);

          setStatus(
            "Sahne " + (index+1) +
            " kaydedildi: " +
            duration.toFixed(2) +
            " sn",
            "ok"
          );

        }catch(err){

          setStatus(
            "Ses kaydı çözülemedi.",
            "error"
          );

        }finally{

          speechActive = false;
        }

      };


    mediaRecorder.start(100);

    utter.onstart = function(){

      setStatus(
        "🎙️ Sahne " +
        (index+1) +
        " ses kaydediliyor...",
        "warning"
      );

    };

    utter.onend = function(){

      setTimeout(function(){

        if(mediaRecorder &&
           mediaRecorder.state !== "inactive"){

          mediaRecorder.stop();
        }

      },250);

    };

    utter.onerror = function(e){

      console.error(e);

      try{

        if(mediaRecorder &&
           mediaRecorder.state !== "inactive"){
          mediaRecorder.stop();
        }

      }catch(err){}

      speechActive = false;

    };

    speechSynthesis.speak(utter);

  }catch(err){

    console.error(err);

    setStatus(
      "Ses kayıt hatası: " + err.message,
      "error"
    );

  }
}


/* =========================================================
   MIME
========================================================= */

function getSupportedMime(){

  var types = [
    "audio/webm;codecs=opus",
    "audio/webm",
    "audio/ogg;codecs=opus"
  ];

  for(var i=0;i<types.length;i++){

    if(MediaRecorder.isTypeSupported &&
       MediaRecorder.isTypeSupported(types[i])){
      return types[i];
    }
  }

  return "";
}

   SPEAK ALL

/* =========================================================
   RECORD ONE SCENE PROMISE
========================================================= */

function recordOneScene(index){

  return new Promise(async function(resolve){

    var scene = scenes[index];

    if(!scene){
      resolve();
      return;
    }

    try{

      recordingChunks = [];

      var mime =
        getSupportedMime();

      mediaRecorder =
        new MediaRecorder(
          recordingStream,
          mime ? {mimeType:mime} : undefined
        );

      var finished = false;

      function finish(){

        if(finished) return;

        finished = true;

        setTimeout(resolve,200);
      }

      mediaRecorder.ondataavailable =
        function(e){

          if(e.data && e.data.size){
            recordingChunks.push(e.data);
          }
        };

      mediaRecorder.onstop =
        async function(){

          try{

            var blob =
              new Blob(
                recordingChunks,
                {
                  type:
                    mediaRecorder.mimeType ||
                    "audio/webm"
                }
              );

            var duration =
              await getAudioDuration(blob);

            scene.audioBlob = blob;
            scene.audioURL =
              URL.createObjectURL(blob);

            scene.audioDuration =
              duration;

            updateAudioUI(index);

          }catch(e){

            console.error(e);

          }

          finish();
        };


      var utter =
        new SpeechSynthesisUtterance(scene.text);

      utter.lang =
        detectLanguage(scene.text);

      utter.rate = 0.95;
      utter.pitch = 1;
      utter.volume = 1;

      utter.onstart = function(){

        setStatus(
          "🎙️ " +
          (index+1) +
          "/" +
          scenes.length +
          " sahne seslendiriliyor...",
          "warning"
        );

      };

      utter.onend = function(){

        setTimeout(function(){

          try{

            if(mediaRecorder &&
               mediaRecorder.state !== "inactive"){
              mediaRecorder.stop();
            }else{
              finish();
            }

          }catch(e){
            finish();
          }

        },200);

      };

      utter.onerror = function(){

        try{

          if(mediaRecorder &&
             mediaRecorder.state !== "inactive"){
            mediaRecorder.stop();
          }else{
            finish();
          }

        }catch(e){
          finish();
        }

      };

      mediaRecorder.start(100);

      speechSynthesis.speak(utter);

    }catch(e){

      console.error(e);
      finish();

    }

  });
}

/* =========================================================
   CANVAS SIZE
========================================================= */

function setupCanvas(){

  var format = formatEl.value;

  if(format === "9:16"){

    canvas.width = 720;
    canvas.height = 1280;

  }else if(format === "1:1"){

    canvas.width = 1080;
    canvas.height = 1080;

  }else{

    canvas.width = 1280;
    canvas.height = 720;
  }
}


/* =========================================================
   COVER DRAW
========================================================= */

function drawCover(img){

  if(!img) return;

  var cw = canvas.width;
  var ch = canvas.height;

  var iw = img.naturalWidth || img.width;
  var ih = img.naturalHeight || img.height;

  if(!iw || !ih) return;

  var scale =
    Math.max(cw/iw,ch/ih);

  var w = iw*scale;
  var h = ih*scale;

  var x = (cw-w)/2;
  var y = (ch-h)/2;

  ctx.drawImage(
    img,
    x,
    y,
    w,
    h
  );
}


/* =========================================================
   MOTION DRAW
========================================================= */

function drawMotion(img,progress,index){

  if(!img) return;

  var cw = canvas.width;
  var ch = canvas.height;

  var iw = img.naturalWidth || img.width;
  var ih = img.naturalHeight || img.height;

  if(!iw || !ih) return;

  var motion = motionEl.value;

  if(motion === "none"){

    drawCover(img);
    return;
  }

  if(motion === "auto"){

    motion =
      index % 2 === 0 ?
      "zoom" :
      "pan";
  }

  /*
    Çok küçük hareket kullanıyoruz.
    Büyük zoom GPU/CPU yükünü artırabilir.
  */

  var scale;

  if(motion === "zoom"){

    scale =
      1.02 +
      progress * 0.035;

  }else{

    scale = 1.045;
  }

  var baseScale =
    Math.max(cw/iw,ch/ih);

  var finalScale =
    baseScale * scale;

  var w = iw*finalScale;
  var h = ih*finalScale;

  var x;
  var y;

  if(motion === "pan"){

    x =
      (cw-w) *
      (0.15 + progress*0.70);

    y =
      (ch-h) *
      (0.50 - progress*0.15);

  }else{

    x =
      (cw-w)/2;

    y =
      (ch-h)/2;
  }

  ctx.drawImage(
    img,
    x,
    y,
    w,
    h
  );
}


/* =========================================================
   DARK OVERLAY
========================================================= */

function drawOverlay(){

  var g =
    ctx.createLinearGradient(
      0,
      canvas.height*0.45,
      0,
      canvas.height
    );

  g.addColorStop(0,"rgba(0,0,0,0)");
  g.addColorStop(1,"rgba(0,0,0,.72)");

  ctx.fillStyle = g;

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );
}


/* =========================================================
   SUBTITLE WRAP
========================================================= */

function wrapText(text,maxWidth,font){

  ctx.font = font;

  var words =
    String(text || "").split(/\s+/);

  var lines = [];
  var line = "";

  for(var i=0;i<words.length;i++){

    var test =
      line ?
      line + " " + words[i] :
      words[i];

    if(ctx.measureText(test).width > maxWidth &&
       line){

      lines.push(line);
      line = words[i];

    }else{

      line = test;
    }
  }

  if(line){
    lines.push(line);
  }

  return lines;
}


/* =========================================================
   SUBTITLE DRAW
========================================================= */

function drawSubtitle(text){

  if(subtitleModeEl.value === "off"){
    return;
  }

  var size =
    parseInt(
      subtitleSizeEl.value,
      10
    );

  var font =
    "bold " +
    size +
    "px Arial";

  var lines =
    wrapText(
      text,
      canvas.width*0.82,
      font
    );

  var lineHeight =
    size * 1.35;

  var total =
    lines.length * lineHeight;

  var y =
    canvas.height -
    total -
    canvas.height*0.075;

  ctx.textAlign = "center";
  ctx.textBaseline = "top";
  ctx.font = font;

  for(var i=0;i<lines.length;i++){

    var yy = y + i*lineHeight;

    /*
      Siyah kontur.
    */

    ctx.lineWidth = 7;
    ctx.strokeStyle = "rgba(0,0,0,.92)";
    ctx.strokeText(
      lines[i],
      canvas.width/2,
      yy
    );

    ctx.fillStyle = "#ffffff";

    ctx.fillText(
      lines[i],
      canvas.width/2,
      yy
    );
  }

  ctx.textAlign = "left";
}


/* =========================================================
   DRAW FRAME
========================================================= */

function drawFrame(scene,progress,index){

  /*
    Her frame'in tamamı yeniden çiziliyor.
    Fakat ses decode/play işlemi burada YOK.
    Bu önemli performans farkı yaratır.
  */

  ctx.fillStyle = "#000";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  drawMotion(
    scene.image,
    progress,
    index
  );

  drawOverlay();

  drawSubtitle(scene.text);
}


/* =========================================================
   AUDIO DECODE
========================================================= */

async function decodeAudioBlob(blob){

  var AudioCtx =
    window.AudioContext ||
    window.webkitAudioContext;

  if(!AudioCtx){
    throw new Error(
      "AudioContext desteklenmiyor."
    );
  }

  var ac = new AudioCtx();

  var arr =
    await blob.arrayBuffer();

  var buffer =
    await ac.decodeAudioData(arr);

  try{
    await ac.close();
  }catch(e){}

  return buffer;
}


/* =========================================================
   RENDER VIDEO
========================================================= */

async function renderVideo(){

  if(!scenes.length){

    setStatus(
      "Önce sahneleri oluştur.",
      "warning"
    );

    return;
  }

  renderVideoBtn.disabled = true;
  createScenesBtn.disabled = true;
  generateAllBtn.disabled = true;
  speakAllBtn.disabled = true;

  stopRequested = false;

  try{

    setStatus(
      "Render öncesi kontrol yapılıyor...",
      "warning"
    );

    validateScenes();

    setupCanvas();

    /*
      Görsellerin tamamını önceden hazırla.
    */

    await preloadImages();

    /*
      AudioContext sadece render için açılır.
    */

    var AudioCtx =
      window.AudioContext ||
      window.webkitAudioContext;

    var audioContext =
      new AudioCtx();

    if(audioContext.state === "suspended"){
      await audioContext.resume();
    }

    /*
      Tek bir destination.
    */

    var destination =
      audioContext.createMediaStreamDestination();

    /*
      Canvas video stream.
    */

    var fps =
      renderModeEl.value === "quality" ?
      24 :
      renderModeEl.value === "max" ?
      30 :
      20;

    var canvasStream =
      canvas.captureStream(fps);

    /*
      Canvas video + WebAudio audio.
    */

    var combined =
      new MediaStream();

    canvasStream
      .getVideoTracks()
      .forEach(function(track){
        combined.addTrack(track);
      });

    destination.stream
      .getAudioTracks()
      .forEach(function(track){
        combined.addTrack(track);
      });


    /*
      MIME seçimi.
    */

    var mime = "";

    var mimeCandidates = [

      "video/webm;codecs=vp8,opus",
      "video/webm;codecs=vp9,opus",
      "video/webm"
    ];

    for(var mi=0;mi<mimeCandidates.length;mi++){

      if(MediaRecorder.isTypeSupported(
        mimeCandidates[mi]
      )){

        mime =
          mimeCandidates[mi];

        break;
      }
    }

    if(!mime){
      throw new Error(
        "WebM MediaRecorder desteklenmiyor."
      );
    }


    var recorder =
      new MediaRecorder(
        combined,
        {
          mimeType:mime,
          videoBitsPerSecond:
            renderModeEl.value === "stable" ?
            3000000 :
            renderModeEl.value === "quality" ?
            5000000 :
            6500000,
          audioBitsPerSecond:128000
        }
      );

    var chunks = [];

    recorder.ondataavailable =
      function(e){

        if(e.data && e.data.size){
          chunks.push(e.data);
        }
      };


    /*
      Render kaydı başlat.
    */

    recorder.start(1000);


    /*
      Ses buffer'larını sırayla render edeceğiz.
      Aynı anda yalnızca aktif sahnenin
      AudioBufferSource'u çalışacak.
    */

    var totalDuration = scenes.reduce(
      function(sum,s){
        return sum + s.audioDuration;
      },
      0
    );

    var totalElapsed = 0;


    for(var i=0;i<scenes.length;i++){

      if(stopRequested){
        break;
      }

      var scene = scenes[i];

      setStatus(
        "🎥 Render: Sahne " +
        (i+1) +
        "/" +
        scenes.length +
        " • " +
        scene.audioDuration.toFixed(1) +
        " sn",
        "warning"
      );


      /*
        Buffer decode.
      */

      var audioBuffer =
        await decodeAudioBlob(
          scene.audioBlob
        );


      /*
        Audio kaynağı.
      */

      var source =
        audioContext.createBufferSource();

      source.buffer = audioBuffer;

      source.connect(destination);


      /*
        Render başlangıç zamanı.
      */

      var sceneStart =
        performance.now();

      var duration =
        scene.audioDuration * 1000;

      /*
        Kaynak sesi başlat.
      */

      source.start(0);


      /*
        STABLE LOOP
        -------------------------
        requestAnimationFrame yerine
        kontrollü setTimeout kullanılıyor.

        Bunun amacı Chrome'un aşırı
        frame üretmesini engellemek.
      */

      var finished = false;

      await new Promise(function(resolve){

        function tick(){

          if(finished){
            return;
          }

          if(stopRequested){

            finished = true;

            try{
              source.stop();
            }catch(e){}

            resolve();
            return;
          }

          var now =
            performance.now();

          var elapsed =
            now - sceneStart;

          var progress =
            Math.min(
              1,
              elapsed / duration
            );

          drawFrame(
            scene,
            progress,
            i
          );

          totalElapsed += 0;

          var globalProgress =
            (
              (
                scenes
                  .slice(0,i)
                  .reduce(
                    function(a,b){
                      return a+b.audioDuration;
                    },
                    0
                  )
                +
                progress*scene.audioDuration
              )
              /
              totalDuration
            ) * 100;

          setProgress(
            globalProgress
          );

          if(elapsed >= duration){

            finished = true;

            try{
              source.stop();
            }catch(e){}

            /*
              Son kareyi bir kez daha çiz.
            */

            drawFrame(
              scene,
              1,
              i
            );

            resolve();
            return;
          }

          /*
            20 FPS ≈ 50 ms
            24 FPS ≈ 41.6 ms
            30 FPS ≈ 33.3 ms
          */

          var interval =
            1000 / fps;

          setTimeout(
            tick,
            interval
          );
        }

        tick();

      });


      /*
        Audio node'u temizle.
      */

      try{
        source.disconnect();
      }catch(e){}


      /*
        Sahne sonrası Chrome'a
        çok kısa nefes.
      */

      await sleep(15);

    }


    /*
      Render durdur.
    */

    await sleep(250);

    if(recorder.state !== "inactive"){
      recorder.stop();
    }


    /*
      Recorder onstop bekle.
    */

    await new Promise(function(resolve){

      if(recorder.state === "inactive"){
        resolve();
      }else{
        recorder.onstop =
          function(){
            resolve();
          };
      }

    });


    /*
      Bazı Chrome sürümlerinde onstop
      zaten tetiklenmiş olabilir.
      Kısa bekleme.
    */

    await sleep(300);


    var finalBlob =
      new Blob(
        chunks,
        {type:mime}
      );


    if(generatedVideoURL){
      URL.revokeObjectURL(
        generatedVideoURL
      );
    }

    generatedVideoURL =
      URL.createObjectURL(
        finalBlob
      );


    videoPreview.src =
      generatedVideoURL;

    videoPreview.load();


    downloadLink.href =
      generatedVideoURL;

    downloadLink.style.display =
      "inline-block";


    setProgress(100);

    setStatus(
      "🎉 Video hazır! " +
      formatTime(totalDuration) +
      " • " +
      Math.round(finalBlob.size/1024/1024) +
      " MB",
      "ok"
    );


    try{
      await audioContext.close();
    }catch(e){}


  }catch(err){

    console.error(err);

    setStatus(
      "Render hatası: " +
      err.message,
      "error"
    );

  }finally{

    renderVideoBtn.disabled = false;
    createScenesBtn.disabled = false;
    generateAllBtn.disabled = false;
    speakAllBtn.disabled = false;
  }
}


/* =========================================================
   FORMAT TIME
========================================================= */

function formatTime(sec){

  sec = Math.max(
    0,
    Math.floor(sec || 0)
  );

  var h =
    Math.floor(sec/3600);

  var m =
    Math.floor((sec%3600)/60);

  var s =
    sec%60;

  if(h > 0){

    return (
      String(h).padStart(2,"0") +
      ":" +
      String(m).padStart(2,"0") +
      ":" +
      String(s).padStart(2,"0")
    );

  }

  return (
    String(m).padStart(2,"0") +
    ":" +
    String(s).padStart(2,"0")
  );
}


/* =========================================================
   HELPERS

function sleep(ms){

  return new Promise(function(resolve){
    setTimeout(resolve,ms);
  });
}

/* =========================================================
   GLOBAL ERROR
========================================================= */

window.onerror = function(
  message,
  source,
  lineno,
  colno,
  error
){

  console.error(
    message,
    source,
    lineno,
    colno,
    error
  );

  setStatus(
    "JavaScript hatası: " +
    message,
    "error"
  );

  return false;
};


window.onunhandledrejection =
function(event){

  console.error(
    "Unhandled Promise:",
    event.reason
  );

  setStatus(
    "İşlem hatası: " +
    (
      event.reason &&
      event.reason.message
      ?
      event.reason.message
      :
      event.reason
    ),
    "error"
  );
};
