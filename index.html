<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mina Film Studio V4.1</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#090b10;
    color:#eee;
    font-family:Arial,Helvetica,sans-serif;
}

header{
    padding:18px;
    background:#11151d;
    border-bottom:1px solid #292f3b;
}

h1{
    margin:0;
    color:#fff;
    font-size:25px;
}

header p{
    margin:6px 0 0;
    color:#9da6b5;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:18px;
}

.panel{
    background:#11151d;
    border:1px solid #292f3b;
    border-radius:12px;
    padding:16px;
    margin-bottom:16px;
}

label{
    display:block;
    margin-bottom:6px;
    color:#cfd5df;
    font-weight:bold;
}

input[type=text],
textarea,
select{
    width:100%;
    background:#080a0f;
    color:#fff;
    border:1px solid #343b48;
    border-radius:8px;
    padding:10px;
    outline:none;
}

textarea{
    min-height:90px;
    resize:vertical;
}

button{
    background:#202735;
    border:1px solid #3a4352;
    color:#fff;

    padding:10px 14px;
    cursor:pointer;
    margin:4px;
}

button:hover{
    background:#2c3545;
}

button.primary{
    background:#5b36d6;
    border-color:#7759df;
}

button.danger{
    background:#6c2424;
}

button.green{

}

.scene{
    border:1px solid #303744;
    border-radius:12px;

    background:#0d1118;
}

.scene h3{
    margin-top:0;
    color:#fff;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

@media(max-width:800px){
    .grid{
        grid-template-columns:1fr;
    }
}

.fileBox{
    border:1px dashed #465064;
    border-radius:8px;
    padding:10px;
    background:#090c12;
}

.fileStatus{
    margin-top:7px;
    font-size:13px;
    color:#7ee2a8;

}

.previewWrap{
    background:#000;
    border-radius:10px;
    overflow:hidden;
    border:1px solid #303744;
}

#preview{
    width:100%;

    background:#000;
}

.controls{
    display:flex;

}

}

</style>
</head>

</header>

<div class="container">

</div>

<script>

"use strict";

/* =========================================================
   MINA FILM STUDIO V4.1
   ========================================================= */

const W = 1280;
const H = 720;

const canvas = document.getElementById("preview");
const ctx = canvas.getContext("2d");

let scenes = [];

let previewIndex = 0;
let previewTimer = null;
let previewPlaying = false;

let musicFile = null;
let musicURL = null;

let renderCancelled = false;


/* =========================================================

            prompt:"Old wooden door opening by itself at midnight, dark horror mystery, cinematic realistic lighting, 16:9",
            duration:5,
            motion:"panRight",
            transition:"fade",
            image:null,
            imageURL:null,
            audio:null,
            audioURL:null,
            audioName:""
        },

        {
            title:"The dark corridor",
            narration:"Anna betritt den dunklen Flur.",
            prompt:"Long dark corridor inside abandoned house, woman standing at entrance, cinematic mystery, realistic, 16:9",
            duration:5,
            motion:"float",
            transition:"fade",
            image:null,
            imageURL:null,
            audio:null,
            audioURL:null,
            audioName:""
        },

        {
            title:"The shadow",
            narration:"Am Ende des Flurs erscheint ein seltsamer Schatten.",
            prompt:"Mysterious human shadow at end of dark corridor, cinematic horror mystery, realistic, dramatic lighting, 16:9",
            duration:5,

        }

    ];

}


/* =========================================================
   INITIALIZE
   ========================================================= */

scenes = defaultScenes();

renderSceneEditors();

drawPreview();


/* =========================================================
   SCENE EDITORS
   ========================================================= */

function renderSceneEditors(){

    const container = document.getElementById("scenes");

    container.innerHTML = "";

    scenes.forEach((scene,index)=>{

        const div = document.createElement("div");

        div.className = "scene";

        div.innerHTML = `

            <h3>🎬 Sahne ${index+1}: ${escapeHTML(scene.title)}</h3>

            <div class="grid">

                <div>

                    <label>Görsel yükle</label>

                    <div class="fileBox">

                        <input
                            type="file"
                            accept="image/*"
                            onchange="loadSceneImage(${index},this)"
                        >

                        <div
                            id="imageStatus${index}"
                            class="fileStatus"
                        >
                            ${scene.image ? "Görsel yüklendi." : "Henüz görsel yüklenmedi."}
                        </div>

                    </div>

                </div>


                <div>

                    <label>Ses yükle</label>

                    <div class="fileBox">

                        <input
                            type="file"
                            accept="audio/*"
                            onchange="loadSceneAudio(${index},this)"
                        >

                        <div
                            id="audioStatus${index}"
                            class="fileStatus"
                        >
                            ${
                                scene.audioName
                                ? "🔊 " + escapeHTML(scene.audioName)
                                : "🔇 Ses yüklenmedi — sahne sessiz devam eder."
                            }
                        </div>

                    </div>

                </div>

            </div>

            <br>

            <div class="grid">

                <div>

                    <label>Kamera hareketi</label>

                    <select onchange="changeScene(${index},'motion',this.value)">

                        <option value="zoomIn" ${scene.motion==="zoomIn"?"selected":""}>
                            🔍 Zoom In
                        </option>

                        <option value="zoomOut" ${scene.motion==="zoomOut"?"selected":""}>
                            🔎 Zoom Out
                        </option>

                        <option value="panLeft" ${scene.motion==="panLeft"?"selected":""}>
                            ◀ Pan Left
                        </option>

                        <option value="panRight" ${scene.motion==="panRight"?"selected":""}>
                            ▶ Pan Right
                        </option>

                        <option value="float" ${scene.motion==="float"?"selected":""}>
                            🌊 Float
                        </option>

                        <option value="static" ${scene.motion==="static"?"selected":""}>
                            ⏹ Sabit
                        </option>

                    </select>

                </div>


                <div>

                    <label>Süre</label>

                    <select onchange="changeScene(${index},'duration',Number(this.value))">

                        <option value="5" ${scene.duration===5?"selected":""}>5 saniye</option>
                        <option value="8" ${scene.duration===8?"selected":""}>8 saniye</option>
                        <option value="10" ${scene.duration===10?"selected":""}>10 saniye</option>
                        <option value="15" ${scene.duration===15?"selected":""}>15 saniye</option>
                        <option value="20" ${scene.duration===20?"selected":""}>20 saniye</option>

                    </select>

                </div>

            </div>

            <br>

            <div class="grid">

                <div>

                    <label>Geçiş</label>

                    <select onchange="changeScene(${index},'transition',this.value)">

                        <option value="fade" ${scene.transition==="fade"?"selected":""}>
                            🎞️ Fade to Black
                        </option>

                        <option value="none" ${scene.transition==="none"?"selected":""}>
                            ⏹ Geçiş Yok
                        </option>

                    </select>

                </div>

                <div></div>

            </div>

            <br>

            <label>Almanca seslendirme / altyazı</label>

            <textarea
                oninput="changeScene(${index},'narration',this.value)"
            >${escapeHTML(scene.narration)}</textarea>

            <br>

            <label>AI Görsel Promptu</label>

            <textarea
                oninput="changeScene(${index},'prompt',this.value)"
            >${escapeHTML(scene.prompt)}</textarea>

        `;

        container.appendChild(div);

    });

}


/* =========================================================
   SAFE HTML
   ========================================================= */

function escapeHTML(text){

    if(text===undefined || text===null){
        return "";
    }

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;");

}


/* =========================================================
   CHANGE SCENE
   ========================================================= */

function changeScene(index,key,value){

    scenes[index][key]=value;

    drawPreview();

}


/* =========================================================
   IMAGE UPLOAD
   ========================================================= */

function loadSceneImage(index,input){

    const file = input.files && input.files[0];

    if(!file){
        return;
    }

    scenes[index].image = file;

    const reader = new FileReader();

    reader.onload = function(e){

        scenes[index].imageURL = e.target.result;

        const status =
            document.getElementById("imageStatus"+index);

        if(status){
            status.textContent =
                "🖼️ " + file.name + " yüklendi.";
        }

        setStatus(
            "previewStatus",
            "Sahne "+(index+1)+" görseli yüklendi."
        );

        drawPreview();

    };

    reader.onerror = function(){

        setStatus(
            "previewStatus",
            "Görsel okunamadı."
        );

    };

    reader.readAsDataURL(file);

}


/* =========================================================
   AUDIO UPLOAD
   ========================================================= */

function loadSceneAudio(index,input){

    const file = input.files && input.files[0];

    if(!file){
        return;
    }

    scenes[index].audio = file;
    scenes[index].audioName = file.name;

    const reader = new FileReader();

    reader.onload = function(e){

        scenes[index].audioURL = e.target.result;

        const status =
            document.getElementById("audioStatus"+index);

        if(status){

            status.textContent =
                "🔊 " + file.name +
                " (" + Math.round(file.size/1024) + " KB)";

        }

        setStatus(
            "previewStatus",
            "Sahne "+(index+1)+" ses dosyası yüklendi."
        );

    };

    reader.onerror = function(){

        setStatus(
            "previewStatus",
            "Ses dosyası okunamadı."
        );

    };

    reader.readAsDataURL(file);

}


/* =========================================================
   MUSIC UPLOAD
   ========================================================= */

document
.getElementById("musicInput")
.addEventListener("change",function(){

    const file=this.files && this.files[0];

    if(!file){
        return;
    }

    musicFile=file;

    if(musicURL){
        URL.revokeObjectURL(musicURL);
    }

    musicURL=URL.createObjectURL(file);

    document.getElementById("musicStatus").textContent =
        "🎵 " + file.name +
        " (" + Math.round(file.size/1024) + " KB) yüklendi.";

});


/* =========================================================
   PREVIEW IMAGE LOADER
   ========================================================= */

function getImage(url){

    return new Promise(function(resolve){

        if(!url){

            resolve(null);
            return;

        }

        const img=new Image();

        img.onload=function(){
            resolve(img);
        };

        img.onerror=function(){
            resolve(null);
        };

        img.src=url;

    });

}


/* =========================================================
   DRAW SCENE
   ========================================================= */

function drawSceneToCanvas(scene,progress,fadeAmount){

    ctx.clearRect(0,0,W,H);

    ctx.fillStyle="#000";
    ctx.fillRect(0,0,W,H);

    if(!scene || !scene.imageURL){

        drawSubtitles(scene);

        if(fadeAmount>0){

            ctx.fillStyle=
                "rgba(0,0,0,"+fadeAmount+")";

            ctx.fillRect(0,0,W,H);

        }

        return;

    }

    const imgCache =
        scene._imageObject;

    if(!imgCache){

        drawSubtitles(scene);

        if(fadeAmount>0){

            ctx.fillStyle=
                "rgba(0,0,0,"+fadeAmount+")";

            ctx.fillRect(0,0,W,H);

        }

        return;

    }

    const img=imgCache;

    const scaleBase=Math.max(
        W/img.width,
        H/img.height
    );

    let scale=scaleBase;

    if(scene.motion==="zoomIn"){
        scale=scaleBase*(1+0.08*progress);
    }

    else if(scene.motion==="zoomOut"){
        scale=scaleBase*(1.08-0.08*progress);
    }

    else if(scene.motion==="float"){
        scale=scaleBase*(1+0.025*Math.sin(progress*Math.PI*2));
    }

    const dw=img.width*scale;
    const dh=img.height*scale;

    let x=(W-dw)/2;
    let y=(H-dh)/2;

    if(scene.motion==="panLeft"){
        x=(W-dw)/2 + (dw-W)*0.20*progress;
    }

    if(scene.motion==="panRight"){
        x=(W-dw)/2 - (dw-W)*0.20*progress;
    }

    ctx.drawImage(
        img,
        x,
        y,
        dw,
        dh
    );


    /* Vignette */

    const gradient=ctx.createRadialGradient(
        W/2,
        H/2,
        H*0.15,
        W/2,
        H/2,
        H*0.75
    );

    gradient.addColorStop(0,"rgba(0,0,0,0)");
    gradient.addColorStop(1,"rgba(0,0,0,0.58)");

    ctx.fillStyle=gradient;
    ctx.fillRect(0,0,W,H);


    /* Subtitles */

    drawSubtitles(scene);


    /* Fade */

    if(fadeAmount>0){

        ctx.fillStyle=
            "rgba(0,0,0,"+fadeAmount+")";

        ctx.fillRect(0,0,W,H);

    }

}


/* =========================================================
   SUBTITLE
   ========================================================= */

function drawSubtitles(scene){

    if(!scene || !scene.narration){
        return;
    }

    const text=scene.narration.trim();

    if(!text){
        return;
    }

    const maxWidth=1050;

    ctx.font="bold 32px Arial";

    const words=text.split(" ");

    let lines=[];
    let current="";

    words.forEach(function(word){

        const test=
            current
            ? current+" "+word
            : word;

        if(ctx.measureText(test).width>maxWidth){

            if(current){
                lines.push(current);
            }

            current=word;

        }else{

            current=test;

        }

    });

    if(current){
        lines.push(current);
    }

    const lineHeight=42;

    const boxHeight=
        lines.length*lineHeight+34;

    const boxY=
        H-boxHeight-28;

    ctx.fillStyle=
        "rgba(0,0,0,0.72)";

    ctx.fillRect(
        55,
        boxY,
        W-110,
        boxHeight
    );

    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillStyle="#fff";

    lines.forEach(function(line,i){

        ctx.fillText(
            line,
            W/2,
            boxY+25+i*lineHeight
        );

    });

    ctx.textAlign="left";
    ctx.textBaseline="alphabetic";

}


/* =========================================================
   PRELOAD IMAGES
   ========================================================= */

async function preloadImages(){

    for(let i=0;i<scenes.length;i++){

        const scene=scenes[i];

        if(!scene.imageURL){

            scene._imageObject=null;
            continue;

        }

        scene._imageObject=
            await getImage(scene.imageURL);

    }

}


/* =========================================================
   PREVIEW
   ========================================================= */

function drawPreview(){

    const scene=scenes[previewIndex];

    if(!scene){
        return;
    }

    if(scene.imageURL && !scene._imageObject){

        getImage(scene.imageURL).then(function(img){

            scene._imageObject=img;
            drawPreview();

        });

    }

    drawSceneToCanvas(
        scene,
        0.5,
        0
    );

    document.getElementById("previewStatus").textContent =
        "Sahne "+(previewIndex+1)+"/"+scenes.length+
        " — "+scene.title;

}


function previewPlay(){

    if(previewPlaying){
        return;
    }

    previewPlaying=true;

    let start=performance.now();

    const sceneDuration=
        scenes[previewIndex].duration*1000;

    function tick(now){

        if(!previewPlaying){
            return;
        }

        const elapsed=now-start;

        const progress=
            Math.min(
                1,
                elapsed/sceneDuration
            );

        let fade=0;

        if(
            scenes[previewIndex].transition==="fade" &&
            progress>0.82
        ){

            fade=
                (progress-0.82)/0.18;

        }

        drawSceneToCanvas(
            scenes[previewIndex],
            progress,
            fade
        );

        if(elapsed>=sceneDuration){

            if(previewIndex<scenes.length-1){

                previewIndex++;

                drawPreview();

                start=performance.now();

            }else{

                previewPlaying=false;

                previewIndex=0;

                drawPreview();

            }

            return;

        }

        requestAnimationFrame(tick);

    }

    requestAnimationFrame(tick);

}


function previewPause(){

    previewPlaying=false;

}


function previewRestart(){

    previewPlaying=false;

    previewIndex=0;

    drawPreview();

}


function previewNext(){

    previewPlaying=false;

    if(previewIndex<scenes.length-1){
        previewIndex++;
    }

    drawPreview();

}


function previewPrevious(){

    previewPlaying=false;

    if(previewIndex>0){
        previewIndex--;
    }

    drawPreview();

}


/* =========================================================
   AUDIO HELPERS
   ========================================================= */

async function decodeAudio(dataURL,audioContext){

    if(!dataURL){
        return null;
    }

    try{

        const response=
            await fetch(dataURL);

        const arrayBuffer=
            await response.arrayBuffer();

        const buffer=
            await audioContext.decodeAudioData(
                arrayBuffer
            );

        return buffer;

    }catch(error){

        console.warn(
            "Ses çözülemedi:",
            error
        );

        return null;

    }

}


/* =========================================================
   RENDER VIDEO
   ========================================================= */

async function renderVideo(){

    renderCancelled=false;

    document.getElementById("downloadArea").innerHTML="";

    setProgress(0);

    setStatus(
        "renderStatus",
        "⏳ Hazırlanıyor..."
    );

    try{

        await preloadImages();

        if(!window.MediaRecorder){

            throw new Error(
                "Tarayıcınız MediaRecorder desteklemiyor."
            );

        }


        let mimeType="";

        const types=[
            "video/webm;codecs=vp8,opus",
            "video/webm;codecs=vp9,opus",
            "video/webm"
        ];

        for(let i=0;i<types.length;i++){

            if(
                MediaRecorder.isTypeSupported &&
                MediaRecorder.isTypeSupported(types[i])
            ){

                mimeType=types[i];
                break;

            }

        }

        if(!mimeType){
            mimeType="video/webm";
        }


        const stream=
            canvas.captureStream(30);


        const audioContext=
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();


        const destination=
            audioContext.createMediaStreamDestination();


        /* Canvas video + audio */

        const combinedStream=
            new MediaStream();


        stream
        .getVideoTracks()
        .forEach(function(track){

            combinedStream.addTrack(track);

        });


        destination
        .stream
        .getAudioTracks()
        .forEach(function(track){

            combinedStream.addTrack(track);

        });


        const chunks=[];


        const recorder=
            new MediaRecorder(
                combinedStream,
                {
                    mimeType:mimeType,
                    videoBitsPerSecond:6000000
                }
            );


        recorder.ondataavailable=function(e){

            if(e.data && e.data.size>0){
                chunks.push(e.data);
            }

        };


        const recorderStopped=
            new Promise(function(resolve){

                recorder.onstop=resolve;

            });


        /* =================================================
           TOTAL TIME
           ================================================= */

        let totalDuration=0;

        scenes.forEach(function(scene){

            totalDuration+=
                Number(scene.duration)||5;

        });


        /* =================================================
           MUSIC
           ================================================= */

        let musicSource=null;
        let musicBuffer=null;

        if(musicFile){

            setStatus(
                "renderStatus",
                "🎵 Arka plan müziği hazırlanıyor..."
            );

            try{

                musicBuffer=
                    await decodeAudio(
                        await fileToDataURL(musicFile),
                        audioContext
                    );

            }catch(e){

                console.warn(
                    "Müzik çözülemedi",
                    e
                );

            }

        }


        /* =================================================
           SCENE AUDIO BUFFERS
           ================================================= */

        const audioBuffers=[];

        for(let i=0;i<scenes.length;i++){

            if(renderCancelled){
                throw new Error("Render iptal edildi.");
            }

            const scene=scenes[i];

            if(scene.audioURL){

                setStatus(
                    "renderStatus",
                    "🔊 Ses hazırlanıyor: Sahne "+(i+1)
                );

                const buffer=
                    await decodeAudio(
                        scene.audioURL,
                        audioContext
                    );

                audioBuffers[i]=buffer;

            }else{

                audioBuffers[i]=null;

            }

        }


        /* =================================================
           START AUDIO
           ================================================= */

        if(audioContext.state==="suspended"){

            await audioContext.resume();

        }


        const renderStart=
            audioContext.currentTime+0.5;


        let timeline=0;


        /* Background music */

        if(musicBuffer){

            musicSource=
                audioContext.createBufferSource();

            musicSource.buffer=musicBuffer;
            musicSource.loop=true;

            const musicGain=
                audioContext.createGain();

            musicGain.gain.value=
                Number(
                    document.getElementById(
                        "musicVolume"
                    ).value
                );

            musicSource
                .connect(musicGain)
                .connect(destination);

            musicSource.start(
                renderStart
            );

        }


        /* Scene audio */

        for(let i=0;i<scenes.length;i++){

            const buffer=audioBuffers[i];

            if(buffer){

                const source=
                    audioContext.createBufferSource();

                source.buffer=buffer;

                const gain=
                    audioContext.createGain();

                gain.gain.value=0.95;

                source
                    .connect(gain)
                    .connect(destination);

                source.start(
                    renderStart+timeline
                );

            }

            timeline+=
                Number(scenes[i].duration)||5;

        }


        /* =================================================
           START RECORDER
           ================================================= */

        recorder.start(250);


        /* =================================================
           RENDER FRAMES
           ================================================= */

        let elapsedTimeline=0;

        for(let i=0;i<scenes.length;i++){

            if(renderCancelled){

                throw new Error(
                    "Render iptal edildi."
                );

            }

            const scene=scenes[i];

            const duration=
                Number(scene.duration)||5;

            const fps=30;

            const frames=
                Math.max(
                    1,
                    Math.floor(duration*fps)
                );


            for(let frame=0;frame<frames;frame++){

                if(renderCancelled){

                    throw new Error(
                        "Render iptal edildi."
                    );

                }

                const progress=
                    frame/(frames-1 || 1);


                let fade=0;

                /*
                    Fade-to-black son %18
                    Son sahnede de fade uygulanır.
                */

                if(
                    scene.transition==="fade" &&
                    progress>0.82
                ){

                    fade=
                        Math.min(
                            1,
                            (progress-0.82)/0.18
                        );

                }


                drawSceneToCanvas(
                    scene,
                    progress,
                    fade
                );


                const percent=
                    (
                        (elapsedTimeline+
                        duration*progress)
                        /
                        totalDuration
                    )*100;


                setProgress(percent);


                setStatus(
                    "renderStatus",
                    "🎬 Sahne "+
                    (i+1)+"/"+scenes.length+
                    " hazırlanıyor... "+
                    Math.round(percent)+"%"
                );


                await wait(
                    1000/fps
                );

            }


            elapsedTimeline+=duration;

        }


        /* Final frame */

        drawSceneToCanvas(
            scenes[scenes.length-1],
            1,
            1
        );


        setProgress(100);


        setStatus(
            "renderStatus",
            "⏳ Video dosyası hazırlanıyor..."
        );


        await wait(500);


        if(musicSource){

            try{
                musicSource.stop();
            }catch(e){}

        }


        try{

            recorder.stop();

        }catch(e){}


        await recorderStopped;


        /* Audio cleanup */

        try{
            await audioContext.close();
        }catch(e){}


        if(renderCancelled){

            throw new Error(
                "Render iptal edildi."
            );

        }


        const blob=
            new Blob(
                chunks,
                {
                    type:"video/webm"
                }
            );


        const url=
            URL.createObjectURL(blob);


        const sizeMB=
            blob.size/
            1024/
            1024;


        const fileName=
            safeFileName(
                document.getElementById(
                    "filmName"
                ).value || "MinaFilm"
            )+
            ".webm";


        document.getElementById(
            "downloadArea"
        ).innerHTML=

            '<a class="download" '+
            'href="'+url+'" '+
            'download="'+fileName+'">'+
            '⬇️ VİDEOYU İNDİR ('+
            sizeMB.toFixed(1)+
            ' MB)'+
            '</a>';


        setStatus(
            "renderStatus",
            "✅ VİDEO HAZIR!\n"+
            "Dosya: "+fileName+
            "\nBoyut: "+sizeMB.toFixed(1)+" MB"
        );


    }catch(error){

        console.error(error);

        setProgress(0);


        if(
            error &&
            error.message==="Render iptal edildi."
        ){

            setStatus(
                "renderStatus",
                "❌ Render iptal edildi."
            );

        }else{

            setStatus(
                "renderStatus",
                "⚠️ Render sırasında hata oluştu:\n"+
                (
                    error &&
                    error.message
                    ? error.message
                    : error
                )+
                "\n\nSes yüklenmemiş sahneler videoyu durdurmaz."
            );

        }

    }

}


/* =========================================================
   FILE TO DATA URL
   ========================================================= */

function fileToDataURL(file){

    return new Promise(function(resolve,reject){

        const reader=
            new FileReader();

        reader.onload=function(){
            resolve(reader.result);
        };

        reader.onerror=function(){
            reject(reader.error);
        };

        reader.readAsDataURL(file);

    });

}


/* =========================================================
   CANCEL
   ========================================================= */

function cancelRender(){

    renderCancelled=true;

    setStatus(
        "renderStatus",
        "❌ Render durduruluyor..."
    );

}


/* =========================================================
   WAIT
   ========================================================= */

function wait(ms){

    return new Promise(function(resolve){

        setTimeout(
            resolve,
            ms
        );

    });

}


/* =========================================================
   PROGRESS
   ========================================================= */

function setProgress(value){

    value=
        Math.max(
            0,
            Math.min(
                100,
                value
            )
        );

    document.getElementById(
        "progress"
    ).style.width=
        value+"%";

}


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(id,text){

    const el=
        document.getElementById(id);

    if(el){
        el.textContent=text;
    }

}


/* =========================================================
   SAFE FILENAME
   ========================================================= */

function safeFileName(name){

    return name
        .replace(/[\\\/:*?"<>|]/g,"_")
        .replace(/\s+/g,"_")
        .substring(0,80);

}


/* =========================================================
   SAVE PROJECT
   ========================================================= */

async function saveProject(){

    try{

        const saveData={
            filmName:
                document.getElementById(
                    "filmName"
                ).value,

            language:
                document.getElementById(
                    "language"
                ).value,

            story:
                document.getElementById(
                    "story"
                ).value,

            musicData:null,

            musicName:
                musicFile
                ? musicFile.name
                : "",

            scenes:[]
        };


        /* Scene data */

        for(let i=0;i<scenes.length;i++){

            const scene=scenes[i];

            saveData.scenes.push({

                title:scene.title,

                narration:scene.narration,

                prompt:scene.prompt,

                duration:scene.duration,

                motion:scene.motion,

                transition:scene.transition,

                imageURL:scene.imageURL,

                audioURL:scene.audioURL,

                audioName:scene.audioName

            });

        }


        /*
           Müzik dosyasını da kaydetmeye çalış.
           Büyük dosyalarda localStorage sınırı
           nedeniyle kaydetme başarısız olabilir.
        */

        if(musicFile){

            try{

                saveData.musicData=
                    await fileToDataURL(
                        musicFile
                    );

            }catch(e){

                saveData.musicData=null;

            }

        }


        localStorage.setItem(
            "minaFilmStudioV41",
            JSON.stringify(saveData)
        );


        setStatus(
            "renderStatus",
            "💾 Proje kaydedildi."
        );


    }catch(error){

        setStatus(
            "renderStatus",
            "⚠️ Proje kaydedilemedi.\n"+
            "Dosyalar çok büyük olabilir."
        );

    }

}


/* =========================================================
   LOAD PROJECT
   ========================================================= */

function loadProject(){

    try{

        const raw=
            localStorage.getItem(
                "minaFilmStudioV41"
            );


        if(!raw){

            setStatus(
                "renderStatus",
                "Kayıtlı proje bulunamadı."
            );

            return;

        }


        const data=
            JSON.parse(raw);


        document.getElementById(
            "filmName"
        ).value=
            data.filmName || "";


        document.getElementById(
            "language"
        ).value=
            data.language || "de-DE";


        document.getElementById(
            "story"
        ).value=
            data.story || "";


        if(
            data.scenes &&
            data.scenes.length
        ){

            scenes=
                data.scenes.map(function(s){

                    return {

                        title:s.title || "",

                        narration:
                            s.narration || "",

                        prompt:
                            s.prompt || "",

                        duration:
                            Number(s.duration)||5,

                        motion:
                            s.motion || "zoomIn",

                        transition:
                            s.transition || "fade",

                        image:null,

                        imageURL:
                            s.imageURL || null,

                        audio:null,

                        audioURL:
                            s.audioURL || null,

                        audioName:
                            s.audioName || "",

                        _imageObject:null

                    };

                });

        }


        if(data.musicData){

            const musicBlob=
                dataURLToBlob(
                    data.musicData
                );

            musicFile=
                new File(
                    [musicBlob],
                    data.musicName ||
                    "background_music",
                    {
                        type:
                            musicBlob.type ||
                            "audio/mpeg"
                    }
                );


            if(musicURL){
                URL.revokeObjectURL(musicURL);
            }

            musicURL=
                URL.createObjectURL(
                    musicFile
                );


            document.getElementById(
                "musicStatus"
            ).textContent=
                "🎵 "+(
                    data.musicName ||
                    "Müzik"
                )+" yüklendi.";

        }


        renderSceneEditors();

        previewIndex=0;

        drawPreview();


        setStatus(
            "renderStatus",
            "📂 Proje yüklendi."
        );


    }catch(error){

        console.error(error);

        setStatus(
            "renderStatus",
            "⚠️ Proje yüklenemedi."
        );

    }

}


/* =========================================================
   DATA URL TO BLOB
   ========================================================= */

function dataURLToBlob(dataURL){

    const parts=
        dataURL.split(",");

    const mime=
        parts[0]
        .match(/:(.*?);/);

    const binary=
        atob(parts[1]);

    const len=binary.length;

    const array=
        new Uint8Array(len);

    for(let i=0;i<len;i++){

        array[i]=
            binary.charCodeAt(i);

    }

    return new Blob(
        [array],
        {
            type:
                mime
                ? mime[1]
                : "application/octet-stream"
        }
    );

}


/* =========================================================
   RESET
   ========================================================= */

function resetProject(){

    if(
        !confirm(
            "Projeyi sıfırlamak istediğine emin misin?"
        )
    ){
        return;
    }


    scenes=
        defaultScenes();


    previewIndex=0;

    musicFile=null;


    if(musicURL){

        URL.revokeObjectURL(
            musicURL
        );

        musicURL=null;

    }


    document.getElementById(
        "musicInput"
    ).value="";


    document.getElementById(
        "musicStatus"
    ).textContent=
        "Henüz müzik yüklenmedi.";


    document.getElementById(
        "filmName"
    ).value=
        "Das Haus am Waldrand";


    document.getElementById(
        "story"
    ).value=
        "23:47 Uhr. Anna kommt an einem verlassenen Haus am Waldrand an. Im oberen Fenster geht plötzlich ein Licht an. Sie hört Schritte im Haus. Die Tür öffnet sich von selbst. Im dunklen Flur erscheint ein Schatten.";


    renderSceneEditors();

    drawPreview();


    setStatus(
        "renderStatus",
        "♻️ Proje sıfırlandı."
    );

}


/* =========================================================
   PAGE CLOSE CLEANUP
   ========================================================= */

window.addEventListener(
    "beforeunload",
    function(){

        if(musicURL){

            try{
                URL.revokeObjectURL(
                    musicURL
                );
            }catch(e){}

        }

    }
);
