/* =====================================================
   SCENE LIST
===================================================== */

function renderScenes(){

sceneList.innerHTML="";

scenes.forEach((scene,i)=>{

const card=
document.createElement("div");

card.className=
"scene-card"+
(i===currentScene?" active":"");

card.innerHTML=`

<div class="scene-title">
${i+1}. ${escapeHTML(scene.title)}
</div>

<div class="scene-meta">

Dauer: ${scene.duration}s<br>

${
scene.image
?
'<span class="ok">🖼 Bild vorhanden</span>'
:
'<span class="no">🖼 Bild fehlt</span>'
}

<br>

${
scene.audio
?
'<span class="ok">🔊 Audio vorhanden</span>'
:
'<span class="no">🔇 Audio fehlt</span>'
}

</div>
`;

card.onclick=()=>{
selectScene(i);
};

sceneList.appendChild(card);

});

}

/* =====================================================
   IMAGE LOAD
===================================================== */

function loadImage(file){

if(!file)return;

const s=
scenes[currentScene];

if(s.image){
URL.revokeObjectURL(s.image.url);
}

const url=
URL.createObjectURL(file);

s.image={
name:file.name,
url:url
};

renderScenes();
renderEditor();
drawFrame(0);

}


/* =====================================================
   AUDIO LOAD
===================================================== */

function loadAudio(file){

if(!file)return;

const s=
scenes[currentScene];

if(s.audio){
URL.revokeObjectURL(s.audio.url);
}

const url=
URL.createObjectURL(file);

s.audio={
name:file.name,
url:url,
type:file.type
};

renderScenes();
renderEditor();

statusBox.textContent=
"Audio geladen: "+file.name;

}


/* =====================================================
   UPDATE
===================================================== */

function updateTitle(v){
scenes[currentScene].title=v;
renderScenes();
}

function updateNarration(v){
scenes[currentScene].narration=v;
}

function updateImagePrompt(v){
scenes[currentScene].imagePrompt=v;
}

function updateMotionPrompt(v){
scenes[currentScene].motionPrompt=v;
}


/* =====================================================
   AUDIO ENGINE
===================================================== */

async function initAudio(){

if(!audioContext){

audioContext=
new (
window.AudioContext ||
window.webkitAudioContext
)();

audioDestination=
audioContext.createMediaStreamDestination();

}

if(audioContext.state==="suspended"){
await audioContext.resume();
}

}


/* =====================================================
   PREPARE AUDIO
===================================================== */

async function prepareAudio(){

await initAudio();

audioElements=[];

for(let i=0;i<scenes.length;i++){

const s=
scenes[i];

if(!s.audio){

audioElements.push(null);

continue;
}

const audio=
new Audio();

audio.src=s.audio.url;

audio.preload="auto";

audio.volume=1;

const source=
audioContext.createMediaElementSource(audio);

source.connect(audioContext.destination);

source.connect(audioDestination);

audioElements.push(audio);

}

}


/* =====================================================
   PLAY CURRENT AUDIO
===================================================== */

async function playCurrentAudio(){

const s=
scenes[currentScene];

if(!s)return;

if(!s.audio){

if("speechSynthesis" in window){

speechSynthesis.cancel();

const u=
new SpeechSynthesisUtterance(

);

u.lang=

u.rate=.9;

}

const audio=

}


/* =====================================================
   DRAW FRAME
===================================================== */

function drawFrame(t){

const s=
scenes[currentScene];

if(!s){

drawEmpty();
return;
}

const W=canvas.width;
const H=canvas.height;


/* BACKGROUND */

ctx.fillStyle="#020305";
ctx.fillRect(0,0,W,H);


/* IMAGE */

if(s.image){

const img=
imageCache[s.image.url];

if(img && img.complete){

drawCinematicImage(
img,
t,
currentScene
);

}else{

loadImageForCanvas(
s.image.url
);

drawFallbackScene(t);

}

}else{

drawFallbackScene(t);

}


/* FILM LOOK */

drawFilmLook(t);


/* SUBTITLE */

drawSubtitle(s.narration);

}


/* =====================================================
   IMAGE CACHE
===================================================== */

const imageCache={};

function loadImageForCanvas(url){

if(imageCache[url])return;

const img=
new Image();

img.onload=()=>{
drawFrame(0);
};

img.src=url;

imageCache[url]=img;

}


/* =====================================================
   CINEMATIC IMAGE
===================================================== */

function drawCinematicImage(
img,
t,
sceneIndex
){

const W=canvas.width;
const H=canvas.height;

const iw=img.naturalWidth;
const ih=img.naturalHeight;

const imageRatio=iw/ih;
const canvasRatio=W/H;

let dw,dh;

if(imageRatio>canvasRatio){

dh=H;
dw=H*imageRatio;

}else{

dw=W;
dh=W/imageRatio;

}

const progress=
Math.min(
1,
Math.max(
0,
t/7
)
);


/* subtle Ken Burns */

const zoom=
1.02+
progress*0.055;

dw*=zoom;
dh*=zoom;


/* different movement per scene */

let offsetX=0;
let offsetY=0;

if(sceneIndex%2===0){

offsetX=
(progress-.5)*90;

}else{

offsetX=
(.5-progress)*90;

}

offsetY=
Math.sin(
(progress*Math.PI)
)*20;


const x=
(W-dw)/2+offsetX;

const y=
(H-dh)/2+offsetY;

ctx.drawImage(
img,
x,
y,
dw,
dh
);

}


/* =====================================================
   FALLBACK CINEMA
===================================================== */

function drawFallbackScene(t){

const W=canvas.width;
const H=canvas.height;

const g=
ctx.createLinearGradient(
0,0,0,H
);

g.addColorStop(0,"#03050a");
g.addColorStop(.55,"#101923");
g.addColorStop(1,"#020304");

ctx.fillStyle=g;
ctx.fillRect(0,0,W,H);


/* moon */

ctx.beginPath();

ctx.arc(
W*.78,
H*.19,
72,
0,
Math.PI*2
);

ctx.fillStyle=
"rgba(220,230,240,.82)";

ctx.fill();


/* house */

const hx=W*.29;
const hy=H*.43;
const hw=W*.42;
const hh=H*.35;

ctx.fillStyle="#101214";

ctx.fillRect(
hx,
hy,
hw,
hh
);


/* roof */

ctx.beginPath();

ctx.moveTo(hx-80,hy);
ctx.lineTo(
hx+hw/2,
hy-180
);
ctx.lineTo(
hx+hw+80,
hy
);
ctx.closePath();

ctx.fillStyle="#050607";
ctx.fill();


/* windows */

ctx.fillStyle=
currentScene>=2
?
"rgba(255,210,90,.9)"
:
"rgba(255,210,90,.08)";

ctx.fillRect(
hx+hw*.64,
hy+60,
100,
120
);


/* door */

ctx.fillStyle="#050505";

ctx.fillRect(
hx+hw*.43,
hy+hh-190,
110,
190
);


/* rain */

for(let i=0;i<220;i++){

const x=
(i*91)%W;

const y=
((i*49)+(t*350))%H;

ctx.strokeStyle=
"rgba(190,215,240,.24)";

ctx.lineWidth=2;

ctx.beginPath();

ctx.moveTo(x,y);

ctx.lineTo(
x-8,
y+28
);

ctx.stroke();

}

}


/* =====================================================
   FILM LOOK
===================================================== */

function drawFilmLook(t){

const W=canvas.width;
const H=canvas.height;


/* cinematic top/bottom bars */

ctx.fillStyle=
"rgba(0,0,0,.48)";

ctx.fillRect(
0,
0,
W,
75
);

ctx.fillRect(
0,
H-75,
W,
75
);


/* vignette */

const v=
ctx.createRadialGradient(
W/2,
H/2,
250,
W/2,
H/2,
1100
);

v.addColorStop(
0,
"rgba(0,0,0,0)"
);

v.addColorStop(
1,
"rgba(0,0,0,.72)"
);

ctx.fillStyle=v;

ctx.fillRect(
0,
0,
W,
H
);


/* subtle grain */

for(let i=0;i<900;i++){

const x=
Math.random()*W;

const y=
Math.random()*H;

ctx.fillStyle=
Math.random()>.5
?
"rgba(255,255,255,.025)"
:
"rgba(0,0,0,.025)";

ctx.fillRect(
x,
y,
1,
1
);

}

}


/* =====================================================
   SUBTITLE
===================================================== */

function drawSubtitle(text){

if(!text)return;

const W=canvas.width;
const H=canvas.height;

ctx.font=
"34px Arial";

ctx.textAlign="center";

const maxWidth=1450;

const words=text.split(" ");

let lines=[];
let line="";

for(const word of words){

const test=
line
?
line+" "+word
:
word;

if(
ctx.measureText(test).width>
maxWidth
){

lines.push(line);
line=word;

}else{

line=test;

}

}

if(line)lines.push(line);

const lineHeight=45;

const boxHeight=
lines.length*lineHeight+42;

const y=
H-115-boxHeight;

ctx.fillStyle=
"rgba(0,0,0,.76)";

ctx.fillRect(
170,
y,
W-340,
boxHeight
);

ctx.fillStyle="#fff";

lines.forEach(
(line,i)=>{

ctx.fillText(
line,
W/2,
y+35+i*lineHeight
);

}
);

}


/* =====================================================
   PREVIEW
===================================================== */

function previewFilm(){

if(!scenes.length){
generateFilm();
return;
}

if(playing)return;

playing=true;

let sceneStart=
performance.now();

function loop(){

if(!playing)return;

const now=
performance.now();

const elapsed=
(now-sceneStart)/1000;

if(
elapsed>=
scenes[currentScene].duration
){

if(
currentScene<
scenes.length-1
){

currentScene++;

renderScenes();
renderEditor();

sceneStart=
performance.now();

}else{

stopFilm();
return;

}

}

const currentElapsed=
(performance.now()-sceneStart)/1000;

drawFrame(currentElapsed);

updateProgress(
currentScene,
currentElapsed
);

raf=
requestAnimationFrame(loop);

}

loop();

}


/* =====================================================
   PAUSE
===================================================== */

function pauseFilm(){

playing=false;

if(raf){
cancelAnimationFrame(raf);
raf=null;
}

}


/* =====================================================
   STOP
===================================================== */

function stopFilm(){

playing=false;

if(raf){
cancelAnimationFrame(raf);
raf=null;
}

currentScene=0;

renderScenes();
renderEditor();

drawFrame(0);

updateProgress(
0,
0
);

}


/* =====================================================
   RECORD
===================================================== */

async function recordFilm(){

if(recording)return;

if(!scenes.length){

alert("Önce Film erstellen.");
return;

}


/*
Audio kontrol
*/

const audioCount=
scenes.filter(
s=>s.audio
).length;

if(audioCount===0){

alert(
"Ses dosyası yok.\n\n"+
"Her sahneye MP3/WAV yükle.\n"+
"Browser TTS sesi WebM içine güvenilir şekilde alınamaz."
);

return;

}


recording=true;

chunks=[];

recordStatus.textContent=
"⏳ Audio-System wird vorbereitet...";


try{

await prepareAudio();


/*
ÖNEMLİ:
AudioContext kullanıcı etkileşiminden sonra
aktifleşiyor.
*/

await audioContext.resume();


/*
Video
*/

const videoStream=
canvas.captureStream(30);


/*
Audio
*/

const tracks=[
...videoStream.getVideoTracks()
];

audioDestination
.stream
.getAudioTracks()
.forEach(
track=>{
tracks.push(track);
}
);


const combined=
new MediaStream(tracks);


/*
YÜKSEK KALİTE CODEC
*/

let mime="";

const codecs=[

"video/webm;codecs=vp9,opus",

"video/webm;codecs=vp8,opus",

"video/webm"

];

for(
const c of codecs
){

if(
MediaRecorder.isTypeSupported(c)
){

mime=c;
break;

}

}


const options={
videoBitsPerSecond:12000000,
audioBitsPerSecond:192000
};

if(mime){
options.mimeType=mime;
}


recorder=
new MediaRecorder(
combined,
options
);


recorder.ondataavailable=
e=>{

if(
e.data &&
e.data.size>0
){

chunks.push(e.data);

}

};


recorder.onstop=
()=>{

const blob=
new Blob(
chunks,
{
type:
mime ||
"video/webm"
}
);

const url=
URL.createObjectURL(blob);

const a=
document.createElement("a");

a.href=url;

a.download=
safeName(
document.getElementById(
"filmName"
).value
)
+
"_1080p.webm";

a.click();

setTimeout(
()=>{
URL.revokeObjectURL(url);
},
10000
);

recordStatus.textContent=
"✅ FULL HD Film fertig — Bild + Audio zusammen gespeichert.";

recording=false;

};


recorder.start(100);


/*
SAHNELER
*/

await recordScenes();


/*
Stop
*/

recorder.stop();

videoStream
.getTracks()
.forEach(
t=>t.stop()
);

}catch(error){

console.error(error);

recording=false;

recordStatus.textContent=
"❌ Fehler: "+error.message;

alert(
"Aufnahmefehler:\n\n"+
error.message
);

}

}


/* =====================================================
   RECORD SCENES
===================================================== */

async function recordScenes(){

const total=
scenes.reduce(
(sum,s)=>sum+s.duration,
0
);

let completed=0;


for(
let i=0;
i<scenes.length;
i++
){

currentScene=i;

renderScenes();
renderEditor();

const scene=
scenes[i];

const audio=
audioElements[i];

if(audio){

try{

audio.pause();

audio.currentTime=0;

}catch(e){}

}


/*
Audio zuerst starten.
*/

if(audio){

try{

await audio.play();

}catch(e){

console.warn(
"Audio play error",
e
);

}

}


await new Promise(resolve=>{

const start=
performance.now();

function frame(){

const elapsed=
(performance.now()-start)/1000;

drawFrame(elapsed);


const overall=
completed+
elapsed;

const percent=
Math.min(
100,
overall/total*100
);

progressBar.style.width=
percent+"%";

timeBox.textContent=
formatTime(overall)
+
" / "
+
formatTime(total);

recordStatus.textContent=
"🔴 Aufnahme: Szene "
+
(i+1)
+
" / "
+
scenes.length;


if(
elapsed<
scene.duration
){

requestAnimationFrame(frame);

}else{

if(audio){

try{

audio.pause();

audio.currentTime=0;

}catch(e){}

}

completed+=scene.duration;

resolve();

}

}

frame();

});

}

}


/* =====================================================
   PROGRESS
===================================================== */

function updateProgress(
index,
elapsed
){

let current=0;

for(
let i=0;
i<index;
i++
){

current+=
scenes[i].duration;

}

current+=elapsed;

const total=
scenes.reduce(
(sum,s)=>
sum+s.duration,
0
);

progressBar.style.width=
Math.min(
100,
current/total*100
)
+
"%";

timeBox.textContent=
formatTime(current)
+
" / "
+
formatTime(total);

}


/* =====================================================
   TIME
===================================================== */

function formatTime(sec){

sec=Math.max(
0,
Math.floor(sec)
);

const m=
Math.floor(sec/60);

const s=
sec%60;

return String(m).padStart(2,"0")
+
":"
+
String(s).padStart(2,"0");

}


/* =====================================================
   SAVE PROJECT
===================================================== */

function saveProject(){

if(!scenes.length){

alert("Önce Film erstellen.");
return;

}

const data={

version:"4.0",

filmName:
document.getElementById(
"filmName"
).value,

language:
document.getElementById(
"language"
).value,

story:
document.getElementById(
"story"
).value,

scenes:
scenes.map(s=>({

title:s.title,
duration:s.duration,
narration:s.narration,
imagePrompt:s.imagePrompt,
motionPrompt:s.motionPrompt,

imageName:
s.image
?
s.image.name
:null,

audioName:
s.audio
?
s.audio.name
:null

}))

};

const blob=
new Blob(
[
JSON.stringify(
data,
null,
2
)
],
{
type:"application/json"
}
);

const url=
URL.createObjectURL(blob);

const a=
document.createElement("a");

a.href=url;

a.download=
safeName(
data.filmName
)
+
".json";

a.click();

URL.revokeObjectURL(url);

}


/* =====================================================
   LOAD PROJECT
===================================================== */

function loadProject(){

const input=
document.createElement("input");

input.type="file";

input.accept=".json";

input.onchange=
async()=>{

const file=
input.files[0];

if(!file)return;

try{

const data=
JSON.parse(
await file.text()
);

document.getElementById(
"filmName"
).value=
data.filmName || "";

document.getElementById(
"language"
).value=
data.language || "de-DE";

document.getElementById(
"story"
).value=
data.story || "";

scenes=
data.scenes || [];

scenes.forEach(
s=>{
s.image=null;
s.audio=null;
}
);

currentScene=0;

renderScenes();
renderEditor();
drawFrame(0);

statusBox.textContent=
"Projekt geladen. Bild- und Audiodateien erneut auswählen.";

}catch(e){

alert(
"Projekt konnte nicht geladen werden."
);

}

};

input.click();

}


/* =====================================================
   RESET
===================================================== */

function resetProject(){

if(
!confirm(
"Projekt wirklich löschen?"
)
)return;

scenes=[];
currentScene=0;

sceneList.innerHTML="";
sceneEditor.innerHTML="";

progressBar.style.width="0%";

timeBox.textContent=
"00:00 / 00:00";

drawEmpty();

}


/* =====================================================
   EMPTY
===================================================== */

function drawEmpty(){

ctx.fillStyle="#020305";

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);

ctx.fillStyle="#fff";

ctx.font=
"50px Arial";

ctx.textAlign="center";

ctx.fillText(
"Mina Film Studio V4",
canvas.width/2,
canvas.height/2
);

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(text){

return String(text||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =====================================================
   SAFE NAME
===================================================== */

function safeName(name){

return String(
name ||
"Mina_Film"
)
.replace(
/[\\/:*?"<>|]/g,
"_"
)
.replace(
/\s+/g,
"_"
);

}


/* =====================================================
   INIT
===================================================== */

drawEmpty();

</script>
