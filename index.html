   DURUM

function setStatus(text){

}

function setProgress(value){
  value = Math.max(0,Math.min(100,value));
  progressBar.style.width = value + "%";
}


/* =========================================================
   HİKAYEYİ SAHNELERE BÖL
========================================================= */

function splitStory(text,count){

  text = String(text || "")
    .replace(/\r/g," ")
    .replace(/\n+/g," ")
    .replace(/\s+/g," ")
    .trim();

  if(!text){
    return [];
  }

  var sentences = text
    .split(/(?<=[.!?])\s+/)
    .map(function(x){
      return x.trim();
    })
    .filter(Boolean);

  if(sentences.length === 0){
    sentences = [text];
  }

  var result = [];

  for(var i=0;i<count;i++){

    var start = Math.floor(i * sentences.length / count);
    var end = Math.floor((i+1) * sentences.length / count);

    if(end <= start){
      end = Math.min(start + 1,sentences.length);
    }

    var part = sentences.slice(start,end).join(" ");

    if(!part){
      part = sentences[Math.min(i,sentences.length-1)] || text;
    }

    result.push(part);
  }

  return result;
}


/* =========================================================
   GÜÇLÜ METİNSİZ GÖRSEL PROMPT
========================================================= */

function createPrompt(text,index){

    "Cinematic photorealistic documentary scene for a German business success story. " +

    "Ultra realistic photography, natural human expressions, realistic skin texture, " +

    "professional cinematic lighting, realistic environment, documentary photography, " +

    "35mm cinematic lens, shallow depth of field, realistic shadows, " +

    "subtle film grain, premium streaming documentary quality, " +

    "high detail, realistic colors, professional composition. " +

    "Scene " + (index + 1) + ". " +

    "Main subject must remain visually consistent between scenes. " +

    "The same person should have consistent facial features, hairstyle, age, clothing style " +
    "and physical appearance throughout the story. " +

    "IMPORTANT IMAGE RULE: " +

    "ABSOLUTELY NO TEXT IN THE IMAGE. " +
    "NO SUBTITLES. " +
    "NO CAPTIONS. " +
    "NO HEADLINES. " +
    "NO WRITTEN WORDS. " +
    "NO LETTERS. " +
    "NO NUMBERS. " +
    "NO TYPOGRAPHY. " +
    "NO TEXT OVERLAYS. " +
    "NO LOWER THIRDS. " +
    "NO LOGOS. " +
    "NO WATERMARKS. " +
    "NO UI ELEMENTS. " +
    "NO READABLE SIGNS. " +
    "NO READABLE DOCUMENTS. " +
    "NO NEWSPAPER TEXT. " +
    "NO SCREEN TEXT. " +
    "NO POSTER TEXT. " +
    "NO LABELS. " +
    "NO CAPTIONS EMBEDDED INTO THE IMAGE. " +

    "If the scene contains a computer, phone, newspaper, book, " +
    "document, shop sign, billboard, packaging or screen, " +

    "or shown from an angle where no text can be recognized. " +

    "Do not place words anywhere in the image. " +

    "No distorted hands, no extra fingers, no deformed faces, " +

/* =========================================================
   SAHNE DOM OLUŞTUR
========================================================= */

function createSceneCard(scene,index){

  var box = document.createElement("div");
  box.className = "scene";
  box.dataset.index = index;

  var head = document.createElement("div");
  head.className = "sceneHead";

  var title = document.createElement("div");

  title.textContent = "SAHNE " + (index+1);

  var badge = document.createElement("div");
  badge.className = "badge";
  badge.id = "badge-" + index;
  badge.textContent = "Hazır değil";

  head.appendChild(title);
  head.appendChild(badge);

  var grid = document.createElement("div");
  grid.className = "sceneGrid";

  var left = document.createElement("div");

  var img = document.createElement("img");
  img.className = "preview";
  img.id = "img-" + index;
  img.alt = "Sahne " + (index+1);

  left.appendChild(img);

  var imageFile = document.createElement("input");
  imageFile.type = "file";
  imageFile.accept = "image/*";
  imageFile.className = "file";

  imageFile.addEventListener("change",function(){

    var file = imageFile.files && imageFile.files[0];

    if(!file) return;

    var url = URL.createObjectURL(file);

    scene.imageBlob = file;
    scene.imageURL = url;

  right.appendChild(storyLabel);

  storyText.addEventListener("input",function(){
    scene.text = storyText.value;
  });

  right.appendChild(storyText);

  var promptLabel = document.createElement("label");
  promptLabel.textContent = "🎨 Görsel Prompt";
  right.appendChild(promptLabel);

  var promptText = document.createElement("textarea");
  promptText.value = scene.prompt;

  promptText.addEventListener("input",function(){
    scene.prompt = promptText.value;
  });

  right.appendChild(promptText);

  var imageButtons = document.createElement("div");
  imageButtons.className = "controls";

  var generateButton = document.createElement("button");
  generateButton.className = "primary";
  generateButton.textContent = "🖼️ Görsel Üret";

  generateButton.addEventListener("click",async function(){

    await generateImage(scene,index);

  });

  imageButtons.appendChild(generateButton);

  var audioButtons = document.createElement("div");
  audioButtons.className = "controls";

  var speakButton = document.createElement("button");
  speakButton.textContent = "🔊 Sadece Seslendir";

  speakButton.addEventListener("click",function(){
    speakOnly(scene);
  });

  var recordButton = document.createElement("button");
  recordButton.className = "green";
  recordButton.textContent = "🎙️ Seslendir + Kaydet";

  recordButton.addEventListener("click",async function(){
    stopRequested = false;
    await recordScene(scene,index);
  });

  var playButton = document.createElement("button");
  playButton.textContent = "▶ Dinle";

  playButton.addEventListener("click",function(){

    if(!scene.audioURL){
      setStatus("Bu sahnede kayıtlı ses yok.");
      return;
    }

    if(currentAudio){
      try{currentAudio.pause();}catch(e){}
    }

    currentAudio = new Audio(scene.audioURL);
    currentAudio.play();

  });

  var stopAudioButton = document.createElement("button");
  stopAudioButton.className = "red";
  stopAudioButton.textContent = "⏹ Durdur";

  stopAudioButton.addEventListener("click",function(){

    speechSynthesis.cancel();

    if(currentAudio){
      try{
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }catch(e){}
    }

  });

  audioButtons.appendChild(speakButton);
  audioButtons.appendChild(recordButton);
  audioButtons.appendChild(playButton);
  audioButtons.appendChild(stopAudioButton);

  right.appendChild(imageButtons);
  right.appendChild(audioButtons);

  var audioFile = document.createElement("input");
  audioFile.type = "file";
  audioFile.accept = "audio/*";
  audioFile.className = "file";

  audioFile.addEventListener("change",async function(){

    var file = audioFile.files && audioFile.files[0];

    if(!file) return;

    try{

      await loadAudioFile(scene,file,index);

    }catch(error){

      setStatus("Ses yükleme hatası: " + error.message);

    }

  });

  right.appendChild(audioFile);

  var info = document.createElement("div");
  info.className = "small";
  info.id = "info-" + index;
  info.textContent = "Ses: yok";

  right.appendChild(info);

  grid.appendChild(right);

  box.appendChild(head);
  box.appendChild(grid);

  return box;
}


/* =========================================================
   SAHNELERİ OLUŞTUR
========================================================= */

function createScenes(){

  try{

    var story = storyEl.value.trim();

    if(!story){
      setStatus("Önce hikayeyi yaz veya yapıştır.");
      return;
    }

    var count = parseInt(sceneCountEl.value,10);

    var parts = splitStory(story,count);

    if(!parts.length){
      setStatus("Hikaye bölünemedi.");
      return;
    }

    scenes = [];

    scenesEl.innerHTML = "";

    for(var i=0;i<count;i++){

      var text = parts[i] || "";

      var scene = {

        index:i,

        text:text,

        prompt:createPrompt(text,i),

        imageBlob:null,

        imageURL:"",

        audioBlob:null,

        audioURL:"",

        audioDuration:0

      };

      scenes.push(scene);

      var card = createSceneCard(scene,i);

      scenesEl.appendChild(card);

    }

    setStatus(
      count +
      " sahne oluşturuldu.\n" +
      "Görsel promptları otomatik hazırlandı.\n" +
      "Promptlarda özellikle metin, altyazı, logo ve watermark engellendi."
    );

  }catch(error){

    console.error(error);

    setStatus(
      "❌ SAHNE OLUŞTURMA HATASI: " +
      error.message
    );

  }

}


/* =========================================================
   POLLINATIONS GÖRSEL
========================================================= */

async function generateImage(scene,index){

  try{

    setStatus(
      "🎨 Sahne " +
      (index+1) +
      " görseli üretiliyor..."
    );

    var encodedPrompt =
      encodeURIComponent(scene.prompt);

    var seed =
      Math.floor(Math.random()*99999999);

    var url =
      "https://image.pollinations.ai/prompt/" +
      encodedPrompt +
      "?width=1280" +
      "&height=720" +
      "&nologo=true" +
      "&seed=" + seed;

    var response = await fetch(url);

    if(!response.ok){
      throw new Error(
        "Görsel sunucusu HTTP " +
        response.status
      );
    }

    var blob = await response.blob();

    if(!blob || !blob.size){
      throw new Error("Boş görsel döndü.");
    }

    var imageURL =
      URL.createObjectURL(blob);

    scene.imageBlob = blob;
    scene.imageURL = imageURL;

    var img =
      document.getElementById("img-"+index);

    if(img){
      img.src = imageURL;
    }

    var badge =
      document.getElementById("badge-"+index);

    if(badge){
      badge.textContent = "Görsel hazır";
    }

    setStatus(
      "✅ Sahne " +
      (index+1) +
      " görseli hazır."
    );

  }catch(error){

    console.error(error);

    setStatus(
      "❌ Sahne " +
      (index+1) +
      " görsel hatası: " +
      error.message
    );

  }

}


/* =========================================================
   TÜM GÖRSELLER
========================================================= */

async function generateAllImages(){

  if(!scenes.length){

    setStatus(
      "Önce SAHNELERİ OLUŞTUR."
    );

    return;
  }

  setProgress(0);

  for(var i=0;i<scenes.length;i++){

    if(stopRequested){
      break;
    }

    await generateImage(scenes[i],i);

    setProgress(
      ((i+1)/scenes.length)*100
    );

    await wait(700);

  }

  if(stopRequested){

    setStatus("Görsel üretimi durduruldu.");

  }else{

    setStatus(
      "🎉 Tüm sahne görselleri hazır."
    );

  }

}


/* =========================================================
   BEKLE
========================================================= */

function wait(ms){

  return new Promise(function(resolve){

    setTimeout(resolve,ms);

  });

}


/* =========================================================
   SADECE SESLENDİR
========================================================= */

function speakOnly(scene){

  speechSynthesis.cancel();

  var utterance =
    new SpeechSynthesisUtterance(
      scene.text
    );

  utterance.lang =
    languageEl.value;

  utterance.rate =
    parseFloat(rateEl.value);

  utterance.pitch = 1;

  speechSynthesis.speak(
    utterance
  );

}


/* =========================================================
   SES YAKALAMA HAZIRLA
========================================================= */

async function prepareAudio(){

  try{

    speechSynthesis.cancel();

    if(!navigator.mediaDevices ||
       !navigator.mediaDevices.getDisplayMedia){

      throw new Error(
        "Chrome bu ses yakalama özelliğini desteklemiyor."
      );

    }

    setStatus(
      "📺 Ekran/ses yakalama penceresi açılıyor.\n\n" +
      "Chrome penceresinde:\n" +
      "1. Sekme seç.\n" +
      "2. Ses paylaşımını aç.\n" +
      "3. Paylaş'a bas.\n\n" +
      "Sonra TÜMÜNÜ SESLENDİR + KAYDET butonuna bas."
    );

    captureStream =
      await navigator.mediaDevices.getDisplayMedia({
        video:true,
        audio:true
      });

    var audioTracks =
      captureStream.getAudioTracks();

    if(!audioTracks.length){

      captureStream.getTracks()
        .forEach(function(track){
          try{track.stop();}catch(e){}
        });

      captureStream = null;

      throw new Error(
        "Ses yakalanamadı. Chrome penceresinde 'Sekme sesi' veya 'Sistem sesi' seçili olmalı."
      );

    }

    setStatus(
      "✅ SES YAKALAMAYA HAZIR.\n" +
      "Şimdi TÜMÜNÜ SESLENDİR + KAYDET butonuna bas."
    );

  }catch(error){

    console.error(error);

    setStatus(
      "❌ Ses yakalama hazırlanamadı: " +
      error.message
    );

  }

}


/* =========================================================
   ARRAYBUFFER
========================================================= */

function blobToArrayBuffer(blob){

  return new Promise(function(resolve,reject){

    var reader =
      new FileReader();

    reader.onload =
      function(){

        resolve(
          reader.result
        );

      };

    reader.onerror =
      function(){

        reject(
          reader.error ||
          new Error("Dosya okunamadı.")
        );

      };

    reader.readAsArrayBuffer(blob);

  });

}


/* =========================================================
   GERÇEK SES SÜRESİ
========================================================= */

async function getAudioDuration(blob){

  var AC =
    window.AudioContext ||
    window.webkitAudioContext;

  if(!AC){

    throw new Error(
      "AudioContext desteklenmiyor."
    );

  }

  var ctx = new AC();

  try{

    var arrayBuffer =
      await blobToArrayBuffer(blob);

    var decoded =
      await new Promise(
        function(resolve,reject){

          ctx.decodeAudioData(

            arrayBuffer.slice(0),

            function(buffer){

              resolve(buffer);

            },

            function(error){

              reject(
                error ||
                new Error(
                  "Ses çözümlenemedi."
                )
              );

            }

          );

        }
      );

    var duration =
      Number(decoded.duration);

    if(!isFinite(duration) ||
       duration <= 0){

      throw new Error(
        "Gerçek ses süresi okunamadı."
      );

    }

    return duration;

  }finally{

    try{
      await ctx.close();
    }catch(e){}

  }

}


/* =========================================================
   SAHNE SES KAYDI
========================================================= */

async function recordScene(scene,index){

  if(!captureStream){

    setStatus(
      "Önce SES YAKALAMAYI HAZIRLA butonuna bas."
    );

    return;

  }

  var audioTracks =
    captureStream.getAudioTracks();

  if(!audioTracks.length){

    setStatus(
      "Ses kanalı bulunamadı."
    );

    return;

  }

  try{

    stopRequested = false;

    speechSynthesis.cancel();

    recordedChunks = [];

    var audioStream =
      new MediaStream(
        audioTracks
      );

    var options = {};

    if(MediaRecorder.isTypeSupported(
      "audio/webm;codecs=opus"
    )){

      options.mimeType =
        "audio/webm;codecs=opus";

    }else if(MediaRecorder.isTypeSupported(
      "audio/webm"
    )){

      options.mimeType =
        "audio/webm";

    }

    mediaRecorder =
      new MediaRecorder(
        audioStream,
        options
      );

    mediaRecorder.ondataavailable =
      function(event){

        if(event.data &&
           event.data.size > 0){

          recordedChunks.push(
            event.data
          );

        }

      };

    var recorderStopped =
      new Promise(
        function(resolve){

          mediaRecorder.onstop =
            function(){

              resolve();

            };

        }
      );

    mediaRecorder.start(200);

    var utterance =
      new SpeechSynthesisUtterance(
        scene.text
      );

    utterance.lang =
      languageEl.value;

    utterance.rate =
      parseFloat(rateEl.value);

    utterance.pitch = 1;

    utterance.onend =
      function(){

        setTimeout(
          function(){

            if(mediaRecorder &&
               mediaRecorder.state !== "inactive"){

              mediaRecorder.stop();

            }

          },
          250
        );

      };

    utterance.onerror =
      function(){

        if(mediaRecorder &&
           mediaRecorder.state !== "inactive"){

          mediaRecorder.stop();

        }

      };

    speechSynthesis.speak(
      utterance
    );

    await recorderStopped;

    if(stopRequested){

      return;

    }

    var blob =
      new Blob(
        recordedChunks,
        {
          type:
            options.mimeType ||
            "audio/webm"
        }
      );

    if(!blob.size){

      throw new Error(
        "Ses kaydı boş."
      );

    }

    var duration =
      await getAudioDuration(blob);

    scene.audioBlob = blob;

    scene.audioURL =
      URL.createObjectURL(blob);

    scene.audioDuration =
      duration;

    updateAudioInfo(
      scene,
      index
    );

    setStatus(
      "✅ Sahne " +
      (index+1) +
      " ses kaydı tamamlandı. " +
      formatTime(duration)
    );

  }catch(error){

    console.error(error);

    setStatus(
      "❌ Sahne " +
      (index+1) +
      " ses kayıt hatası: " +
      error.message
    );

  }

}

/* =========================================================
   FORMAT ZAMAN
========================================================= */

function formatTime(seconds){

  if(!isFinite(seconds)){
    return "0.00 sn";
  }

  if(seconds < 60){

    return seconds.toFixed(2) +
      " sn";

  }

  var minutes =
    Math.floor(seconds/60);

  var sec =
    seconds - minutes*60;

  return minutes +
    ":" +
    String(
      Math.floor(sec)
    ).padStart(2,"0");

}


/* =========================================================
   AUDIO SÜRESİNİ GARANTİLE
========================================================= */

async function ensureAudioDuration(scene){

  if(scene.audioBlob){

    if(!isFinite(scene.audioDuration) ||
       scene.audioDuration <= 0){

      scene.audioDuration =
        await getAudioDuration(
          scene.audioBlob
        );

    }

    return scene.audioDuration;

  }

  throw new Error(
    "Bu sahnede ses bulunmuyor."
  );

}

      img.crossOrigin =
        "anonymous";

      img.src = url;

    }
  );

}


/* =========================================================
   GÖRSELİ CANVAS'A ÇİZ
========================================================= */

function drawCover(
  ctx,
  img,
  canvasW,
  canvasH,
  progress,
  motion
){

  var iw = img.naturalWidth || img.width;
  var ih = img.naturalHeight || img.height;

  if(!iw || !ih){
    return;
  }

  var imageRatio =
    iw / ih;

  var canvasRatio =
    canvasW / canvasH;

  var baseScale;

  if(imageRatio > canvasRatio){

    baseScale =
      canvasH / ih;

  }else{

    baseScale =
      canvasW / iw;

  }

  var zoom;

  if(motion === 0){

    zoom =
      1.02 +
      progress * 0.045;

  }else if(motion === 1){

    zoom =
      1.07 -
      progress * 0.045;

  }else{

    zoom =
      1.035 +
      Math.sin(
        progress*Math.PI*2
      ) * 0.025;

  }

  var scale =
    baseScale * zoom;

  var dw =
    iw * scale;

  var dh =
    ih * scale;

  var maxX =
    Math.max(
      0,
      dw-canvasW
    );

  var maxY =
    Math.max(
      0,
      dh-canvasH
    );

  var x;
  var y;

  if(motion === 0){

    x =
      -maxX * progress;

    y =
      -maxY * (
        0.25 +
        progress*0.5
      );

  }else if(motion === 1){

    x =
      -maxX * (
        1-progress
      );

    y =
      -maxY * (
        0.7 -
        progress*0.45
      );

  }else{

    x =
      -maxX * 0.5;

    y =
      -maxY * 0.5;

  }

  ctx.drawImage(
    img,
    x,
    y,
    dw,
    dh
  );

}


/* =========================================================
   ALTYAZI
========================================================= */

function wrapText(
  ctx,
  text,
  maxWidth
){

  var words =
    text.split(/\s+/);

  var lines = [];
  var line = "";

  for(var i=0;i<words.length;i++){

    var test =
      line
      ? line + " " + words[i]
      : words[i];

    if(
      ctx.measureText(test).width >
      maxWidth &&
      line
    ){

      lines.push(line);

      line = words[i];

    }else{

      line = test;

    }

  }

  if(line){
    lines.push(line);
  }

  return lines;

}


function drawSubtitle(
  ctx,
  text,
  canvasW,
  canvasH
){

  if(!text){
    return;
  }

  var fontSize =
    Math.max(
      22,
      Math.floor(canvasW * 0.027)
    );

  ctx.font =
    "bold " +
    fontSize +
    "px Arial";

  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "middle";

  var maxWidth =
    canvasW * 0.82;

  var lines =
    wrapText(
      ctx,
      text,
      maxWidth
    );

  var lineHeight =
    fontSize * 1.25;

  var padding =
    fontSize * 0.55;

  var totalHeight =
    lines.length *
    lineHeight;

  var boxHeight =
    totalHeight +
    padding*2;

  var boxY =
    canvasH -
    boxHeight -
    canvasH*0.055;

  ctx.save();

  ctx.fillStyle =
    "rgba(0,0,0,.70)";

  roundRect(
    ctx,
    canvasW*0.06,
    boxY,
    canvasW*0.88,
    boxHeight,
    14
  );

  ctx.fill();

  ctx.fillStyle =
    "#ffffff";

  for(var i=0;i<lines.length;i++){

    var y =
      boxY +
      padding +
      lineHeight*i +
      lineHeight/2;

    ctx.fillText(
      lines[i],
      canvasW/2,
      y
    );

  }

  ctx.restore();

}


function roundRect(
  ctx,
  x,
  y,
  width,
  height,
  radius
){

  ctx.beginPath();

  ctx.moveTo(
    x+radius,
    y
  );

  ctx.lineTo(
    x+width-radius,
    y
  );

  ctx.quadraticCurveTo(
    x+width,
    y,
    x+width,
    y+radius
  );

  ctx.lineTo(
    x+width,
    y+height-radius
  );

  ctx.quadraticCurveTo(
    x+width,
    y+height,
    x+width-radius,
    y+height
  );

  ctx.lineTo(
    x+radius,
    y+height
  );

  ctx.quadraticCurveTo(
    x,
    y+height,
    x,
    y+height-radius
  );

  ctx.lineTo(
    x,
    y+radius
  );

  ctx.quadraticCurveTo(
    x,
    y,
    x+radius,
    y
  );

  ctx.closePath();

}

/* =========================================================
   LOGO ÇİZ
========================================================= */

function drawLogo(
  ctx,
  canvasW,
  canvasH
){

  if(!logoImage){
    return;
  }

  var maxW =
    canvasW * 0.13;

  var maxH =
    canvasH * 0.12;

  var iw =
    logoImage.naturalWidth ||
    logoImage.width;

  var ih =
    logoImage.naturalHeight ||
    logoImage.height;

  var scale =
    Math.min(
      maxW/iw,
      maxH/ih
    );

  var w =
    iw*scale;

  var h =
    ih*scale;

  var x =
    canvasW-w-
    canvasW*0.035;

  var y =
    canvasH*0.035;

  ctx.save();

  ctx.globalAlpha =
    0.9;

  ctx.drawImage(
    logoImage,
    x,
    y,
    w,
    h
  );

  ctx.restore();

}


/* =========================================================
   AUDIO BUFFER
========================================================= */

async function decodeAudioBlob(
  blob,
  audioContext
){

  var arrayBuffer =
    await blobToArrayBuffer(
      blob
    );

  return await new Promise(
    function(resolve,reject){

      audioContext.decodeAudioData(

        arrayBuffer.slice(0),

        function(buffer){
          resolve(buffer);
        },

        function(error){
          reject(
            error ||
            new Error(
              "Audio decode hatası."
            )
          );
        }

      );

    }
  );

}


/* =========================================================
   VIDEO RENDER
========================================================= */

async function renderVideo(){

  if(!scenes.length){

    setStatus(
      "Önce sahneleri oluştur."
    );

    return;

  }

  stopRequested = false;

  setProgress(0);

  downloadArea.innerHTML = "";

  if(videoURL){

    try{
      URL.revokeObjectURL(videoURL);
    }catch(e){}

    videoURL = null;

  }

  try{

    setStatus(
      "🎬 Video hazırlığı başlıyor..."
    );

    for(var check=0;
        check<scenes.length;
        check++){

      if(!scenes[check].imageURL){

        throw new Error(
          "Sahne " +
          (check+1) +
          " görseli yok."
        );

      }

      await ensureAudioDuration(
        scenes[check]
      );

    }

    var format =
      formatEl.value;

    var canvas =
      document.createElement(
        "canvas"
      );

    if(format === "9:16"){

      canvas.width = 720;
      canvas.height = 1280;

    }else if(format === "1:1"){

      canvas.width = 1080;
      canvas.height = 1080;

    }else{

      canvas.width = 1280;
      canvas.height = 720;

    }

    var ctx =
      canvas.getContext(
        "2d"
      );

    if(!ctx){

      throw new Error(
        "Canvas oluşturulamadı."
      );

    }

    var videoCanvasStream =
      canvas.captureStream(30);

    var audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    var destination =
      audioContext.createMediaStreamDestination();

    var finalTracks = [];

    videoCanvasStream
      .getVideoTracks()
      .forEach(function(track){

        finalTracks.push(track);

      });

    destination.stream
      .getAudioTracks()
      .forEach(function(track){

        finalTracks.push(track);

      });

    var finalStream =
      new MediaStream(
        finalTracks
      );

    var mimeType =
      "";

    if(MediaRecorder.isTypeSupported(
      "video/webm;codecs=vp9,opus"
    )){

      mimeType =
        "video/webm;codecs=vp9,opus";

    }else if(MediaRecorder.isTypeSupported(
      "video/webm;codecs=vp8,opus"
    )){

      mimeType =
        "video/webm;codecs=vp8,opus";

    }else{

      mimeType =
        "video/webm";

    }

    var renderRecorder =
      new MediaRecorder(
        finalStream,
        {
          mimeType:mimeType
        }
      );

    var chunks = [];

    renderRecorder.ondataavailable =
      function(event){

        if(event.data &&
           event.data.size){

          chunks.push(
            event.data
          );

        }

      };

    var recorderFinished =
      new Promise(
        function(resolve){

          renderRecorder.onstop =
            function(){

              resolve();

            };

        }
      );

    renderRecorder.start(250);

    var totalDuration = 0;

    for(var d=0;d<scenes.length;d++){

      totalDuration +=
        scenes[d].audioDuration;

    }

    var elapsed = 0;

    for(var i=0;i<scenes.length;i++){

      if(stopRequested){
        break;
      }

      var scene =
        scenes[i];

      setStatus(
        "🎬 Sahne " +
        (i+1) +
        "/" +
        scenes.length +
        " render ediliyor...\n" +
        "Süre: " +
        formatTime(
          scene.audioDuration
        )
      );

      var img =
        await loadImage(
          scene.imageURL
        );

      var buffer =
        await decodeAudioBlob(
          scene.audioBlob,
          audioContext
        );

      var source =
        audioContext.createBufferSource();

      source.buffer =
        buffer;

      source.connect(
        destination
      );

      source.start(0);

      var duration =
        scene.audioDuration;

      var startTime =
        performance.now();

      var motion =
        i % 3;

      while(true){

        var now =
          performance.now();

        var elapsedScene =
          (now-startTime)/1000;

        var p =
          Math.min(
            1,
            elapsedScene/duration
          );

        ctx.clearRect(
          0,
          0,
          canvas.width,
          canvas.height
        );

        ctx.fillStyle =
          "#000";

        ctx.fillRect(
          0,
          0,
          canvas.width,
          canvas.height
        );

        drawCover(
          ctx,
          img,
          canvas.width,
          canvas.height,
          p,
          motion
        );

        drawLogo(
          ctx,
          canvas.width,
          canvas.height
        );

        drawSubtitle(
          ctx,
          scene.text,
          canvas.width,
          canvas.height
        );

        var overall =
          (
            elapsed +
            Math.min(
              elapsedScene,
              duration
            )
          ) / totalDuration;

        setProgress(
          overall*100
        );

        if(
          elapsedScene >= duration
        ){

          break;

        }

        await new Promise(
          function(resolve){

            requestAnimationFrame(
              function(){
                resolve();
              }
            );

          }
        );

      }

      elapsed += duration;

      try{
        source.stop();
      }catch(e){}

    }

    if(stopRequested){

      try{
        renderRecorder.stop();
      }catch(e){}

    }else{

      await wait(250);

      try{
        renderRecorder.stop();
      }catch(e){}

    }

    await recorderFinished;

    videoBlob =
      new Blob(
        chunks,
        {
          type:
            mimeType ||
            "video/webm"
        }
      );

    if(!videoBlob.size){

      throw new Error(
        "Video dosyası boş oluştu."
      );

    }

    videoURL =
      URL.createObjectURL(
        videoBlob
      );

    videoPreview.src =
      videoURL;

    var link =
      document.createElement("a");

    link.href =
      videoURL;

    link.download =
      "GeldStory_V41_2.webm";

    link.className =
      "download";

    link.textContent =
      "⬇️ VİDEOYU İNDİR";

    downloadArea.appendChild(
      link
    );

    try{
      videoCanvasStream
        .getTracks()
        .forEach(function(track){
          track.stop();
        });
    }catch(e){}

    try{
      finalStream
        .getTracks()
        .forEach(function(track){
          track.stop();
        });
    }catch(e){}

    try{
      await audioContext.close();
    }catch(e){}

    setProgress(100);

    setStatus(
      "🎉 VİDEO HAZIR!\n\n" +
      "Sahne sayısı: " +
      scenes.length +
      "\n" +
      "Toplam süre: " +
      formatTime(totalDuration) +
      "\n\n" +
      "Görsellerdeki metinler kullanılmaz; " +
      "altyazılar video sırasında ayrıca eklenmiştir."
    );

  }catch(error){

    console.error(error);

    setStatus(
      "❌ VİDEO RENDER HATASI:\n" +
      error.message
    );

  }

}

    "⏹ İşlem durduruluyor..."

}
