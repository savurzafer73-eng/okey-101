<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mina Video AI V43.1 — GeldStory Studio</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  background:#080b10;
  color:#f1f5f9;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
}

.container{
  width:96%;
  max-width:1500px;
  margin:20px auto 60px auto;
}

h1{
  margin:0;
  font-size:30px;
  color:#fff;
}

.subtitle{
  color:#94a3b8;
  margin-top:7px;
  margin-bottom:20px;
}

.panel{
  background:#10151d;
  border:1px solid #263241;
  border-radius:14px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:0 8px 30px rgba(0,0,0,.22);
}

.panel h2{
  margin:0 0 14px 0;
  font-size:20px;
}

textarea{
  width:100%;
  min-height:230px;
  resize:vertical;
  background:#080c12;
  color:#fff;
  border:1px solid #334155;
  border-radius:10px;
  padding:14px;
  font-size:15px;
  line-height:1.6;
  outline:none;
}

textarea:focus,
input:focus,
select:focus{
  border-color:#64748b;
}

.controls{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px;
  margin-top:15px;
}

.control{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.control label{
  font-size:12px;
  color:#94a3b8;
}

select,
input[type="number"],
input[type="text"]{
  width:100%;
  background:#080c12;
  color:#fff;
  border:1px solid #334155;
  border-radius:8px;
  padding:10px;
  outline:none;
}

input[type="file"]{
  width:100%;
  color:#cbd5e1;
}

button{
  border:0;
  border-radius:9px;
  padding:11px 15px;
  cursor:pointer;
  font-weight:bold;
  color:#fff;
  background:#1d4ed8;
  transition:.15s;
}

button:hover{
  filter:brightness(1.12);
}

button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.btn-green{
  background:#15803d;
}

.btn-orange{
  background:#c2410c;
}

.btn-red{
  background:#b91c1c;
}

.btn-gray{
  background:#334155;
}

.btn-purple{
  background:#6d28d9;
}

.buttons{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:16px;
}

.status{
  white-space:pre-wrap;
  background:#05080c;
  border:1px solid #263241;
  border-radius:10px;
  padding:13px;
  margin-top:15px;
  color:#cbd5e1;
  font-family:Consolas,monospace;
  font-size:13px;
  min-height:48px;
}

.progressWrap{
  margin-top:12px;
  height:10px;
  background:#020617;
  border-radius:10px;
  overflow:hidden;
  border:1px solid #1e293b;
}

.progress{
  width:0%;
  height:100%;
  background:#3b82f6;
  transition:width .15s;
}

.sceneGrid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(350px,1fr));
  gap:15px;
}

.scene{
  background:#0b1119;
  border:1px solid #263241;
  border-radius:13px;
  overflow:hidden;
}

.sceneHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:11px 13px;
  background:#111827;
  border-bottom:1px solid #263241;
}

.sceneTitle{
  font-weight:bold;
}

.sceneDuration{
  color:#93c5fd;
  font-size:12px;
}

.sceneBody{
  padding:13px;
}

.sceneText{
  width:100%;
  min-height:130px;
  background:#070b11;
  border:1px solid #334155;
  border-radius:8px;
  color:#e2e8f0;
  padding:10px;
  line-height:1.5;
  resize:vertical;
}

.prompt{
  width:100%;
  min-height:145px;
  margin-top:8px;
  background:#070b11;
  border:1px solid #334155;
  border-radius:8px;
  color:#cbd5e1;
  padding:10px;
  line-height:1.45;
  resize:vertical;
}

.preview{
  width:100%;
  aspect-ratio:16/9;
  background:#020617;
  border-radius:9px;
  margin-bottom:10px;
  overflow:hidden;
  border:1px solid #263241;
  display:flex;
  align-items:center;
  justify-content:center;
}

.preview img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.placeholder{
  color:#64748b;
  font-size:13px;
  text-align:center;
  padding:20px;
}

.sceneButtons{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:10px;
}

.sceneButtons button{
  padding:8px 10px;
  font-size:12px;
}

.audioInfo{
  margin-top:9px;
  color:#94a3b8;
  font-size:12px;
}

.small{
  font-size:12px;
  color:#64748b;
}

.checkRow{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:10px;
  color:#cbd5e1;
  font-size:13px;
}

#videoPreview{
  width:100%;
  max-height:650px;
  background:#000;
  border-radius:12px;
  border:1px solid #263241;
}

.download{
  display:inline-block;
  text-decoration:none;
  color:#fff;
  background:#15803d;
  padding:12px 18px;
  border-radius:9px;
  font-weight:bold;
  margin-top:12px;
}

.empty{
  padding:30px;
  border:1px dashed #334155;
  border-radius:12px;
  color:#64748b;
  text-align:center;
}

@media(max-width:700px){
  .container{
    width:94%;
  }

  .sceneGrid{
    grid-template-columns:1fr;
  }

  h1{
    font-size:24px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="panel">
    <h1>🎬 Mina Video AI V43.1</h1>
    <div class="subtitle">
      GeldStory Studio — uzun hikâyeler • sahne sistemi • görsel • gerçek ses • WebM
    </div>

    <textarea id="story"
      placeholder="Almanca hikâyeni buraya yapıştır...

Örnek:
Im Jahr 1960 begann ein Mann mit einem kleinen Restaurant...
"></textarea>

    <div class="controls">

      <div class="control">
        <label>Sahne Sayısı</label>
        <select id="sceneCount">
          <option value="auto">Otomatik</option>
          <option value="6">6</option>
          <option value="8">8</option>
          <option value="12">12</option>
          <option value="20">20</option>
          <option value="30">30</option>
          <option value="60">60</option>
          <option value="90">90</option>
          <option value="120">120</option>
          <option value="180">180</option>
          <option value="240">240</option>
        </select>
      </div>

      <div class="control">
        <label>Hedef Süre</label>
        <select id="targetDuration">
          <option value="0">Serbest</option>
          <option value="300">5 dakika</option>
          <option value="600">10 dakika</option>
          <option value="1800">30 dakika</option>
          <option value="3600">60 dakika</option>
          <option value="7200">120 dakika</option>
          <option value="10800">180 dakika</option>
      </select>
      </div>

      <div class="control">
        <label>Video Formatı</label>
        <select id="format">
          <option value="16:9">16:9 YouTube</option>
          <option value="9:16">9:16 Shorts</option>
          <option value="1:1">1:1 Kare</option>

      </div>

      <div class="control">
        <label>Performans</label>
        <select id="performance">
          <option value="eco">Eco</option>
          <option value="balanced" selected>Balanced</option>
          <option value="quality">Quality</option>
          <option value="long">Uzun Video</option>
        </select>
      </div>

      <div class="control">
        <label>FPS</label>
        <select id="fps">
          <option value="18">18 FPS</option>
          <option value="20" selected>20 FPS</option>
          <option value="24">24 FPS</option>
          <option value="30">30 FPS</option>
        </select>
      </div>

      <div class="control">
        <label>Dil</label>
        <select id="language">
          <option value="de-DE" selected>Deutsch</option>
          <option value="tr-TR">Türkçe</option>
          <option value="en-US">English</option>
        </select>
      </div>

      <div class="control">
        <label>Konuşma Hızı</label>

      <div class="control">

        <select id="motion">

          <option value="pan">Pan</option>

        </select>
      </div>

      <div class="control">
        <label>Görsel Stil</label>
        <select id="visualStyle">
          <option value="documentary" selected>Documentary</option>
          <option value="cinematic">Cinematic</option>
          <option value="business">Business</option>
          <option value="realistic">Photorealistic</option>
        </select>
      </div>

      <div class="control">
        <label>Altyazı</label>
        <select id="subtitleMode">
          <option value="on" selected>Açık</option>
          <option value="off">Kapalı</option>
        </select>
      </div>

      <div class="control">
        <label>Altyazı Boyutu</label>
        <select id="subtitleSize">
          <option value="28">28</option>
          <option value="34" selected>34</option>
          <option value="42">42</option>
          <option value="50">50</option>
        </select>

    </div>

    <div class="checkRow">
      <input type="checkbox" id="useLogo">
      <label for="useLogo">GeldStory logosunu videoda kullan</label>
    </div>

    <div class="control" style="margin-top:10px">
      <label>Logo</label>
      <input type="file" id="logoInput" accept="image/*">
    </div>

    <div class="checkRow">
      <input type="checkbox" id="directDisk">
      <label for="directDisk">
        Destekleniyorsa doğrudan diske kaydet
      </label>
    </div>

    <div class="buttons">
      <button id="createBtn" class="btn-green">🎬 SAHNELERİ OLUŞTUR</button>
      <button id="clearBtn" class="btn-gray">🗑 TEMİZLE</button>
      <button id="generateAllBtn" class="btn-purple">🖼 TÜM GÖRSELLERİ ÜRET</button>
      <button id="prepareAudioBtn" class="btn-orange">🎙 SES KAYDINI HAZIRLA</button>
      <button id="speakAllBtn" class="btn-orange">🔊 TÜMÜNÜ SESLENDİR + KAYDET</button>
      <button id="stopBtn" class="btn-red">⛔ DURDUR</button>
      <button id="renderBtn">🎞 VİDEOYU OLUŞTUR</button>
    </div>

    <div class="status" id="status">
Hazır.
Önce hikâyeyi yapıştırıp “SAHNELERİ OLUŞTUR” butonuna bas.
    </div>

    <div class="progressWrap">
      <div class="progress" id="progress"></div>
    </div>
  </div>


  <div class="panel">
    <h2>🎞 Sahne Listesi</h2>
    <div id="sceneCountInfo" class="small">
      Henüz sahne oluşturulmadı.
    </div>

    <div id="scenes" class="sceneGrid">
      <div class="empty">
        Hikâyeni girdikten sonra sahneler burada görünecek.
      </div>
    </div>
  </div>


  <div class="panel">
    <h2>🎥 Video Önizleme</h2>

    <video id="videoPreview" controls playsinline></video>

    <div id="downloadArea"></div>
  </div>

</div>


<script>
/* =========================================================
   MINA VIDEO AI V43.1
   CHROME 109 SAFE SCENE SYSTEM
========================================================= */

(function(){

"use strict";

/* =========================================================
   GLOBAL DATA
========================================================= */

var scenes = [];
var logoImage = null;
var recordingStream = null;
var recordingAudioStream = null;
var currentSpeechScene = -1;
var stopRequested = false;
var rendering = false;
var audioContext = null;
var finalVideoBlob = null;


/* =========================================================
   DOM
========================================================= */

var storyEl = document.getElementById("story");
var sceneCountEl = document.getElementById("sceneCount");
var targetDurationEl = document.getElementById("targetDuration");
var formatEl = document.getElementById("format");
var performanceEl = document.getElementById("performance");
var fpsEl = document.getElementById("fps");
var languageEl = document.getElementById("language");
var speechRateEl = document.getElementById("speechRate");
var motionEl = document.getElementById("motion");
var visualStyleEl = document.getElementById("visualStyle");
var subtitleModeEl = document.getElementById("subtitleMode");
var subtitleSizeEl = document.getElementById("subtitleSize");
var useLogoEl = document.getElementById("useLogo");
var logoInputEl = document.getElementById("logoInput");
var directDiskEl = document.getElementById("directDisk");

var createBtn = document.getElementById("createBtn");
var clearBtn = document.getElementById("clearBtn");
var generateAllBtn = document.getElementById("generateAllBtn");
var prepareAudioBtn = document.getElementById("prepareAudioBtn");
var speakAllBtn = document.getElementById("speakAllBtn");
var stopBtn = document.getElementById("stopBtn");
var renderBtn = document.getElementById("renderBtn");

var statusEl = document.getElementById("status");
var progressEl = document.getElementById("progress");
var scenesEl = document.getElementById("scenes");
var sceneCountInfoEl = document.getElementById("sceneCountInfo");
var videoPreviewEl = document.getElementById("videoPreview");
var downloadAreaEl = document.getElementById("downloadArea");


/* =========================================================
   ERROR SYSTEM
========================================================= */

window.onerror = function(message, source, line, column, error){

  var txt = "❌ JAVASCRIPT HATASI\n\n";
  txt += String(message || "Bilinmeyen hata");
  txt += "\nSatır: " + String(line || "?");

  if(column){
    txt += "\nKolon: " + String(column);
  }

  setStatus(txt);
  return false;
};


window.onunhandledrejection = function(event){

  var reason = event && event.reason
    ? event.reason
    : "Bilinmeyen Promise hatası";

  setStatus(
    "❌ PROMISE HATASI\n\n" +
    String(reason && reason.message ? reason.message : reason)
  );
};


/* =========================================================
   HELPERS
========================================================= */

function setStatus(text){
  statusEl.textContent = String(text);
}

function addStatus(text){
  statusEl.textContent += "\n" + String(text);
}

function setProgress(value){
  var n = Number(value);

  if(!isFinite(n)){
    n = 0;
  }

  if(n < 0) n = 0;
  if(n > 100) n = 100;

  progressEl.style.width = n + "%";
}

function sleep(ms){
  return new Promise(function(resolve){
    setTimeout(resolve, ms);
  });
}

function formatSeconds(sec){

  if(!isFinite(sec) || sec <= 0){
    return "0.0 sn";
  }

  var s = Math.round(sec * 10) / 10;

  if(s < 60){
    return s.toFixed(1) + " sn";
  }

  var m = Math.floor(s / 60);
  var r = Math.round((s % 60) * 10) / 10;

  return m + " dk " + r.toFixed(1) + " sn";
}

function formatTime(sec){

  if(!isFinite(sec) || sec < 0){
    sec = 0;
  }

  var total = Math.floor(sec);
  var h = Math.floor(total / 3600);
  var m = Math.floor((total % 3600) / 60);
  var s = total % 60;

  function two(n){
    return n < 10 ? "0" + n : String(n);
  }

  return two(h) + ":" + two(m) + ":" + two(s);
}


/* =========================================================
   TEXT CLEANING
========================================================= */

function cleanText(text){

  if(!text){
    return "";
  }

  return String(text)
    .replace(/\r/g," ")
    .replace(/\n+/g," ")
    .replace(/\t+/g," ")
    .replace(/\s+/g," ")
    .trim();
}


/* =========================================================
   SENTENCE SPLITTER
   NO LOOKBEHIND
========================================================= */

function splitSentences(text){

  text = cleanText(text);

  if(!text){
    return [];
  }

  var matches = text.match(
    /[^.!?。！？]+[.!?。！？]+|[^.!?。！？]+$/g
  );

  if(!matches){
    return [text];
  }

  var result = [];

  for(var i=0;i<matches.length;i++){

    var part = matches[i]
      .replace(/\s+/g," ")
      .trim();

    if(part){
      result.push(part);
    }
  }

  return result;
}


/* =========================================================
   SCENE COUNT
========================================================= */

function chooseAutomaticSceneCount(sentenceCount){

  if(sentenceCount <= 3) return sentenceCount;
  if(sentenceCount <= 8) return sentenceCount;
  if(sentenceCount <= 14) return 6;
  if(sentenceCount <= 20) return 8;
  if(sentenceCount <= 32) return 12;
  if(sentenceCount <= 55) return 20;
  if(sentenceCount <= 80) return 30;
  if(sentenceCount <= 150) return 60;
  if(sentenceCount <= 230) return 90;
  if(sentenceCount <= 320) return 120;
  if(sentenceCount <= 480) return 180;

  return 240;
}


/* =========================================================
   GROUP SENTENCES
========================================================= */

function groupSentences(sentences, requestedCount){

  if(!sentences || sentences.length === 0){
    return [];
  }

  var count = requestedCount;

  if(count === "auto"){
    count = chooseAutomaticSceneCount(sentences.length);
  }else{
    count = parseInt(count,10);
  }

  if(!isFinite(count) || count < 1){
    count = 1;
  }

  /*
    Hikâyede istenenden az cümle varsa
    boş sahne oluşturma.
  */
  if(count > sentences.length){
    count = sentences.length;
  }

  var result = [];

  var base = Math.floor(sentences.length / count);
  var remainder = sentences.length % count;

  var index = 0;

  for(var i=0;i<count;i++){

    var amount = base;

    if(i < remainder){
      amount++;
    }

    var parts = [];

    for(var j=0;j<amount;j++){

      if(sentences[index]){
        parts.push(sentences[index]);
      }

      index++;
    }

    if(parts.length){
      result.push(parts.join(" "));
    }
  }

  return result;
}


/* =========================================================
   PROMPT GENERATOR
========================================================= */

function createPrompt(text, index){

  var style = visualStyleEl.value;

  var styleText = "";

  if(style === "documentary"){
    styleText =
      "premium documentary photography, realistic historical details, authentic locations, natural lighting";
  }

  if(style === "cinematic"){
    styleText =
      "cinematic movie frame, dramatic realistic lighting, cinematic composition, subtle depth of field";
  }

  if(style === "business"){
    styleText =
      "premium business documentary, realistic corporate environment, professional photography, cinematic lighting";
  }

  if(style === "realistic"){
    styleText =
      "ultra realistic professional photography, natural human appearance, realistic environment, authentic details";
  }

  return (
    styleText +
    ", photorealistic, high detail, 4K appearance, documentary storytelling, " +
    "real human proportions, realistic skin, realistic clothing, realistic architecture, " +
    "professional composition, no text, no watermark, no logo, no subtitles. " +
    "Scene " + (index + 1) + ". " +
    "Visualize this exact story moment: " +
    text
  );
}


/* =========================================================
   SCENE OBJECT
========================================================= */

function makeScene(text,index){

  return {
    id:index + 1,
    text:text,
    prompt:createPrompt(text,index),
    imageBlob:null,
    imageURL:"",
    imageElement:null,
    audioBlob:null,
    audioURL:"",
    audioDuration:0,
    audioElement:null,
    generated:false
  };
}


/* =========================================================
   CREATE SCENES
========================================================= */

function createScenes(){

  try{

    stopRequested = false;

    var raw = storyEl.value;

    if(!raw || !cleanText(raw)){

      scenes = [];

      renderSceneCards();

      setStatus(
        "⚠️ Önce hikâyeyi yaz veya yapıştır.\n\n" +
        "Örnek:\n" +
        "Im Jahr 1960 begann ein Mann mit einem kleinen Restaurant..."
      );

      return;
    }

    var sentences = splitSentences(raw);

    if(sentences.length === 0){

      setStatus(
        "⚠️ Hikâyeden cümle bulunamadı."
      );

      return;
    }

    setStatus(
      "⏳ Hikâye analiz ediliyor...\n" +
      "Cümle sayısı: " + sentences.length
    );

    var grouped = groupSentences(
      sentences,
      sceneCountEl.value
    );

    if(grouped.length === 0){

      setStatus(
        "❌ Sahne oluşturulamadı."
      );

      return;
    }

    scenes = [];

    for(var i=0;i<grouped.length;i++){

      scenes.push(
        makeScene(grouped[i],i)
      );
    }

    renderSceneCards();

    sceneCountInfoEl.textContent =
      scenes.length +
      " sahne oluşturuldu • " +
      sentences.length +
      " cümle işlendi.";

    setProgress(100);

    setStatus(
      "✅ SAHNELER BAŞARIYLA OLUŞTURULDU!\n\n" +
      "Sahne: " + scenes.length + "\n" +
      "Cümle: " + sentences.length + "\n\n" +
      "Şimdi her sahne için görsel ve ses ekleyebilirsin."
    );

  }catch(error){

    setStatus(
      "❌ SAHNE OLUŞTURMA HATASI\n\n" +
      String(error && error.message ? error.message : error)
    );
  }
}


/* =========================================================
   CREATE ELEMENT
========================================================= */

function createElement(tag,className,text){

  var el = document.createElement(tag);

  if(className){
    el.className = className;
  }

  if(typeof text !== "undefined"){
    el.textContent = text;
  }

  return el;
}


/* =========================================================
   RENDER SCENE CARDS
   NO BIG INNERHTML
========================================================= */

function renderSceneCards(){

  while(scenesEl.firstChild){
    scenesEl.removeChild(scenesEl.firstChild);
  }

  if(!scenes.length){

    var empty = createElement(
      "div",
      "empty",
      "Henüz sahne yok."
    );

    scenesEl.appendChild(empty);

    sceneCountInfoEl.textContent =
      "Henüz sahne oluşturulmadı.";

    return;
  }

  for(var i=0;i<scenes.length;i++){

    createSceneCard(scenes[i],i);
  }
}


/* =========================================================
   SCENE CARD
========================================================= */

function createSceneCard(scene,index){

  var card = createElement("div","scene");

  /* HEADER */

  var head = createElement("div","sceneHead");

  var title = createElement(
    "div",
    "sceneTitle",
    "🎬 SAHNE " + (index + 1)
  );

  var duration = createElement(
    "div",
    "sceneDuration"
  );

  duration.textContent =
    formatSeconds(scene.audioDuration);

  head.appendChild(title);
  head.appendChild(duration);

function generateSceneImage(scene,index){

  if(!scene.prompt){

    setStatus(
      "⚠️ Sahne " +
      (index + 1) +
      " için prompt yok."
    );

    return;
  }

  setStatus(
    "🖼 Sahne " +
    (index + 1) +
    " görseli üretiliyor..."
  );

  var width = 1280;
  var height = 720;

  if(formatEl.value === "9:16"){
    width = 720;
    height = 1280;
  }

  if(formatEl.value === "1:1"){
    width = 1024;
    height = 1024;
  }

  var seed =
    Date.now() +
    index * 997;

  var url =
    "https://image.pollinations.ai/prompt/" +
    encodeURIComponent(scene.prompt) +
    "?width=" + width +
    "&height=" + height +
    "&nologo=true" +
    "&seed=" + seed;

  var img = new Image();

  img.onload = function(){

    scene.imageElement = img;
    scene.imageURL = url;
    scene.generated = true;

    renderSceneCards();

    setStatus(
      "✅ Sahne " +
      (index + 1) +
      " görseli hazır."
    );
  };

  img.onerror = function(){

    setStatus(
      "❌ Sahne " +
      (index + 1) +
      " görseli üretilemedi.\n\n" +
      "Görsel servisi erişim hatası vermiş olabilir."
    );
  };

  img.src = url;
}

/* =========================================================
   AUDIO CONTEXT
========================================================= */

function getAudioContext(){

  if(!audioContext){

    var AC =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!AC){
      throw new Error(
        "Tarayıcı Web Audio desteklemiyor."
      );
    }

    audioContext = new AC();
  }

  return audioContext;
}


/* =========================================================
   AUDIO DURATION
========================================================= */

function decodeAudioDuration(blob){

  return new Promise(function(resolve,reject){

    try{

      var ctx = getAudioContext();

      var reader = new FileReader();

      reader.onload = function(){

        ctx.decodeAudioData(
          reader.result,
          function(buffer){

            resolve(buffer.duration);

          },
          function(){

            reject(
              new Error(
                "Ses dosyası çözümlenemedi."
              )
            );
          }
        );
      };

      reader.onerror = function(){

        reject(
          new Error(
            "Ses dosyası okunamadı."
          )
        );
      };

      reader.readAsArrayBuffer(blob);

    }catch(error){

      reject(error);
    }
  });
}


/* =========================================================
   SPEECH
========================================================= */

function speakScene(scene,index,record){

  if(!scene.text){

    setStatus(
      "⚠️ Sahne metni boş."
    );

    return;
  }

  window.speechSynthesis.cancel();

  stopRequested = false;
  currentSpeechScene = index;

  var utterance =
    new SpeechSynthesisUtterance(
      scene.text
    );

  utterance.lang =
    languageEl.value;

  utterance.rate =
    parseFloat(
      speechRateEl.value
    ) || 0.95;

  utterance.pitch = 1;

  utterance.volume = 1;

  utterance.onstart = function(){

    setStatus(
      "🔊 Sahne " +
      (index + 1) +
      " seslendiriliyor..."
    );
  };

  utterance.onend = function(){

    if(!record){

      setStatus(
        "✅ Sahne " +
        (index + 1) +
        " seslendirme tamamlandı."
      );

      return;
    }

    setStatus(
      "🎙 Ses kaydı tamamlandı."
    );
  };

  utterance.onerror = function(event){

    setStatus(
      "❌ Seslendirme hatası:\n" +
      String(
        event &&
        event.error
          ? event.error
          : "Bilinmeyen hata"
      )
    );
  };

  if(record){

    recordCurrentSpeech(
      scene,
      index,
      utterance
    );

  }else{

    window.speechSynthesis.speak(
      utterance
    );
  }
}


/* =========================================================
   PREPARE AUDIO
========================================================= */

async function prepareAudioCapture(){

  try{

    if(!navigator.mediaDevices ||
       !navigator.mediaDevices.getDisplayMedia){

      setStatus(
        "❌ Bu Chrome sürümünde ekran/sistem ses kaydı için getDisplayMedia kullanılamıyor."
      );

      return;
    }

    setStatus(
      "🎙 Kayıt sistemi hazırlanıyor...\n\n" +
      "Açılan pencerede bir ekran veya pencere seç.\n" +
      "Ses paylaşımı seçeneğini açık tut."
    );

    var stream =
      await navigator.mediaDevices.getDisplayMedia({
        video:true,
        audio:true
      });

    recordingStream = stream;

    var tracks =
      stream.getAudioTracks();

    if(!tracks.length){

      setStatus(
        "⚠️ Ses kanalı alınamadı.\n\n" +
        "Ekran paylaşım penceresinde " +
        "“Ses paylaş” seçeneğini aç."
      );

      return;
    }

    recordingAudioStream =
      new MediaStream(tracks);

    setStatus(
      "✅ Ses kaydı hazır.\n\n" +
      "Şimdi “TÜMÜNÜ SESLENDİR + KAYDET” butonuna bas."
    );

  }catch(error){

    setStatus(
      "❌ Ses kayıt hazırlama hatası:\n\n" +
      String(
        error && error.message
          ? error.message
          : error
      )
    );
  }
}


/* =========================================================
   RECORD CURRENT SPEECH
========================================================= */

function recordCurrentSpeech(
  scene,
  index,
  utterance
){

  if(!recordingAudioStream){

    setStatus(
      "⚠️ Önce “SES KAYDINI HAZIRLA” butonuna bas."
    );

    return;
  }

  var mime = "";

  if(MediaRecorder.isTypeSupported(
    "audio/webm;codecs=opus"
  )){
    mime = "audio/webm;codecs=opus";
  }else if(MediaRecorder.isTypeSupported(
    "audio/webm"
  )){
    mime = "audio/webm";
  }

  var options = {};

  if(mime){
    options.mimeType = mime;
  }

  var recorder;

  try{

    recorder =
      new MediaRecorder(
        recordingAudioStream,
        options
      );

  }catch(error){

    setStatus(
      "❌ MediaRecorder başlatılamadı:\n" +
      String(error)
    );

    return;
  }

  var chunks = [];

  recorder.ondataavailable =
    function(event){

      if(event.data &&
         event.data.size > 0){

        chunks.push(event.data);
      }
    };

  recorder.onerror =
    function(event){

      setStatus(
        "❌ Ses kayıt hatası."
      );
    };

  recorder.onstop =
    async function(){

      try{

        var blob =
          new Blob(
            chunks,
            {
              type:
                mime ||
                "audio/webm"
            }
          );

        if(!blob.size){

          setStatus(
            "❌ Boş ses kaydı oluştu."
          );

          return;
        }

        scene.audioBlob = blob;

        if(scene.audioURL){

          try{
            URL.revokeObjectURL(
              scene.audioURL
            );
          }catch(e){}
        }

        scene.audioURL =
          URL.createObjectURL(blob);

        var duration =
          await decodeAudioDuration(blob);

        scene.audioDuration =
          duration;

        renderSceneCards();

        setStatus(
          "✅ SAHNE " +
          (index + 1) +
          " GERÇEK SESLE KAYDEDİLDİ.\n\n" +
          "Süre: " +
          formatSeconds(duration)
        );

      }catch(error){

        setStatus(
          "❌ Kaydedilen ses işlenemedi:\n" +
          String(error)
        );
      }
    };

  try{

    recorder.start(1000);

    window.speechSynthesis.cancel();

    window.speechSynthesis.speak(
      utterance
    );

    utterance.onend =
      function(){

        setTimeout(
          function(){

            if(
              recorder &&
              recorder.state === "recording"
            ){
              recorder.stop();
            }

          },
          300
        );
      };

  }catch(error){

    try{

      if(
        recorder &&
        recorder.state === "recording"
      ){
        recorder.stop();
      }

    }catch(e){}

    setStatus(
      "❌ Seslendirme/kayıt başlatılamadı:\n" +
      String(error)
    );
  }
}

/* =========================================================
   RECORD SCENE PROMISE
========================================================= */

function recordScenePromise(scene,index){

  return new Promise(function(resolve){

    if(!recordingAudioStream){

      setStatus(
        "❌ Ses akışı bulunamadı."
      );

      resolve(false);

      return;
    }

    var mime = "";

    if(MediaRecorder.isTypeSupported(
      "audio/webm;codecs=opus"
    )){
      mime =
        "audio/webm;codecs=opus";
    }else if(
      MediaRecorder.isTypeSupported(
        "audio/webm"
      )
    ){
      mime = "audio/webm";
    }

    var options = {};

    if(mime){
      options.mimeType = mime;
    }

    var recorder;

    try{

      recorder =
        new MediaRecorder(
          recordingAudioStream,
          options
        );

    }catch(error){

      setStatus(
        "❌ MediaRecorder hatası:\n" +
        String(error)
      );

      resolve(false);

      return;
    }

    var chunks = [];

    recorder.ondataavailable =
      function(event){

        if(
          event.data &&
          event.data.size
        ){
          chunks.push(event.data);
        }
      };

    recorder.onerror =
      function(){

        resolve(false);
      };

    recorder.onstop =
      async function(){

        try{

          var blob =
            new Blob(
              chunks,
              {
                type:
                  mime ||
                  "audio/webm"
              }
            );

          if(!blob.size){

            resolve(false);
            return;
          }

          scene.audioBlob = blob;

          if(scene.audioURL){

            try{
              URL.revokeObjectURL(
                scene.audioURL
              );
            }catch(e){}
          }

          scene.audioURL =
            URL.createObjectURL(blob);

          scene.audioDuration =
            await decodeAudioDuration(
              blob
            );

          renderSceneCards();

          setStatus(
            "🎙 Sahne " +
            (index + 1) +
            " kaydedildi: " +
            formatSeconds(
              scene.audioDuration
            )
          );

          resolve(true);

        }catch(error){

          setStatus(
            "❌ Ses işlenemedi:\n" +
            String(error)
          );

          resolve(false);
        }
      };

    var utterance =
      new SpeechSynthesisUtterance(
        scene.text
      );

    utterance.lang =
      languageEl.value;

    utterance.rate =
      parseFloat(
        speechRateEl.value
      ) || 0.95;

    utterance.pitch = 1;
    utterance.volume = 1;

    utterance.onerror =
      function(){

        try{

          if(
            recorder &&
            recorder.state === "recording"
          ){
            recorder.stop();
          }

        }catch(e){}

        resolve(false);
      };

    utterance.onend =
      function(){

        setTimeout(
          function(){

            try{

              if(
                recorder &&
                recorder.state === "recording"
              ){
                recorder.stop();
              }

            }catch(e){

              resolve(false);
            }

          },
          350
        );
      };

    try{

      recorder.start(500);

      window.speechSynthesis.cancel();

      setTimeout(
        function(){

          if(!stopRequested){

            window.speechSynthesis.speak(
              utterance
            );

          }else{

            try{

              if(
                recorder &&
                recorder.state === "recording"
              ){
                recorder.stop();
              }

            }catch(e){}

            resolve(false);
          }

        },
        150
      );

    }catch(error){

      setStatus(
        "❌ Sahne ses kaydı başlatılamadı:\n" +
        String(error)
      );

      resolve(false);
    }
  });
}

/* =========================================================
   DRAW IMAGE WITH MOTION
========================================================= */

function drawSceneImage(
  ctx,
  img,
  canvas,
  sceneIndex,
  progress
){

  var cw = canvas.width;
  var ch = canvas.height;

  ctx.fillStyle = "#000";
  ctx.fillRect(
    0,
    0,
    cw,
    ch
  );

  if(!img){
    return;
  }

  var iw = img.naturalWidth || img.width;
  var ih = img.naturalHeight || img.height;

  if(!iw || !ih){
    return;
  }

  var scale =
    Math.max(
      cw / iw,
      ch / ih
    );

  var drawW =
    iw * scale;

  var drawH =
    ih * scale;

  var motion =
    motionEl.value;

  if(motion === "auto"){

    var mode =
      sceneIndex % 4;

    if(mode === 0){
      motion = "zoom";
    }else if(mode === 1){
      motion = "pan";
    }else if(mode === 2){
      motion = "slow";
    }else{
      motion = "zoom";
    }
  }

  var zoom = 1;

  var x = 0;
  var y = 0;

  if(motion === "zoom"){

    zoom =
      1.0 +
      0.08 * progress;

  }else if(motion === "slow"){

    zoom =
      1.0 +
      0.035 * progress;

  }else if(motion === "pan"){

    zoom = 1.04;

    x =
      (cw - drawW * zoom) *
      progress;

    y =
      (ch - drawH * zoom) *
      (1 - progress);

  }else{

    zoom = 1;
  }

  if(motion === "zoom" ||
     motion === "slow"){

    var newW =
      drawW * zoom;

    var newH =
      drawH * zoom;

    x =
      (cw - newW) / 2;

    y =
      (ch - newH) / 2;
  }else{

    drawW =
      drawW * zoom;

    drawH =
      drawH * zoom;
  }

  ctx.drawImage(
    img,
    x,
    y,
    drawW,
    drawH
  );
}


/* =========================================================
   SUBTITLE
========================================================= */

function drawSubtitle(
  ctx,
  text,
  canvas
){

  if(subtitleModeEl.value !== "on"){
    return;
  }

  if(!text){
    return;
  }

  var size =
    parseInt(
      subtitleSizeEl.value,
      10
    ) || 34;

  var maxWidth =
    canvas.width * 0.82;

  ctx.font =
    "bold " +
    size +
    "px Arial";

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  var words =
    String(text)
      .split(/\s+/);

  var lines = [];
  var line = "";

  for(var i=0;i<words.length;i++){

    var test =
      line
        ? line + " " + words[i]
        : words[i];

    var width =
      ctx.measureText(test).width;

    if(
      width > maxWidth &&
      line
    ){

      lines.push(line);
      line = words[i];

    }else{

      line = test;
    }
  }

  if(line){
    lines.push(line);
  }

  if(lines.length > 4){

    lines =
      lines.slice(0,4);

    lines[3] += "…";
  }

  var lineHeight =
    size * 1.25;

  var total =
    lines.length *
    lineHeight;

  var startY =
    canvas.height -
    total -
    canvas.height * 0.06;

  ctx.save();

  ctx.fillStyle =
    "rgba(0,0,0,.62)";

  var boxWidth =
    Math.min(
      canvas.width * 0.9,
      maxWidth + 50
    );

  var boxHeight =
    total + 28;

  var boxX =
    (canvas.width -
     boxWidth) / 2;

  var boxY =
    startY - 14;

  roundRect(
    ctx,
    boxX,
    boxY,
    boxWidth,
    boxHeight,
    14
  );

  ctx.fill();

  ctx.fillStyle =
    "#ffffff";

  for(var j=0;j<lines.length;j++){

    ctx.fillText(
      lines[j],
      canvas.width / 2,
      startY +
      j * lineHeight +
      lineHeight / 2
    );
  }

  ctx.restore();
}


/* =========================================================
   ROUND RECT
========================================================= */

function roundRect(
  ctx,
  x,
  y,
  w,
  h,
  r
){

  ctx.beginPath();

  ctx.moveTo(
    x + r,
    y
  );

  ctx.lineTo(
    x + w - r,
    y
  );

  ctx.quadraticCurveTo(
    x + w,
    y,
    x + w,
    y + r
  );

  ctx.lineTo(
    x + w,
    y + h - r
  );

  ctx.quadraticCurveTo(
    x + w,
    y + h,
    x + w - r,
    y + h
  );

  ctx.lineTo(
    x + r,
    y + h
  );

  ctx.quadraticCurveTo(
    x,
    y + h,
    x,
    y + h - r
  );

  ctx.lineTo(
    x,
    y + r
  );

  ctx.quadraticCurveTo(
    x,
    y,
    x + r,
    y
  );

  ctx.closePath();
}


/* =========================================================
   LOGO
========================================================= */

function drawLogo(ctx,canvas){

  if(!useLogoEl.checked){
    return;
  }

  if(!logoImage){
    return;
  }

  var maxW =
    canvas.width * 0.13;

  var maxH =
    canvas.height * 0.09;

  var iw =
    logoImage.naturalWidth ||
    logoImage.width;

  var ih =
    logoImage.naturalHeight ||
    logoImage.height;

  if(!iw || !ih){
    return;
  }

  var scale =
    Math.min(
      maxW / iw,
      maxH / ih
    );

  var w =
    iw * scale;

  var h =
    ih * scale;

  var x =
    canvas.width -
    w -
    25;

  var y = 25;

  ctx.save();

  ctx.globalAlpha = 0.9;

  ctx.drawImage(
    logoImage,
    x,
    y,
    w,
    h
  );

  ctx.restore();
}


/* =========================================================
   AUDIO BUFFER
========================================================= */

function blobToAudioBuffer(blob){

  return new Promise(function(resolve,reject){

    var ctx;

    try{

      ctx = getAudioContext();

    }catch(error){

      reject(error);
      return;
    }

    var reader =
      new FileReader();

    reader.onload =
      function(){

        ctx.decodeAudioData(
          reader.result,
          function(buffer){
            resolve(buffer);
          },
          function(){
            reject(
              new Error(
                "Ses decode edilemedi."
              )
            );
          }
        );
      };

    reader.onerror =
      function(){

        reject(
          new Error(
            "Ses dosyası okunamadı."
          )
        );
      };

    reader.readAsArrayBuffer(blob);
  });
}


/* =========================================================
   RENDER VIDEO
========================================================= */

async function renderVideo(){

  if(rendering){
    return;
  }

  if(!scenes.length){

    setStatus(
      "⚠️ Önce sahneleri oluştur."
    );

    return;
  }

  var usableScenes = [];

  for(var i=0;i<scenes.length;i++){

    if(
      scenes[i].imageURL &&
      scenes[i].audioBlob &&
      scenes[i].audioDuration > 0
    ){

      usableScenes.push(
        scenes[i]
      );
    }
  }

  if(!usableScenes.length){

    setStatus(
      "⚠️ Video oluşturmak için en az bir sahnede:\n\n" +
      "🖼 Görsel\n" +
      "🎵 Gerçek ses\n\n" +
      "olmalı."
    );

    return;
  }

  rendering = true;
  stopRequested = false;

  setProgress(0);

  downloadAreaEl.innerHTML = "";

  try{

    setStatus(
      "⏳ Video hazırlığı başlıyor...\n\n" +
      "Sahneler: " +
      usableScenes.length
    );

    var size =
      getCanvasSize();

    var canvas =
      document.createElement("canvas");

    canvas.width =
      size.width;

    canvas.height =
      size.height;

    var ctx =
      canvas.getContext("2d");

    if(!ctx){

      throw new Error(
        "Canvas 2D kullanılamıyor."
      );
    }

    var fps =
      parseInt(
        fpsEl.value,
        10
      ) || 20;

    var stream =
      canvas.captureStream(
        fps
      );

    var audioCtx =
      getAudioContext();

    if(audioCtx.state === "suspended"){

      try{
        await audioCtx.resume();
      }catch(e){}
    }

    var destination =
      audioCtx.createMediaStreamDestination();

    var audioTracks =
      destination.stream.getAudioTracks();

    for(
      var at=0;
      at<audioTracks.length;
      at++
    ){

      stream.addTrack(
        audioTracks[at]
      );
    }

    var mime =
      chooseVideoMime();

    var recorderOptions = {};

    if(mime){
      recorderOptions.mimeType =
        mime;
    }

    var recorder;

    try{

      recorder =
        new MediaRecorder(
          stream,
          recorderOptions
        );

    }catch(error){

      throw new Error(
        "Video MediaRecorder başlatılamadı: " +
        error.message
      );
    }

    var videoChunks = [];

    recorder.ondataavailable =
      function(event){

        if(
          event.data &&
          event.data.size > 0
        ){

          videoChunks.push(
            event.data
          );
        }
      };

    var stoppedPromise =
      new Promise(function(resolve){

        recorder.onstop =
          function(){

            resolve();
          };
      });

    recorder.start(1000);

    var totalDuration = 0;

    for(
      var d=0;
      d<usableScenes.length;
      d++
    ){

      totalDuration +=
        usableScenes[d].audioDuration;
    }

    var elapsedBefore = 0;

    for(
      var s=0;
      s<usableScenes.length;
      s++
    ){

      if(stopRequested){
        break;
      }

      var scene =
        usableScenes[s];

      setStatus(
        "🎞 SAHNE " +
        (s + 1) +
        " / " +
        usableScenes.length +
        "\n\n" +
        "Süre: " +
        formatSeconds(
          scene.audioDuration
        ) +
        "\n\n" +
        "Toplam: " +
        formatTime(
          totalDuration
        )
      );

      var img;

      try{

        img =
          await loadImage(
            scene.imageURL
          );

      }catch(error){

        setStatus(
          "⚠️ Sahne " +
          (s + 1) +
          " görseli yüklenemedi, atlanıyor."
        );

        continue;
      }

      var audioBuffer =
        await blobToAudioBuffer(
          scene.audioBlob
        );

      var source =
        audioCtx.createBufferSource();

      source.buffer =
        audioBuffer;

      source.connect(
        destination
      );

      var startTime =
        audioCtx.currentTime;

      source.start(
        startTime
      );

      var sceneDuration =
        scene.audioDuration;

      var startWall =
        performance.now();

      while(true){

        if(stopRequested){
          break;
        }

        var elapsed =
          (
            performance.now() -
            startWall
          ) / 1000;

        var p =
          sceneDuration > 0
            ? elapsed / sceneDuration
            : 1;

        if(p > 1){
          p = 1;
        }

        drawSceneImage(
          ctx,
          img,
          canvas,
          s,
          p
        );

        drawLogo(
          ctx,
          canvas
        );

        drawSubtitle(
          ctx,
          scene.text,
          canvas
        );

        var totalProgress =
          (
            elapsedBefore +
            Math.min(
              elapsed,
              sceneDuration
            )
          ) /
          Math.max(
            totalDuration,
            0.001
          );

        setProgress(
          totalProgress * 100
        );

        if(
          performance &&
          performance.now
        ){

          await new Promise(
            function(resolve){
              requestAnimationFrame(
                function(){
                  resolve();
                }
              );
            }
          );

        }else{

          await sleep(
            Math.max(
              20,
              1000 / fps
            )
          );
        }

        if(elapsed >= sceneDuration){
          break;
        }
      }

      try{
        source.stop();
      }catch(e){}

      elapsedBefore +=
        sceneDuration;
    }

    try{

      if(
        recorder.state ===
        "recording"
      ){

        recorder.stop();
      }

    }catch(e){}

    await stoppedPromise;

    if(!videoChunks.length){

      throw new Error(
        "Video verisi oluşmadı."
      );
    }

    finalVideoBlob =
      new Blob(
        videoChunks,
        {
          type:
            mime ||
            "video/webm"
        }
      );

    var videoURL =
      URL.createObjectURL(
        finalVideoBlob
      );

    videoPreviewEl.src =
      videoURL;

    videoPreviewEl.load();

    var download =
      document.createElement("a");

    download.className =
      "download";

    download.href =
      videoURL;

    download.download =
      "GeldStory_V43_1_" +
      Date.now() +
      ".webm";

    download.textContent =
      "⬇ WEBM VİDEOYU İNDİR";

    downloadAreaEl.appendChild(
      download
    );

    setProgress(100);

    setStatus(
      "✅ VİDEO HAZIR!\n\n" +
      "Toplam süre: " +
      formatTime(totalDuration) +
      "\n" +
      "Sahneler: " +
      usableScenes.length +
      "\n" +
      "Format: " +
      formatEl.value +
      "\n" +
      "FPS: " +
      fps +
      "\n\n" +
      "🎵 Gerçek ses videoya eklendi."
    );

    if(
      directDiskEl.checked &&
      window.showSaveFilePicker
    ){

      try{

        var handle =
          await window.showSaveFilePicker({
            suggestedName:
              "GeldStory_" +
              Date.now() +
              ".webm",
            types:[
              {
                description:
                  "WebM Video",
                accept:{
                  "video/webm":
                    [".webm"]
                }
              }
            ]
          });

        var writable =
          await handle.createWritable();

        await writable.write(
          finalVideoBlob
        );

        await writable.close();

        setStatus(
          "✅ VİDEO HAZIR VE DİSKE KAYDEDİLDİ.\n\n" +
          "Toplam süre: " +
          formatTime(totalDuration)
        );

      }catch(saveError){

        addStatus(
          "\nℹ️ Doğrudan disk kaydı iptal edildi veya desteklenmedi."
        );
      }
    }

  }catch(error){

    setStatus(
      "❌ VİDEO OLUŞTURMA HATASI\n\n" +
      String(
        error &&
        error.message
          ? error.message
          : error
      )
    );

  }finally{

    rendering = false;
  }
}


/* =========================================================
   VIDEO MIME
========================================================= */

function chooseVideoMime(){

  var types = [
    "video/webm;codecs=vp9,opus",
    "video/webm;codecs=vp8,opus",
    "video/webm"
  ];

  for(
    var i=0;
    i<types.length;
    i++
  ){

    try{

      if(
        MediaRecorder.isTypeSupported(
          types[i]
        )
      ){

        return types[i];
      }

    }catch(e){}
  }

  return "";
}


/* =========================================================
   STOP ALL
========================================================= */

function stopEverything(){

  stopRequested = true;

  try{
    window.speechSynthesis.cancel();
  }catch(e){}

  if(
    recordingStream
  ){

    var tracks =
      recordingStream.getTracks();

    for(
      var i=0;
      i<tracks.length;
      i++
    ){

      try{
        tracks[i].stop();
      }catch(e){}
    }
  }

  recordingStream = null;
  recordingAudioStream = null;

  setStatus(
    "⛔ TÜM İŞLEMLER DURDURULDU."
  );
}


/* =========================================================
   CLEAR
========================================================= */

function clearAll(){

  stopEverything();

  scenes = [];

  logoImage = null;

  storyEl.value = "";

  videoPreviewEl.removeAttribute(
    "src"
  );

  videoPreviewEl.load();

  downloadAreaEl.innerHTML = "";

  setProgress(0);

  renderSceneCards();

  setStatus(
    "🗑 Temizlendi.\n\nHazır."
  );
}
