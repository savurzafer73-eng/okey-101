<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mina Film Studio V3.3</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#080b12;
  color:#eee;
  font-family:Arial,Helvetica,sans-serif;
}

header{
  background:linear-gradient(135deg,#111827,#1e293b);
  padding:18px;
  text-align:center;
  border-bottom:1px solid #334155;
}

header h1{
  margin:0;
  font-size:25px;
  color:#7dd3fc;
}

header p{
  margin:7px 0 0;
  color:#94a3b8;
  font-size:13px;
}

.container{
  width:95%;
  max-width:1250px;
  margin:20px auto;
}

.panel{
  background:#111827;
  border:1px solid #263244;
  border-radius:12px;
  padding:15px;
  margin-bottom:15px;
}

.panel h2{
  margin:0 0 12px;
  font-size:18px;
  color:#7dd3fc;
}

label{
  display:block;
  margin-top:10px;
  margin-bottom:5px;
  color:#cbd5e1;
  font-size:13px;
}

input,
textarea,
select{
  width:100%;
  background:#0b1220;
  border:1px solid #334155;
  color:#fff;
  border-radius:7px;
  padding:9px;
  font-size:14px;
}

textarea{
  min-height:90px;
  resize:vertical;
}

button{
  border:0;
  border-radius:8px;
  padding:10px 14px;
  margin:5px 4px 5px 0;
  background:#2563eb;
  color:white;
  cursor:pointer;
  font-weight:bold;
}

button:hover{
  background:#3b82f6;
}

button.red{
  background:#dc2626;
}

button.green{
  background:#059669;
}

button.gray{
  background:#475569;
}

button.orange{
  background:#d97706;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:14px;
}

.scene{
  background:#0b1220;
  border:1px solid #334155;
  border-radius:10px;
  padding:12px;
}

.scene h3{
  margin:0 0 10px;
  color:#fbbf24;
}

.sceneImage{
  width:100%;
  height:170px;
  background:#020617;
  border-radius:8px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:10px;
  border:1px solid #1e293b;
}

.sceneImage img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.placeholder{
  color:#64748b;
  font-size:13px;
}

.audioBox{
  margin-top:10px;
  padding:10px;
  border:1px solid #263244;
  border-radius:8px;
  background:#080d17;
}

.audioStatus{
  font-size:12px;
  color:#94a3b8;
  margin-top:5px;
  word-break:break-word;
}

audio{
  width:100%;
  margin-top:7px;
}

.viewerWrap{
  background:#020617;
  border:1px solid #334155;
  border-radius:12px;
  padding:12px;
}

.viewer{
  position:relative;
  width:100%;
  max-width:1000px;
  margin:auto;
  aspect-ratio:16/9;
  background:#000;
  overflow:hidden;
  border-radius:8px;
}

#filmImage{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
  left:0;
  top:0;
  transform-origin:center center;
  transition:transform .08s linear;
}

.topBar{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:45px;
  background:linear-gradient(to bottom,rgba(0,0,0,.75),transparent);
  z-index:4;
}

.bottomBar{
  position:absolute;
  bottom:0;
  left:0;
  width:100%;
  height:75px;
  background:linear-gradient(to top,rgba(0,0,0,.8),transparent);
  z-index:4;
}

.sceneNumber{
  position:absolute;
  top:10px;
  left:12px;
  z-index:6;
  font-size:13px;
  color:#ddd;
}

.subtitle{
  position:absolute;
  bottom:17px;
  left:5%;
  width:90%;
  text-align:center;
  z-index:8;
  pointer-events:none;
}

.subtitle span{
  display:inline-block;
  background:rgba(0,0,0,.75);
  padding:7px 12px;
  border-radius:5px;
  color:white;
  font-size:20px;
  line-height:1.35;
  text-shadow:0 1px 2px #000;
}

.controls{
  text-align:center;
  margin-top:12px;
}

.progressBox{
  margin-top:12px;
}

.progress{
  width:100%;
  height:8px;
  background:#1e293b;
  border-radius:10px;
  overflow:hidden;
}

.progressFill{
  height:100%;
  width:0%;
  background:#38bdf8;
}

.status{
  background:#020617;
  border:1px solid #1e293b;
  color:#94a3b8;
  padding:10px;
  border-radius:7px;
  margin-top:10px;
  font-size:12px;
  min-height:38px;
}

.small{
  font-size:12px;
  color:#64748b;
}

hr{
  border:0;
  border-top:1px solid #263244;
  margin:15px 0;
}

.musicControls{
  display:grid;
  grid-template-columns:1fr 180px;
  gap:10px;
  align-items:end;
}

@media(max-width:650px){
  .musicControls{
    grid-template-columns:1fr;
  }

  .subtitle span{
    font-size:14px;
  }
}
</style>
</head>

<body>

<header>
  <h1>🎬 Mina Film Studio V3.3</h1>
  <p>Görüntü + Gerçek Ses Dosyaları + Müzik + Altyazı + Hareket</p>
</header>

<div class="container">

<!-- PROJE -->
<div class="panel">

  <h2>🎞️ Film Projesi</h2>

  <label>Film Adı</label>
  <input id="filmName" value="Das Haus am Waldrand">

  <label>Hikâye</label>
  <textarea id="story">23:47 Uhr. Anna kommt an einem verlassenen Haus am Waldrand an. Im oberen Fenster geht plötzlich ein Licht an. Sie hört Schritte im Haus. Die Tür öffnet sich von selbst. Im dunklen Flur erscheint ein Schatten.</textarea>

  <div style="margin-top:10px;">
    <button onclick="createScenes()" class="green">🎬 Hikâyeyi Sahnelere Böl</button>
    <button onclick="saveProject()" class="gray">💾 Projeyi Kaydet</button>
    <button onclick="loadProject()" class="gray">📂 Projeyi Yükle</button>
    <button onclick="resetProject()" class="red">♻️ Sıfırla</button>
  </div>

</div>


<!-- MÜZİK -->
<div class="panel">

  <h2>🎵 Arka Plan Müziği</h2>

  <div class="musicControls">

    <div>
      <label>Müzik Dosyası</label>
      <input
        type="file"
        id="musicFile"
        accept="audio/*"
        onchange="loadMusic(this)"
      >
    </div>

    <div>
      <label>Müzik Sesi</label>
      <input
        type="range"
        id="musicVolume"
        min="0"
        max="1"
        step="0.05"
        value="0.25"
        oninput="updateMusicVolume()"
      >
    </div>

  </div>

  <div id="musicStatus" class="audioStatus">
    Henüz arka plan müziği yüklenmedi.
  </div>

  <audio id="musicAudio" loop></audio>

</div>


<!-- SAHNELER -->
<div class="panel">

  <h2>🎭 Sahne Yönetimi</h2>

  <div id="sceneList" class="grid"></div>

</div>


<!-- FİLM OYNATICI -->
<div class="panel">

  <h2>🎥 Film Önizleme</h2>

  <div class="viewerWrap">

    <div class="viewer">

      <div class="topBar"></div>
      <div class="bottomBar"></div>

      <div id="sceneNumber" class="sceneNumber">
        Sahne 1 / 6
      </div>

      <img id="filmImage" src="">

      <div class="subtitle">
        <span id="subtitleText"></span>
      </div>

    </div>

    <div class="progressBox">
      <div class="progress">
        <div id="progressFill" class="progressFill"></div>
      </div>
    </div>

    <div class="controls">

      <button onclick="previousScene()" class="gray">
        ⏮ Önceki
      </button>

      <button onclick="restartFilm()" class="orange">
        🔄 Baştan
      </button>

      <button onclick="toggleFilm()" class="green">
        ▶ / ⏸ Oynat
      </button>

      <button onclick="nextScene()" class="gray">
        ⏭ Sonraki
      </button>

      <button onclick="stopAllAudio()" class="red">
        🔇 Sesleri Durdur
      </button>

    </div>

    <div id="status" class="status">
      Hazır.
    </div>

  </div>

</div>

</div>


<script>

let scenes = [
  {
    title:"Anna arrives at the house",
    narration:"Um 23 Uhr 47 kommt Anna an einem verlassenen Haus am Waldrand an.",
    prompt:"Cinematic dark mystery scene, abandoned house near a forest, realistic, atmospheric, dramatic lighting, 16:9",
    image:"",
    motion:"zoomIn",
    duration:5,
    audio:""
  },
  {
    title:"The light in the window",
    narration:"Plötzlich geht im oberen Fenster ein Licht an.",
    prompt:"Abandoned house at night, one mysterious glowing window, cinematic horror atmosphere, realistic, 16:9",
    image:"",
    motion:"zoomOut",
    duration:5,
    audio:""
  },
  {
    title:"Steps in the house",
    narration:"Dann hört Anna Schritte im Inneren des Hauses.",
    prompt:"Dark abandoned house interior, mysterious footsteps, cinematic thriller atmosphere, realistic, 16:9",
    image:"",
    motion:"panLeft",
    duration:5,
    audio:""
  },
  {
    title:"The door opens",
    narration:"Die alte Tür öffnet sich langsam von selbst.",
    prompt:"Old wooden door opening by itself at midnight, dark horror mystery, cinematic realistic lighting, 16:9",
    image:"",
    motion:"panRight",
    duration:5,
    audio:""
  },
  {
    title:"The dark corridor",
    narration:"Anna betritt den dunklen Flur.",
    prompt:"Long dark corridor inside abandoned house, woman standing at entrance, cinematic mystery, realistic, 16:9",
    image:"",
    motion:"float",
    duration:5,
    audio:""
  },
  {
    title:"The shadow",
    narration:"Am Ende des Flurs erscheint ein seltsamer Schatten.",
    prompt:"Mysterious human shadow at end of dark corridor, cinematic horror mystery, realistic, dramatic lighting, 16:9",
    image:"",
    motion:"zoomIn",
    duration:5,
    audio:""
  }
];

let currentScene = 0;
let playing = false;
let timer = null;
let startTime = 0;
let musicLoaded = false;

const filmImage = document.getElementById("filmImage");
const subtitleText = document.getElementById("subtitleText");
const sceneNumber = document.getElementById("sceneNumber");
const progressFill = document.getElementById("progressFill");
const statusBox = document.getElementById("status");

const musicAudio = document.getElementById("musicAudio");


// --------------------------------------------------
// DURUM
// --------------------------------------------------

function status(text){
  statusBox.innerText = text;
}


// --------------------------------------------------
// SAHNELERİ OLUŞTUR
// --------------------------------------------------

function createScenes(){

  renderScenes();

  currentScene = 0;

  showScene(0);

  status("6 sahne hazırlandı.");

}


// --------------------------------------------------
// SAHNELERİ RENDER
// --------------------------------------------------

function renderScenes(){

  const list = document.getElementById("sceneList");

  list.innerHTML = "";

  scenes.forEach((scene,index)=>{

    const div = document.createElement("div");

    div.className = "scene";

    div.innerHTML = `

      <h3>Sahne ${index+1}</h3>

      <label>Başlık</label>

      <input
        id="title_${index}"
        value="${escapeHtml(scene.title)}"
      >

      <label>Görsel</label>

      <input
        type="file"
        accept="image/*"
        onchange="loadImage(${index},this)"
      >

      <div class="sceneImage" id="preview_${index}">

        ${
          scene.image
          ?
          `<img src="${scene.image}">`
          :
          `<div class="placeholder">Görsel yüklenmedi</div>`
        }

      </div>

      <label>Hareket</label>

      <select id="motion_${index}">

        <option value="zoomIn" ${scene.motion==="zoomIn"?"selected":""}>
          🔍 Yavaş Yaklaş
        </option>

        <option value="zoomOut" ${scene.motion==="zoomOut"?"selected":""}>
          🔎 Yavaş Uzaklaş
        </option>

        <option value="panLeft" ${scene.motion==="panLeft"?"selected":""}>
          ◀ Sola Kaydır
        </option>

        <option value="panRight" ${scene.motion==="panRight"?"selected":""}>
          ▶ Sağa Kaydır
        </option>

        <option value="float" ${scene.motion==="float"?"selected":""}>
          🌊 Hafif Hareket
        </option>

        <option value="static" ${scene.motion==="static"?"selected":""}>
          ⏹ Sabit
        </option>

      </select>

      <label>Süre</label>

      <select id="duration_${index}">

        <option value="5" ${scene.duration==5?"selected":""}>5 saniye</option>
        <option value="8" ${scene.duration==8?"selected":""}>8 saniye</option>
        <option value="10" ${scene.duration==10?"selected":""}>10 saniye</option>
        <option value="15" ${scene.duration==15?"selected":""}>15 saniye</option>
        <option value="20" ${scene.duration==20?"selected":""}>20 saniye</option>

      </select>


      <label>🎙️ Sahne Gerçek Ses Dosyası</label>

      <input
        type="file"
        accept="audio/*"
        onchange="loadSceneAudio(${index},this)"
      >

      <div class="audioBox">

        ${
          scene.audio
          ?
          `
          <div class="audioStatus">
            🎵 Ses yüklendi.
          </div>
          `
          :
          `
          <div class="audioStatus">
            Bu sahneye MP3 / WAV / OGG yükleyebilirsin.
          </div>
          `
        }

        ${
          scene.audio
          ?
          `
          <audio
            controls
            src="${scene.audio}">
          </audio>
          `
          :
          ""
        }

      </div>


      <label>Almanca Altyazı / Konuşma Metni</label>

      <textarea
        id="narration_${index}"
      >${escapeHtml(scene.narration)}</textarea>


      <label>AI Görsel Promptu</label>

      <textarea
        id="prompt_${index}"
      >${escapeHtml(scene.prompt)}</textarea>

    `;

    list.appendChild(div);

  });

}


// --------------------------------------------------
// HTML ESCAPE
// --------------------------------------------------

function escapeHtml(text){

  return String(text || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");

}


// --------------------------------------------------
// GÖRSEL YÜKLE
// --------------------------------------------------

function loadImage(index,input){

  if(!input.files || !input.files[0]){
    return;
  }

  const file = input.files[0];

  const reader = new FileReader();

  reader.onload = function(e){

    scenes[index].image = e.target.result;

    renderScenes();

    status("Sahne " + (index+1) + " görseli yüklendi.");

  };

  reader.readAsDataURL(file);

}


// --------------------------------------------------
// SAHNE SESİ YÜKLE
// --------------------------------------------------

function loadSceneAudio(index,input){

  if(!input.files || !input.files[0]){
    return;
  }

  const file = input.files[0];

  /*
    Ses dosyasını DataURL olarak bellekte tutuyoruz.
    Böylece V3.3 içinde hemen oynatılabilir.
  */

  const reader = new FileReader();

  reader.onload = function(e){

    scenes[index].audio = e.target.result;

    renderScenes();

    status(
      "🎙️ Sahne " +
      (index+1) +
      " ses dosyası yüklendi."
    );

  };

  reader.readAsDataURL(file);

}


// --------------------------------------------------
// MÜZİK YÜKLE
// --------------------------------------------------

function loadMusic(input){

  if(!input.files || !input.files[0]){
    return;
  }

  const file = input.files[0];

  const url = URL.createObjectURL(file);

  musicAudio.src = url;

  musicAudio.volume =
    parseFloat(
      document.getElementById("musicVolume").value
    );

  musicLoaded = true;

  document.getElementById("musicStatus").innerText =
    "🎵 Müzik yüklendi: " + file.name;

  status("Arka plan müziği hazır.");

}


// --------------------------------------------------
// MÜZİK SESİ
// --------------------------------------------------

function updateMusicVolume(){

  musicAudio.volume =
    parseFloat(
      document.getElementById("musicVolume").value
    );

}


// --------------------------------------------------
// SAHNE GÖSTER
// --------------------------------------------------

function showScene(index){

  if(index < 0){
    index = 0;
  }

  if(index >= scenes.length){
    index = scenes.length - 1;
  }

  currentScene = index;

  const scene = scenes[index];

  sceneNumber.innerText =
    "Sahne " +
    (index+1) +
    " / " +
    scenes.length;


  subtitleText.innerText =
    scene.narration || "";


  if(scene.image){

    filmImage.src = scene.image;

  }else{

    filmImage.removeAttribute("src");

  }


  filmImage.style.transition =
    "none";


  filmImage.style.transform =
    getTransform(scene.motion,0);


  setTimeout(function(){

    filmImage.style.transition =
      "transform .1s linear";

  },30);


  updateProgress(0);

}


// --------------------------------------------------
// HAREKET
// --------------------------------------------------

function getTransform(motion,progress){

  progress =
    Math.max(
      0,
      Math.min(
        1,
        progress
      )
    );


  if(motion === "zoomIn"){

    const scale =
      1 + progress * 0.12;

    return "scale("+scale+")";

  }


  if(motion === "zoomOut"){

    const scale =
      1.12 - progress * 0.12;

    return "scale("+scale+")";

  }


  if(motion === "panLeft"){

    const x =
      -progress * 5;

    return "translateX("+x+"%) scale(1.05)";

  }


  if(motion === "panRight"){

    const x =
      progress * 5;

    return "translateX("+x+"%) scale(1.05)";

  }


  if(motion === "float"){

    const y =
      Math.sin(progress * Math.PI * 2) * 1.2;

    const scale =
      1.03 + Math.sin(progress * Math.PI) * 0.015;

    return (
      "translateY("+y+"%) scale("+scale+")"
    );

  }


  return "scale(1)";

}


// --------------------------------------------------
// SAHNE SESİNİ ÇAL
// --------------------------------------------------

function playSceneAudio(index){

  stopSceneAudio();

  const scene = scenes[index];

  if(!scene.audio){

    status(
      "Sahne " +
      (index+1) +
      " için ses dosyası yok."
    );

    return;

  }

  const audio =
    new Audio(scene.audio);

  audio.volume = 1;

  audio.id = "activeSceneAudio";

  document.body.appendChild(audio);

  audio.play().catch(function(){

    status(
      "Ses otomatik başlatılamadı. Oynat düğmesine bas."
    );

  });

}


// --------------------------------------------------
// AKTİF SAHNE SESİNİ DURDUR
// --------------------------------------------------

function stopSceneAudio(){

  const old =
    document.getElementById("activeSceneAudio");

  if(old){

    old.pause();

    old.currentTime = 0;

    old.remove();

  }

}


// --------------------------------------------------
// TÜM SESLERİ DURDUR
// --------------------------------------------------

function stopAllAudio(){

  stopSceneAudio();

  musicAudio.pause();

  status("🔇 Tüm sesler durduruldu.");

}


// --------------------------------------------------
// FİLM BAŞLAT
// --------------------------------------------------

function startFilm(){

  if(playing){
    return;
  }

  playing = true;

  startTime = Date.now();

  playSceneAudio(currentScene);

  if(musicLoaded){

    musicAudio.play().catch(function(){});

  }

  status(
    "▶ Film oynuyor — Sahne " +
    (currentScene+1)
  );

  timer =
    setInterval(updateFilm,50);

}


// --------------------------------------------------
// FİLM GÜNCELLE
// --------------------------------------------------

function updateFilm(){

  const scene =
    scenes[currentScene];

  const duration =
    Number(scene.duration) * 1000;

  const elapsed =
    Date.now() - startTime;

  let progress =
    elapsed / duration;


  if(progress >= 1){

    updateProgress(1);

    nextSceneAuto();

    return;

  }


  updateProgress(progress);


  filmImage.style.transform =
    getTransform(
      scene.motion,
      progress
    );

}


// --------------------------------------------------
// PROGRESS
// --------------------------------------------------

function updateProgress(value){

  progressFill.style.width =
    (value * 100) + "%";

}


// --------------------------------------------------
// OTOMATİK SONRAKİ SAHNE
// --------------------------------------------------

function nextSceneAuto(){

  if(currentScene >= scenes.length-1){

    finishFilm();

    return;

  }

  currentScene++;

  showScene(currentScene);

  startTime = Date.now();

  playSceneAudio(currentScene);

}


// --------------------------------------------------
// FİLMİ BİTİR
// --------------------------------------------------

function finishFilm(){

  playing = false;

  clearInterval(timer);

  timer = null;

  stopSceneAudio();

  musicAudio.pause();

  updateProgress(1);

  status("🎬 Film tamamlandı.");

}


// --------------------------------------------------
// OYNAT / DURAKLAT
// --------------------------------------------------

function toggleFilm(){

  if(playing){

    pauseFilm();

  }else{

    startFilm();

  }

}


// --------------------------------------------------
// DURAKLAT
// --------------------------------------------------

function pauseFilm(){

  playing = false;

  clearInterval(timer);

  timer = null;

  stopSceneAudio();

  musicAudio.pause();

  status("⏸ Film duraklatıldı.");

}


// --------------------------------------------------
// BAŞTAN
// --------------------------------------------------

function restartFilm(){

  playing = false;

  clearInterval(timer);

  timer = null;

  stopSceneAudio();

  musicAudio.pause();

  currentScene = 0;

  showScene(0);

  status("🔄 Film baştan hazırlandı.");

}


// --------------------------------------------------
// SONRAKİ
// --------------------------------------------------

function nextScene(){

  const wasPlaying =
    playing;

  clearInterval(timer);

  timer = null;

  stopSceneAudio();

  currentScene++;

  if(currentScene >= scenes.length){

    currentScene =
      scenes.length - 1;

  }

  showScene(currentScene);

  if(wasPlaying){

    startTime = Date.now();

    playSceneAudio(currentScene);

    timer =
      setInterval(updateFilm,50);

  }

}


// --------------------------------------------------
// ÖNCEKİ
// --------------------------------------------------

function previousScene(){

  const wasPlaying =
    playing;

  clearInterval(timer);

  timer = null;

  stopSceneAudio();

  currentScene--;

  if(currentScene < 0){

    currentScene = 0;

  }

  showScene(currentScene);

  if(wasPlaying){

    startTime = Date.now();

    playSceneAudio(currentScene);

    timer =
      setInterval(updateFilm,50);

  }

}


// --------------------------------------------------
// PROJE KAYDET
// --------------------------------------------------

function collectSceneData(){

  scenes.forEach(function(scene,index){

    const title =
      document.getElementById("title_"+index);

    const motion =
      document.getElementById("motion_"+index);

    const duration =
      document.getElementById("duration_"+index);

    const narration =
      document.getElementById("narration_"+index);

    const prompt =
      document.getElementById("prompt_"+index);


    if(title){
      scene.title =
        title.value;
    }

    if(motion){
      scene.motion =
        motion.value;
    }

    if(duration){
      scene.duration =
        Number(duration.value);
    }

    if(narration){
      scene.narration =
        narration.value;
    }

    if(prompt){
      scene.prompt =
        prompt.value;
    }

  });

}


// --------------------------------------------------
// KAYDET
// --------------------------------------------------

function saveProject(){

  collectSceneData();

  const project = {

    filmName:
      document.getElementById("filmName").value,

    story:
      document.getElementById("story").value,

    scenes: scenes

  };


  try{

    localStorage.setItem(
      "minaFilmStudioV33",
      JSON.stringify(project)
    );

    status(
      "💾 Proje kaydedildi."
    );

  }catch(error){

    status(
      "⚠️ Kaydetme sınırı aşıldı. Özellikle büyük ses/görsel dosyaları tarayıcı depolamasını doldurabilir."
    );

  }

}


// --------------------------------------------------
// YÜKLE
// --------------------------------------------------

function loadProject(){

  try{

    const raw =
      localStorage.getItem(
        "minaFilmStudioV33"
      );

    if(!raw){

      status(
        "Kayıtlı proje bulunamadı."
      );

      return;

    }

    const project =
      JSON.parse(raw);


    document.getElementById("filmName").value =
      project.filmName || "";


    document.getElementById("story").value =
      project.story || "";


    scenes =
      project.scenes || scenes;


    renderScenes();

    currentScene = 0;

    showScene(0);

    status(
      "📂 Proje yüklendi."
    );


  }catch(error){

    status(
      "⚠️ Proje yüklenirken hata oluştu."
    );

  }

}


// --------------------------------------------------
// SIFIRLA
// --------------------------------------------------

function resetProject(){

  if(!confirm(
    "Projeyi sıfırlamak istediğine emin misin?"
  )){

    return;

  }

  localStorage.removeItem(
    "minaFilmStudioV33"
  );

  location.reload();

}


// --------------------------------------------------
// BAŞLANGIÇ
// --------------------------------------------------

renderScenes();

showScene(0);

status(
  "Mina Film Studio V3.3 hazır. Önce sahnelere görsel ve gerçek ses dosyaları ekleyebilirsin."
);

</script>
