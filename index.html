<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>101 Okey Deluxe</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#03170d;
}

body{
    color:white;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:
    radial-gradient(
        ellipse at center,
        #159052 0%,
        #08723c 42%,
        #064c2b 72%,
        #021b10 100%
    );
}

/* =========================
   ÜST BAR
========================= */

.header{
    position:absolute;
    top:6px;
    left:50%;
    transform:translateX(-50%);
    width:94%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    z-index:100;
}

.logo{
    font-size:19px;
    font-weight:900;
    text-shadow:0 2px 4px #000;
}

.info{
    background:#06140eea;
    border:1px solid #ffffff22;
    border-radius:16px;
    padding:7px 11px;
    font-size:11px;
}

/* =========================
   MASA
========================= */

.table{
    position:absolute;
    width:min(96vw,1100px);
    height:min(77vh,700px);

    left:50%;
    top:48%;

    transform:translate(-50%,-50%);

    border-radius:46%;

    background:
    radial-gradient(
        ellipse at center,
        #169352,
        #08713c 70%,
        #07572f
    );

    border:18px solid #4b2a17;

    box-shadow:
        inset 0 0 55px #002d18,
        inset 0 0 12px #000,
        0 20px 45px #000;
}

/* =========================
   OYUNCULAR
========================= */

.player{
    position:absolute;
    z-index:20;
    text-align:center;
}

.name{
    display:inline-block;
    background:#06140fec;
    border:1px solid #ffffff25;
    padding:5px 10px;
    border-radius:18px;
    font-size:12px;
    margin-bottom:3px;
}

.top{
    top:2px;
    left:50%;
    transform:translateX(-50%);
}

.left{
    left:1px;
    top:47%;
    transform:translateY(-50%);
}

.right{
    right:1px;
    top:47%;
    transform:translateY(-50%);
}

.bottom{
    left:50%;
    bottom:1px;
    transform:translateX(-50%);
}

/* =========================
   RAKİP TAKOZLARI
========================= */

.opponentRack{
    padding:5px 9px;
    border-radius:8px;

    background:
    linear-gradient(
        180deg,
        #a96834,
        #74401f 50%,
        #482411
    );

    border:2px solid #32180b;

    box-shadow:
        inset 0 4px 5px #d8955c66,
        inset 0 -4px 6px #1e0b04,
        0 5px 10px #000b;

    display:flex;
    justify-content:center;
}

.sideRack{
    min-height:185px;
    align-items:center;
}

/* =========================
   İKİ KATLI ANA TAKOZ
========================= */

.doubleRack{
    position:relative;

    width:min(94vw,900px);

    height:126px;

    padding:9px 10px 12px;

    border-radius:
        8px
        8px
        15px
        15px;

    background:
    linear-gradient(
        180deg,
        #ad6b36 0%,
        #82491f 42%,
        #633419 70%,
        #452310 100%
    );

    border:3px solid #30170a;

    box-shadow:
        inset 0 5px 6px #d9965b77,
        inset 0 -7px 8px #1c0a04,
        0 8px 14px #000c;
}

/* ÜST YUVA */

.rackRow{
    position:absolute;

    left:7px;
    right:7px;

    height:46px;

    display:flex;
    align-items:flex-end;

    padding:4px;

    border-radius:5px;

    background:
    linear-gradient(
        180deg,
        #351b0d,
        #190b05
    );

    box-shadow:
    inset 0 4px 6px #000,
    inset 0 -1px 0 #c1793f55;
}

.rackTop{
    top:8px;
}

.rackBottom{
    bottom:8px;
}

/* ORTA AHŞAP AYRAÇ */

.doubleRack:after{
    content:"";

    position:absolute;

    left:5px;
    right:5px;

    top:59px;

    height:8px;

    border-radius:4px;

    background:
    linear-gradient(
        180deg,
        #c17a42,
        #70401e,
        #3a1c0c
    );

    box-shadow:
    0 2px 3px #000;
}

/* =========================
   TAŞ ELİ
========================= */

.hand{
    width:100%;

    display:flex;

    align-items:flex-end;

    justify-content:flex-start;

    gap:2px;

    overflow-x:auto;
    overflow-y:hidden;

    scrollbar-width:none;
}

.hand::-webkit-scrollbar{
    display:none;
}

.tile{
    flex:0 0 auto;

    width:39px;
    height:54px;

    border-radius:6px;

    background:
    linear-gradient(
        145deg,
        #ffffff,
        #d8d8d8
    );

    border:1px solid #999;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:24px;
    font-weight:bold;

    box-shadow:
        0 3px 5px #0009,
        inset 0 1px 1px #fff;

    cursor:pointer;

    user-select:none;

    transition:
        transform .13s,
        box-shadow .13s;
}

.tile.selected{
    transform:translateY(-14px);

    border:2px solid #ffd42f;

    box-shadow:
        0 9px 13px #000,
        0 0 8px #ffd42f;
}

.red{
    color:#d71919;
}

.blue{
    color:#075dc7;
}

.black{
    color:#111;
}

.yellow{
    color:#c99100;
}

.joker{
    color:#d71919;
    font-size:27px;
}

/* =========================
   RAKİP TAŞLARI
========================= */

.backTile{
    flex:0 0 auto;

    width:24px;
    height:34px;

    border-radius:4px;

    background:
    repeating-linear-gradient(
        45deg,
        #175d46,
        #175d46 5px,
        #082f23 5px,
        #082f23 10px
    );

    border:1px solid #78bda3;

    display:flex;
    justify-content:center;
    align-items:center;

    color:white;

    font-size:11px;

    box-shadow:0 2px 3px #0009;
}

/* =========================
   ORTA
========================= */

.center{
    position:absolute;

    left:50%;
    top:44%;

    transform:translate(-50%,-50%);

    text-align:center;

    z-index:10;
}

.turn{
    background:#06140ee8;

    border:1px solid #ffffff22;

    padding:7px 14px;

    border-radius:20px;

    font-size:13px;

    margin-bottom:10px;

    white-space:nowrap;
}

.piles{
    display:flex;
    justify-content:center;
    gap:16px;
}

.pileBox{
    font-size:10px;
}

.pile{
    width:52px;
    height:69px;

    border-radius:7px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-weight:bold;

    box-shadow:0 5px 9px #0009;
}

.deck{
    color:white;

    border:2px solid #85cdb0;

    background:
    repeating-linear-gradient(
        45deg,
        #155b45,
        #155b45 5px,
        #082f23 5px,
        #082f23 10px
    );
}

.discard{
    background:white;
    font-size:25px;
}

/* =========================
   AÇILANLAR
========================= */

.meldArea{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    margin-top:100px;

    width:360px;

    display:flex;

    flex-wrap:wrap;

    justify-content:center;

    gap:5px;

    z-index:9;
}

.meld{
    display:flex;

    gap:2px;

    padding:4px;

    border-radius:6px;

    background:#0004;
}

.meld .tile{
    width:27px;
    height:38px;
    font-size:15px;
    cursor:default;
}

/* =========================
   MESAJ
========================= */

.message{
    position:absolute;

    top:74%;

    left:50%;

    transform:translateX(-50%);

    background:#000d;

    padding:8px 15px;

    border-radius:20px;

    font-size:12px;

    z-index:120;

    white-space:nowrap;
}

/* =========================
   BUTONLAR
========================= */

.controls{
    position:absolute;

    bottom:4px;
    left:50%;

    transform:translateX(-50%);

    width:98%;

    display:flex;

    justify-content:center;

    gap:5px;

    z-index:130;
}

button{
    border:0;

    border-radius:11px;

    padding:10px 11px;

    background:#f0b92d;

    color:#211504;

    font-weight:bold;

    box-shadow:0 3px 7px #0009;

    cursor:pointer;
}

button:active{
    transform:scale(.95);
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;

    inset:0;

    background:#000b;

    display:none;

    justify-content:center;

    align-items:center;

    z-index:300;
}

.modal.show{
    display:flex;
}

.modalBox{
    width:min(90%,390px);

    background:#10251b;

    border:2px solid #528e70;

    border-radius:18px;

    padding:20px;

    text-align:center;

    box-shadow:0 15px 40px #000;
}

.modalBox h2{
    margin-top:0;
}

.modalBox button{
    margin-top:10px;
}

/* =========================
   MOBİL
========================= */

@media(max-width:600px){

    .table{
        width:98vw;
        height:69vh;
        border-width:10px;
    }

    .logo{
        font-size:14px;
    }

    .info{
        font-size:9px;
        padding:6px 8px;
    }

    /* İKİ KATLI TAKOZ */

    .doubleRack{
        width:95vw;
        height:105px;
        padding:6px 6px 8px;
    }

    .rackRow{
        left:5px;
        right:5px;
        height:37px;
        padding:3px;
    }

    .rackTop{
        top:6px;
    }

    .rackBottom{
        bottom:6px;
    }

    .doubleRack:after{
        top:49px;
        height:7px;
    }

    .tile{
        width:27px;
        height:39px;
        font-size:17px;
    }

    .joker{
        font-size:21px;
    }

    .opponentRack{
        padding:4px 5px;
    }

    .backTile{
        width:18px;
        height:26px;
        font-size:8px;
    }

    .sideRack{
        min-height:145px;
    }

    .center{
        top:42%;
    }

    .pile{
        width:42px;
        height:57px;
    }

    .meldArea{
        width:270px;
        margin-top:70px;
    }

    .meld .tile{
        width:21px;
        height:30px;
        font-size:12px;
    }

    .message{
        top:69%;
        font-size:10px;
    }

    .controls{
        bottom:2px;
        gap:3px;
    }

    button{
        padding:8px 6px;
        font-size:10px;
    }
}
</style>
</head>

<body>

<div id="game">

<!-- =========================
     HEADER
========================= -->

<div class="header">

    <div class="logo">
        🎴 101 OKEY
    </div>

    <div class="info">
        Puan:
        <b id="score">0</b>
        &nbsp; | &nbsp;
        Kalan:
        <b id="remaining">0</b>
    </div>

</div>

<!-- =========================
     MASA
========================= -->

<div class="table">

    <!-- ALİ -->

    <div class="player top">

        <div class="name">
            🤖 Ali
        </div>

        <div class="opponentRack">

            <div class="hand"
                 id="ali">
            </div>

        </div>

    </div>

    <!-- MEHMET -->

    <div class="player left">

        <div class="name">
            🤖 Mehmet
        </div>

        <div class="opponentRack sideRack">

            <div class="hand"
                 id="mehmet"
                 style="flex-direction:column">
            </div>

        </div>

    </div>

    <!-- AHMET -->

    <div class="player right">

        <div class="name">
            🤖 Ahmet
        </div>

        <div class="opponentRack sideRack">

            <div class="hand"
                 id="ahmet"
                 style="flex-direction:column">
            </div>

        </div>

    </div>

    <!-- ORTA -->

    <div class="center">

        <div class="turn"
             id="turn">
            🟢 Senin sıran
        </div>

        <div class="piles">

            <div class="pileBox">

                <div class="pile deck"
                     id="deck">
                    0
                </div>

                <span>Deste</span>

            </div>

            <div class="pileBox">

                <div class="pile discard"
                     id="discard">
                    -
                </div>

                <span>Atılan</span>

            </div>

        </div>

    </div>

    <!-- AÇILANLAR -->

    <div class="meldArea"
         id="meldArea">
    </div>

    <!-- =====================
         SENİN İKİ KATLI TAKOZUN
    ====================== -->

    <div class="player bottom">

        <div class="doubleRack">

            <!-- ÜST SIRA -->

            <div class="rackRow rackTop">

                <div class="hand"
                     id="handTop">
                </div>

            </div>

            <!-- ALT SIRA -->

            <div class="rackRow rackBottom">

                <div class="hand"
                     id="handBottom">
                </div>

            </div>

        </div>

        <div class="name">
            👤 Zafer
        </div>

    </div>

</div>

<!-- MESAJ -->

<div class="message"
     id="message">
    Oyun hazırlanıyor...
</div>

<!-- BUTONLAR -->

<div class="controls">

    <button onclick="drawTile()">
        🎴 Çek
    </button>

    <button onclick="discardTile()">
        🗑️ At
    </button>

    <button onclick="openMeld()">
        🧩 Per
    </button>

    <button onclick="openPair()">
        👥 Çift
    </button>

    <button onclick="sortHand()">
        🔢 Sırala
    </button>

    <button onclick="newGame()">
        🔄 Yeni
    </button>

</div>

</div>

<!-- MODAL -->

<div class="modal"
     id="modal">

    <div class="modalBox">

        <h2 id="modalTitle">
            101 Okey
        </h2>

        <p id="modalText"></p>

        <button onclick="closeModal()">
            Tamam
        </button>

    </div>

</div>

<script>

/* ======================================
   OYUN DEĞİŞKENLERİ
====================================== */

const COLORS=[
    "red",
    "blue",
    "black",
    "yellow"
];

let deck=[];
let hand=[];
let discard=[];
let openedMelds=[];

let selected=[];

let score=0;

let turn="me";

let finished=false;

let opened=false;

let indicator=null;

let jokerNumber=null;

/* ======================================
   DESTE
====================================== */

function createDeck(){

    deck=[];

    for(const color of COLORS){

        for(let n=1;n<=13;n++){

            deck.push({
                color:color,
                number:n,
                fake:false
            });

            deck.push({
                color:color,
                number:n,
                fake:false
            });
        }
    }

    deck.push({
        color:"black",
        number:0,
        fake:true
    });

    deck.push({
        color:"black",
        number:0,
        fake:true
    });

    shuffle(deck);

    indicator=deck.pop();

    if(indicator.fake){
        indicator=deck.pop();
    }

    jokerNumber=
        indicator.number===13
        ?1
        :indicator.number+1;
}

/* ======================================
   KARIŞTIR
====================================== */

function shuffle(array){

    for(
        let i=array.length-1;
        i>0;
        i--
    ){

        const j=
            Math.floor(
                Math.random()*(i+1)
            );

        [
            array[i],
            array[j]
        ]=[
            array[j],
            array[i]
        ];
    }
}

/* ======================================
   YENİ OYUN
====================================== */

function newGame(){

    createDeck();

    hand=[];

    for(let i=0;i<14;i++){

        hand.push(
            deck.pop()
        );
    }

    discard=[];

    openedMelds=[];

    selected=[];

    score=0;

    turn="me";

    finished=false;

    opened=false;

    sortHand();

    render();

    message(
        "Gösterge: "+
        tileName(indicator)+
        " | Okey: "+
        jokerNumber
    );
}

/* ======================================
   TAŞ ADI
====================================== */

function tileName(tile){

    if(!tile){
        return "-";
    }

    if(tile.fake){
        return "SAHTE OKEY";
    }

    return (
        tile.number+
        " "+
        tile.color.toUpperCase()
    );
}

/* ======================================
   SIRALA
====================================== */

function sortHand(){

    hand.sort(
        (a,b)=>{

            if(a.fake)return 1;

            if(b.fake)return -1;

            if(a.color!==b.color){

                return COLORS.indexOf(a.color)
                    -
                    COLORS.indexOf(b.color);
            }

            return a.number-b.number;
        }
    );

    selected=[];

    render();
}

/* ======================================
   TAŞ HTML
====================================== */

function tileHTML(tile,index){

    if(tile.fake){

        return `
        <div
            class="tile joker ${
                selected.includes(index)
                ?"selected":""
            }"
            onclick="selectTile(${index})">
            ★
        </div>`;
    }

    const isJoker=
        tile.number===jokerNumber;

    return `
    <div
        class="tile ${tile.color} ${
            selected.includes(index)
            ?"selected":""
        }"
        onclick="selectTile(${index})">

        ${
            isJoker
            ?"★"
            :tile.number
        }

    </div>`;
}

/* ======================================
   EKRANI ÇİZ
====================================== */

function render(){

    const top=
        document.getElementById(
            "handTop"
        );

    const bottom=
        document.getElementById(
            "handBottom"
        );

    top.innerHTML="";
    bottom.innerHTML="";

    /*
      14 taşın ilk 7'si üst,
      kalan 7'si alt sıraya.
    */

    hand.forEach(
        (tile,index)=>{

            const html=
                tileHTML(
                    tile,
                    index
                );

            if(index<7){

                top.innerHTML+=html;

            }else{

                bottom.innerHTML+=html;
            }
        }
    );

    document.getElementById(
        "ali"
    ).innerHTML=
        hiddenTiles(14);

    document.getElementById(
        "mehmet"
    ).innerHTML=
        hiddenSide(14);

    document.getElementById(
        "ahmet"
    ).innerHTML=
        hiddenSide(14);

    document.getElementById(
        "score"
    ).innerText=score;

    document.getElementById(
        "remaining"
    ).innerText=deck.length;

    document.getElementById(
        "deck"
    ).innerText=deck.length;

    const d=
        document.getElementById(
            "discard"
        );

    if(discard.length){

        const t=
            discard[
                discard.length-1
            ];

        d.innerHTML=
            t.fake
            ?"★"
            :t.number;

    }else{

        d.innerHTML="-";
    }

    document.getElementById(
        "turn"
    ).innerText=
        turn==="me"
        ?"🟢 Senin sıran"
        :"🔴 Bilgisayar oynuyor";

    renderMelds();
}

/* ======================================
   RAKİP TAŞLARI
====================================== */

function hiddenTiles(count){

    let html="";

    for(
        let i=0;
        i<count;
        i++
    ){

        html+=`
        <div class="backTile">
            ◆
        </div>`;
    }

    return html;
}

function hiddenSide(count){

    let html="";

    for(
        let i=0;
        i<count;
        i++
    ){

        html+=`
        <div class="backTile">
            ◆
        </div>`;
    }

    return html;
}

/* ======================================
   TAŞ SEÇ
====================================== */

function selectTile(index){

    if(
        turn!=="me"||
        finished
    ){
        return;
    }

    if(
        selected.includes(index)
    ){

        selected=
            selected.filter(
                x=>x!==index
            );

    }else{

        selected.push(index);
    }

    render();

    message(
        selected.length+
        " taş seçildi."
    );
}

/* ======================================
   TAŞ ÇEK
====================================== */

function drawTile(){

    if(turn!=="me"){

        message(
            "Sıra sende değil."
        );

        return;
    }

    if(hand.length>=15){

        message(
            "Önce bir taş at."
        );

        return;
    }

    if(deck.length===0){

        finishGame();

        return;
    }

    hand.push(
        deck.pop()
    );

    selected=[];

    render();

    message(
        "Taş çektin. Bir taş at."
    );
}

/* ======================================
   TAŞ AT
====================================== */

function discardTile(){

    if(
        turn!=="me"||
        finished
    ){
        return;
    }

    if(selected.length!==1){

        message(
            "Atmak için 1 taş seç."
        );

        return;
    }

    if(hand.length!==15){

        message(
            "Önce taş çekmelisin."
        );

        return;
    }

    const index=
        selected[0];

    const tile=
        hand.splice(
            index,
            1
        )[0];

    discard.push(tile);

    selected=[];

    render();

    message(
        "Taş atıldı."
    );

    turn="cpu";

    render();

    setTimeout(
        computerTurn,
        850
    );
}

/* ======================================
   SERİ KONTROL
====================================== */

function isRun(tiles){

    if(tiles.length<3){
        return false;
    }

    const normal=
        tiles.filter(
            t=>!t.fake
        );

    const jokers=
        tiles.filter(
            t=>t.fake
        ).length;

    if(normal.length===0){
        return true;
    }

    const color=
        normal[0].color;

    if(
        !normal.every(
            t=>t.color===color
        )
    ){
        return false;
    }

    const nums=
        normal
        .map(
            t=>t.number
        )
        .sort(
            (a,b)=>a-b
        );

    let gaps=0;

    for(
        let i=1;
        i<nums.length;
        i++
    ){

        if(
            nums[i]===nums[i-1]
        ){
            return false;
        }

        gaps+=
            nums[i]-
            nums[i-1]-
            1;
    }

    return gaps<=jokers;
}

/* ======================================
   GRUP KONTROL
====================================== */

function isGroup(tiles){

    if(
        tiles.length<3||
        tiles.length>4
    ){
        return false;
    }

    const normal=
        tiles.filter(
            t=>!t.fake
        );

    if(normal.length===0){
        return true;
    }

    const number=
        normal[0].number;

    if(
        !normal.every(
            t=>t.number===number
        )
    ){
        return false;
    }

    const colors=
        new Set(
            normal.map(
                t=>t.color
            )
        );

    return colors.size===
        normal.length;
}

/* ======================================
   PER DEĞERİ
====================================== */

function meldValue(tiles){

    return tiles.reduce(
        (sum,t)=>{

            if(t.fake){

                return sum+jokerNumber;
            }

            return sum+t.number;

        },
        0
    );
}

/* ======================================
   PER AÇ
====================================== */

function openMeld(){

    if(turn!=="me"){
        return;
    }

    if(selected.length<3){

        showModal(
            "🧩 Per Aç",
            "En az 3 taş seç."
        );

        return;
    }

    const tiles=
        selected.map(
            i=>hand[i]
        );

    if(
        !isRun(tiles)&&
        !isGroup(tiles)
    ){

        showModal(
            "❌ Geçersiz Per",
            "Seçilen taşlar geçerli seri veya grup değil."
        );

        return;
    }

    const value=
        meldValue(tiles);

    if(
        !opened&&
        value<101
    ){

        showModal(
            "🔒 101 Açılışı",
            "İlk açılışta toplam değer en az 101 olmalı.\n\nSeçilen değer: "+
            value
        );

        return;
    }

    opened=true;

    score+=value;

    openedMelds.push(
        tiles.map(
            t=>({...t})
        )
    );

    const indexes=
        [...selected]
        .sort(
            (a,b)=>b-a
        );

    indexes.forEach(
        i=>{
            hand.splice(i,1);
        }
    );

    selected=[];

    render();

    showModal(
        "🎉 Per Açıldı",
        "Açılan per değeri: "+
        value
    );

    checkWin();
}

/* ======================================
   ÇİFT
====================================== */

function openPair(){

    if(turn!=="me"){
        return;
    }

    if(selected.length!==2){

        showModal(
            "👥 Çift",
            "İki taş seç."
        );

        return;
    }

    const a=
        hand[selected[0]];

    const b=
        hand[selected[1]];

    const same=
        !a.fake&&
        !b.fake&&
        a.number===b.number&&
        a.color===b.color;

    if(!same){

        showModal(
            "❌ Geçersiz Çift",
            "İki taş aynı renk ve aynı numara olmalı."
        );

        return;
    }

    opened=true;

    score+=10;

    openedMelds.push([
        {...a},
        {...b}
    ]);

    const indexes=
        [...selected]
        .sort(
            (a,b)=>b-a
        );

    indexes.forEach(
        i=>{
            hand.splice(i,1);
        }
    );

    selected=[];

    render();

    showModal(
        "👥 Çift Açıldı",
        "+10 puan"
    );

    checkWin();
}

/* ======================================
   AÇILANLAR
====================================== */

function renderMelds(){

    const area=
        document.getElementById(
            "meldArea"
        );

    area.innerHTML="";

    openedMelds.forEach(
        meld=>{

            const div=
                document.createElement(
                    "div"
                );

            div.className="meld";

            meld.forEach(
                tile=>{

                    const el=
                        document.createElement(
                            "div"
                        );

                    el.className=
                        "tile "+
                        (
                            tile.fake
                            ?"joker"
                            :tile.color
                        );

                    el.innerText=
                        tile.fake
                        ?"★"
                        :
                        (
                            tile.number===
                            jokerNumber
                            ?"★"
                            :tile.number
                        );

                    div.appendChild(el);
                }
            );

            area.appendChild(div);
        }
    );
}
