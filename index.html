/* =========================================================
   HİKAYEYİ SAHNELERE BÖL
========================================================= */

function splitStory(text,count){

  text =
    String(text || "")
      .replace(/\r/g," ")
      .replace(/\n+/g," ")
      .replace(/\s+/g," ")
      .trim();

  if(!text){

    return [];

  }

  var sentences =
    text.split(
      /(?<=[.!?])\s+/
    )
    .map(
      function(x){
        return x.trim();
      }
    )
    .filter(Boolean);

  if(!sentences.length){

    sentences =
      [text];

  }

  var result = [];

  for(
    var i=0;
    i<count;
    i++
  ){

    var start =
      Math.floor(
        i *
        sentences.length /
        count
      );

    var end =
      Math.floor(
        (i+1) *
        sentences.length /
        count
      );

    if(end <= start){

      end =
        Math.min(
          start+1,
          sentences.length
        );

    }

    var part =
      sentences
        .slice(
          start,
          end
        )
        .join(" ");

    if(!part){

      part =
        sentences[
          Math.min(
            i,
            sentences.length-1
          )
        ];

    }

    result.push(part);

  }

  return result;

}

function createScenes(){

  try{

    var story =
      storyEl.value.trim();

    if(!story){

      setStatus(
        "Önce hikayeyi yaz veya yapıştır."
      );

      return;

    }

    var count =
      parseInt(
        sceneCountEl.value,
        10
      );

    var parts =
      splitStory(
        story,
        count
      );

    scenes = [];

    scenesEl.innerHTML =
      "";

    for(
      var i=0;
      i<count;
      i++
    ){

      var text =
        parts[i] ||
        "";

      var scene = {

        index:i,

        text:text,

        prompt:
          createPrompt(
            text,
            i
          ),

        imageBlob:null,

        imageURL:"",

        imageObject:null,

        audioBlob:null,

        audioURL:"",

        audioDuration:0

      };

      scenes.push(
        scene
      );

      scenesEl.appendChild(
        createSceneCard(
          scene,
          i
        )
      );

    }

    setStatus(
      count +
      " sahne oluşturuldu.\n" +
      "Görsel promptları hazır.\n" +
      "Metinsiz görsel kuralları aktif."
    );

  }catch(error){

    console.error(error);

    setStatus(
      "❌ SAHNE OLUŞTURMA HATASI: " +
      error.message
    );

  }

}

async function generateImage(
  scene,
  index
){

  try{

    setStatus(
      "🎨 Sahne " +
      (index+1) +
      " görseli üretiliyor..."
    );

    var encodedPrompt =
      encodeURIComponent(
        scene.prompt
      );

    var seed =
      Math.floor(
        Math.random()*99999999
      );

    var url =
      "https://image.pollinations.ai/prompt/" +
      encodedPrompt +
      "?width=1280" +
      "&height=720" +
      "&nologo=true" +
      "&seed=" +
      seed;

    var response =
      await fetch(
        url
      );

    if(!response.ok){

      throw new Error(
        "Görsel sunucusu HTTP " +
        response.status
      );

    }

    var blob =
      await response.blob();

    if(!blob ||
       !blob.size){

      throw new Error(
        "Boş görsel döndü."
      );

    }

    var imageURL =
      URL.createObjectURL(
        blob
      );

    scene.imageBlob =
      blob;

    scene.imageURL =
      imageURL;

    /* ÖNCEDEN IMAGE OBJESİ OLUŞTUR */

    scene.imageObject =
      await loadImage(
        imageURL
      );

    var img =
      document.getElementById(
        "img-"+index
      );

    if(img){

      img.src =
        imageURL;

    }

    var badge =
      document.getElementById(
        "badge-"+index
      );

    if(badge){

      badge.textContent =
        "Görsel hazır";

    }

    setStatus(

async function prepareAudio(){

  try{

    speechSynthesis.cancel();

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getDisplayMedia
    ){

      throw new Error(
        "Chrome ses yakalamayı desteklemiyor."
      );

    }

    setStatus(
      "📺 Chrome ekran/ses paylaşımı açılıyor.\n\n" +

      "Sonra TÜMÜNÜ SESLENDİR + KAYDET'e bas."
    );

    captureStream =
      await navigator.mediaDevices.getDisplayMedia({
        video:true,
        audio:true
      });

    var tracks =
      captureStream.getAudioTracks();

    if(!tracks.length){

      captureStream
        .getTracks()
        .forEach(
          function(track){

            try{
              track.stop();
            }catch(e){}

          }
        );

      captureStream =
        null;

      throw new Error(
        "Ses yakalanamadı. Sekme sesini açmalısın."
      );

    }

    setStatus(
      "✅ SES YAKALAMAYA HAZIR.\n" +

      error.message
    );

}


/* =========================================================
   ARRAYBUFFER
========================================================= */

function blobToArrayBuffer(blob){

  return new Promise(
    function(resolve,reject){

      var reader =
        new FileReader();

      reader.onload =
        function(){

          resolve(
            reader.result
          );

        };

      reader.onerror =
        function(){

          reject(
            reader.error ||
            new Error(
              "Dosya okunamadı."
            )
          );

        };

      reader.readAsArrayBuffer(
        blob
      );

    }
  );

}


/* =========================================================
   SES SÜRESİ
========================================================= */

async function getAudioDuration(blob){

  var AC =
    window.AudioContext ||
    window.webkitAudioContext;

  if(!AC){

    throw new Error(
      "AudioContext desteklenmiyor."
    );

  }

  var ctx =
    new AC();

  try{

    var arrayBuffer =
      await blobToArrayBuffer(
        blob
      );

    var decoded =
      await new Promise(
        function(resolve,reject){

          ctx.decodeAudioData(

            arrayBuffer.slice(0),

            function(buffer){

              resolve(
                buffer
              );

            },

            function(error){

              reject(
                error ||
                new Error(
                  "Ses çözümlenemedi."
                )
              );

            }

          );

        }
      );

    var duration =
      Number(
        decoded.duration
      );

    if(
      !isFinite(duration) ||
      duration<=0
    ){

      throw new Error(
        "Gerçek ses süresi okunamadı."
      );

    }

    return duration;

  }finally{

    try{
      await ctx.close();
    }catch(e){}

  }

}


/* =========================================================
   SES KAYDET
========================================================= */

async function recordScene(
  scene,
  index
){

  if(!captureStream){

    setStatus(
      "Önce SES YAKALAMAYI HAZIRLA."
    );

    return;

  }

  var audioTracks =
    captureStream.getAudioTracks();

  if(!audioTracks.length){

    setStatus(
      "Ses kanalı bulunamadı."
    );

    return;

  }

  try{

    stopRequested =
      false;

    speechSynthesis.cancel();

    recordedChunks = [];

    var audioStream =
      new MediaStream(
        audioTracks
      );

    var options = {};

    if(
      MediaRecorder.isTypeSupported(
        "audio/webm;codecs=opus"
      )
    ){

      options.mimeType =
        "audio/webm;codecs=opus";

    }else{

      options.mimeType =
        "audio/webm";

    }

    mediaRecorder =
      new MediaRecorder(
        audioStream,
        options
      );

    mediaRecorder.ondataavailable =
      function(event){

        if(
          event.data &&
          event.data.size>0
        ){

          recordedChunks.push(
            event.data
          );

        }

      };

    var recorderStopped =
      new Promise(
        function(resolve){

          mediaRecorder.onstop =
            function(){

              resolve();

            };

        }
      );

    mediaRecorder.start(
      200
    );

    var utterance =
      new SpeechSynthesisUtterance(
        scene.text
      );

    utterance.lang =
      languageEl.value;

    utterance.rate =
      parseFloat(
        rateEl.value
      );

    utterance.pitch =
      1;

    utterance.onend =
      function(){

        setTimeout(
          function(){

            if(
              mediaRecorder &&
              mediaRecorder.state !==
              "inactive"
            ){

              mediaRecorder.stop();

            }

          },
          250
        );

      };

    utterance.onerror =
      function(){

        if(
          mediaRecorder &&
          mediaRecorder.state !==
          "inactive"
        ){

          mediaRecorder.stop();

        }

      };

    speechSynthesis.speak(
      utterance
    );

    await recorderStopped;

    if(stopRequested){

      return;

    }

    var blob =
      new Blob(
        recordedChunks,
        {
          type:
            options.mimeType ||
            "audio/webm"
        }
      );

    if(!blob.size){

      throw new Error(
        "Ses kaydı boş."
      );

    }

    var duration =
      await getAudioDuration(
        blob
      );

    scene.audioBlob =
      blob;

    scene.audioURL =
      URL.createObjectURL(
        blob
      );

    scene.audioDuration =
      duration;

    updateAudioInfo(
      scene,
      index
    );

    setStatus(
      "✅ Sahne " +
      (index+1) +
      " ses kaydı tamamlandı: " +
      formatTime(duration)
    );

  }catch(error){

    console.error(error);

    setStatus(
      "❌ Ses kayıt hatası: " +
      error.message
    );

  }

}

/* =========================================================
   TIME
========================================================= */

function formatTime(seconds){

  if(
    !isFinite(seconds)
  ){

    return "0.00 sn";

  }

  if(seconds<60){

    return seconds.toFixed(2) +
      " sn";

  }

  var minutes =
    Math.floor(
      seconds/60
    );

  var sec =
    seconds -
    minutes*60;

  return (
    minutes +
    ":" +
    String(
      Math.floor(sec)
    ).padStart(
      2,
      "0"
    )
  );

}

  scene
){

    throw new Error(

    );

  }

  if(
    !isFinite(
      scene.audioDuration
    ) ||
    scene.audioDuration<=0
  ){

    scene.audioDuration =
      await getAudioDuration(
        scene.audioBlob
      );

  }

  return scene.audioDuration;

}

/* =========================================================
   COVER DRAW
========================================================= */

function drawCover(
  ctx,
  img,
  canvasW,
  canvasH,
  progress,
  motion
){

  var iw =
    img.naturalWidth ||
    img.width;

  var ih =
    img.naturalHeight ||
    img.height;

  if(
    !iw ||
    !ih
  ){

    return;

  }

  var imageRatio =
    iw/ih;

  var canvasRatio =
    canvasW/canvasH;

  var baseScale;

  if(
    imageRatio >
    canvasRatio
  ){

    baseScale =
      canvasH/ih;

  }else{

    baseScale =
      canvasW/iw;

  }

  var zoom;

  if(motion===0){

    zoom =
      1.015 +
      progress*0.045;

  }else if(motion===1){

    zoom =
      1.06 -
      progress*0.045;

  }else{

    zoom =
      1.035 +
      Math.sin(
        progress*Math.PI*2
      )*0.018;

  }

  var scale =
    baseScale*zoom;

  var dw =
    iw*scale;

  var dh =
    ih*scale;

  var maxX =
    Math.max(
      0,
      dw-canvasW
    );

  var maxY =
    Math.max(
      0,
      dh-canvasH
    );

  var x;
  var y;

  if(motion===0){

    x =
      -maxX*progress;

    y =
      -maxY*0.5;

  }else if(motion===1){

    x =
      -maxX*
      (1-progress);

    y =
      -maxY*0.5;

  }else{

    x =
      -maxX*0.5;

    y =
      -maxY*0.5;

  }

  ctx.drawImage(
    img,
    x,
    y,
    dw,
    dh
  );

}


/* =========================================================
   TEXT WRAP
========================================================= */

function wrapText(
  ctx,
  text,
  maxWidth
){

  var words =
    text.split(
      /\s+/
    );

  var lines = [];

  var line = "";

  for(
    var i=0;
    i<words.length;
    i++
  ){

    var test =
      line
      ? line+" "+words[i]
      : words[i];

    if(
      ctx.measureText(
        test
      ).width >
      maxWidth &&
      line
    ){

      lines.push(
        line
      );

      line =
        words[i];

    }else{

      line =
        test;

    }

  }

  if(line){

    lines.push(
      line
    );

  }

  return lines;

}


/* =========================================================
   SUBTITLE
========================================================= */

function drawSubtitle(
  ctx,
  text,
  canvasW,
  canvasH
){

  if(!text){
    return;
  }

  var fontSize =
    Math.max(
      21,
      Math.floor(
        canvasW*0.026
      )
    );

  ctx.font =
    "bold " +
    fontSize +
    "px Arial";

  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "middle";

  var maxWidth =
    canvasW*0.82;

  var lines =
    wrapText(
      ctx,
      text,
      maxWidth
    );

  var lineHeight =
    fontSize*1.22;

  var padding =
    fontSize*0.5;

  var totalHeight =
    lines.length*
    lineHeight;

  var boxHeight =
    totalHeight+
    padding*2;

  var boxY =
    canvasH -
    boxHeight -
    canvasH*0.055;

  ctx.save();

  ctx.fillStyle =
    "rgba(0,0,0,.68)";

  roundRect(
    ctx,
    canvasW*0.06,
    boxY,
    canvasW*0.88,
    boxHeight,
    12
  );

  ctx.fill();

  ctx.fillStyle =
    "#fff";

  for(
    var i=0;
    i<lines.length;
    i++
  ){

    var y =
      boxY+
      padding+
      lineHeight*i+
      lineHeight/2;

    ctx.fillText(
      lines[i],
      canvasW/2,
      y
    );

  }

  ctx.restore();

}


/* =========================================================
   ROUND RECT
========================================================= */

function roundRect(
  ctx,
  x,
  y,
  width,
  height,
  radius
){

  ctx.beginPath();

  ctx.moveTo(
    x+radius,
    y
  );

  ctx.lineTo(
    x+width-radius,
    y
  );

  ctx.quadraticCurveTo(
    x+width,
    y,
    x+width,
    y+radius
  );

  ctx.lineTo(
    x+width,
    y+height-radius
  );

  ctx.quadraticCurveTo(
    x+width,
    y+height,
    x+width-radius,
    y+height
  );

  ctx.lineTo(
    x+radius,
    y+height
  );

  ctx.quadraticCurveTo(
    x,
    y+height,
    x,
    y+height-radius
  );

  ctx.lineTo(
    x,
    y+radius
  );

  ctx.quadraticCurveTo(
    x,
    y,
    x+radius,
    y
  );

  ctx.closePath();

}

/* =========================================================
   LOGO DRAW
========================================================= */

function drawLogo(
  ctx,
  canvasW,
  canvasH
){

  if(!logoImage){
    return;
  }

  var maxW =
    canvasW*0.13;

  var maxH =
    canvasH*0.12;

  var iw =
    logoImage.naturalWidth ||
    logoImage.width;

  var ih =
    logoImage.naturalHeight ||
    logoImage.height;

  var scale =
    Math.min(
      maxW/iw,
      maxH/ih
    );

  var w =
    iw*scale;

  var h =
    ih*scale;

  var x =
    canvasW-w-
    canvasW*0.035;

  var y =
    canvasH*0.035;

  ctx.save();

  ctx.globalAlpha =
    0.9;

  ctx.drawImage(
    logoImage,
    x,
    y,
    w,
    h
  );

  ctx.restore();

}


/* =========================================================
   AUDIO DECODE
========================================================= */

async function decodeAudioBlob(
  blob,
  audioContext
){

  var arrayBuffer =
    await blobToArrayBuffer(
      blob
    );

  return await new Promise(
    function(resolve,reject){

      audioContext.decodeAudioData(

        arrayBuffer.slice(0),

        function(buffer){

          resolve(
            buffer
          );

        },

        function(error){

          reject(
            error ||
            new Error(
              "Audio decode hatası."
            )
          );

        }

      );

    }
  );

}


/* =========================================================
   AUDIO SOURCE ÇALIŞTIR
========================================================= */

function playAudioBuffer(
  audioContext,
  destination,
  buffer
){

  var source =
    audioContext.createBufferSource();

  source.buffer =
    buffer;

  source.connect(
    destination
  );

  source.start(
    0
  );

  return source;

}

   FRAME DRAW

function drawFrame(

){

  ctx.fillStyle =
    "#000";

  ctx.fillRect(

  );

  drawCover(

    scene.imageObject,
    canvasW,
    canvasH,
    progress,

  );

  drawLogo(
    ctx,
    canvasW,
    canvasH
  );

  drawSubtitle(
    ctx,
    scene.text,
    canvasW,
    canvasH
  );

}


/* =========================================================

async function renderVideo(){

  if(!scenes.length){

    setStatus(
      "Önce sahneleri oluştur."
    );

    return;

  }

  stopRequested =
    false;

  setProgress(0);

    "";

  if(videoURL){

    try{

      URL.revokeObjectURL(
        videoURL
      );

    }catch(e){}

    videoURL =
      null;

  }

  try{

    setStatus(
      "⚡ V41.3 akıcı render hazırlanıyor..."
    );


    /* -----------------------------------------
       SES KONTROL
    ----------------------------------------- */

    for(
      var check=0;
      check<scenes.length;
      check++
    ){

      if(
        !scenes[check].imageURL
      ){

        throw new Error(
          "Sahne " +
          (check+1) +
          " görseli yok."
        );

      }

      await ensureAudioDuration(
        scenes[check]
      );

    }


    /* -----------------------------------------
       TÜM GÖRSELLERİ ÖNCEDEN YÜKLE
    ----------------------------------------- */

    setStatus(
      "🖼️ Görseller belleğe hazırlanıyor..."
    );

    await preloadImages();


    /* -----------------------------------------
       CANVAS BOYUTU
    ----------------------------------------- */

    var format =
      formatEl.value;

    var canvas =
      document.createElement(
        "canvas"
      );

    if(format==="9:16"){

      canvas.width =
        720;

      canvas.height =
        1280;

    }else if(format==="1:1"){

      canvas.width =
        900;

      canvas.height =
        900;

    }else{

      canvas.width =
        1280;

      canvas.height =
        720;

    }


    var ctx =
      canvas.getContext(
        "2d",
        {
          alpha:false,
          desynchronized:true
        }
      );


    if(!ctx){

      throw new Error(
        "Canvas oluşturulamadı."
      );

    }


    /* -----------------------------------------
       CANVAS VIDEO
    ----------------------------------------- */

    var canvasStream =
      canvas.captureStream(
        RENDER_FPS
      );


    /* -----------------------------------------
       AUDIO CONTEXT
    ----------------------------------------- */

    var AC =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!AC){

      throw new Error(
        "AudioContext desteklenmiyor."
      );

    }

    var audioContext =
      new AC();


    try{

      await audioContext.resume();

    }catch(e){}


    var destination =
      audioContext
        .createMediaStreamDestination();


    /* -----------------------------------------
       FINAL STREAM
    ----------------------------------------- */

    var finalTracks = [];

    canvasStream
      .getVideoTracks()
      .forEach(
        function(track){

          finalTracks.push(
            track
          );

        }
      );

    destination.stream
      .getAudioTracks()
      .forEach(
        function(track){

          finalTracks.push(
            track
          );

        }
      );


    var finalStream =
      new MediaStream(
        finalTracks
      );


    /* -----------------------------------------
       MEDIA RECORDER
       VP8 ÖNCELİKLİ
    ----------------------------------------- */

    var mimeType = "";

    if(
      MediaRecorder.isTypeSupported(
        "video/webm;codecs=vp8,opus"
      )
    ){

      mimeType =
        "video/webm;codecs=vp8,opus";

    }else if(
      MediaRecorder.isTypeSupported(
        "video/webm;codecs=vp9,opus"
      )
    ){

      mimeType =
        "video/webm;codecs=vp9,opus";

    }else{

      mimeType =
        "video/webm";

    }


    var recorder =
      new MediaRecorder(
        finalStream,
        {
          mimeType:mimeType,
          videoBitsPerSecond:4200000,
          audioBitsPerSecond:128000
        }
      );


    var chunks = [];


    recorder.ondataavailable =
      function(event){

        if(
          event.data &&
          event.data.size
        ){

          chunks.push(
            event.data
          );

        }

      };


    var recorderFinished =
      new Promise(
        function(resolve){

          recorder.onstop =
            function(){

              resolve();

            };

        }
      );


    recorder.start(
      500
    );


    /* -----------------------------------------
       TOPLAM SÜRE
    ----------------------------------------- */

    var totalDuration =
      0;

    for(
      var d=0;
      d<scenes.length;
      d++
    ){

      totalDuration +=
        scenes[d].audioDuration;

    }


    var totalElapsed =
      0;


    /* -----------------------------------------
       SAHNELER
    ----------------------------------------- */

    for(
      var i=0;
      i<scenes.length;
      i++
    ){

      if(stopRequested){

        break;

      }

      var scene =
        scenes[i];

      var duration =
        scene.audioDuration;


      setStatus(
        "🎬 Sahne " +
        (i+1) +
        "/" +
        scenes.length +
        " render ediliyor...\n" +
        "Süre: " +
        formatTime(duration) +
        "\n" +
        "Motor: 24 FPS / VP8"
      );


      /* ---------------------------------------
         SESİ ÖNCEDEN DECODE ET
      --------------------------------------- */

      var audioBuffer =
        await decodeAudioBlob(
          scene.audioBlob,
          audioContext
        );


      /* ---------------------------------------
         SESİ BAŞLAT
      --------------------------------------- */

      var source =
        playAudioBuffer(
          audioContext,
          destination,
          audioBuffer
        );


      /* ---------------------------------------
         SAHNE ZAMANI
      --------------------------------------- */

      var start =
        performance.now();

      var nextFrame =
        start;

      var motion =
        i % 3;


      while(true){

        if(stopRequested){

          break;

        }


        var now =
          performance.now();


        var elapsedScene =
          (now-start)/1000;


        var progress =
          elapsedScene /
          duration;


        if(progress>1){

          progress =
            1;

        }


        /* -------------------------------------
           FRAME
        ------------------------------------- */

        drawFrame(
          ctx,
          scene,
          canvas.width,
          canvas.height,
          progress,
          motion
        );


        /* -------------------------------------
           PROGRESS
        ------------------------------------- */

        var overall =
          (
            totalElapsed +
            Math.min(
              elapsedScene,
              duration
            )
          ) /
          totalDuration;


        setProgress(
          overall*100
        );


        /* -------------------------------------
           SAHNE BİTTİ
        ------------------------------------- */

        if(
          elapsedScene>=duration
        ){

          break;

        }


        /* -------------------------------------
           24 FPS FRAME PACING
        ------------------------------------- */

        nextFrame +=
          FRAME_MS;

        var delay =
          nextFrame -
          performance.now();


        if(delay>1){

          await wait(
            delay
          );

        }else{

          await new Promise(
            function(resolve){

              setTimeout(
                resolve,
                0
              );

            }
          );

        }

      }


      totalElapsed +=
        duration;


      try{

        source.stop();

      }catch(e){}


      /* ---------------------------------------
         SAHNE GEÇİŞİNDE BİR FRAME
         ÇİZİP TEMİZ BIRAK
      --------------------------------------- */

      if(
        i<
        scenes.length-1 &&
        !stopRequested
      ){

        ctx.fillStyle =
          "#000";

        ctx.fillRect(
          0,
          0,
          canvas.width,
          canvas.height
        );

        await wait(
          15
        );

      }

    }


    /* -----------------------------------------
       RECORDER STOP
    ----------------------------------------- */

    try{

      recorder.stop();

    }catch(e){}


    await recorderFinished;


    /* -----------------------------------------
       VIDEO BLOB
    ----------------------------------------- */

    videoBlob =
      new Blob(
        chunks,
        {
          type:
            mimeType
        }
      );


    if(!videoBlob.size){

      throw new Error(
        "Video dosyası boş oluştu."
      );

    }


    videoURL =
      URL.createObjectURL(
        videoBlob
      );


    /* -----------------------------------------
       PREVIEW
    ----------------------------------------- */

    videoPreview.src =
      videoURL;

    videoPreview.load();


    /* -----------------------------------------
       DOWNLOAD
    ----------------------------------------- */

    var link =
      document.createElement(
        "a"
      );

    link.href =
      videoURL;

    link.download =
      "GeldStory_V41_3_Akici.webm";

    link.className =
      "download";

    link.textContent =
      "⬇️ VİDEOYU İNDİR";


    downloadArea.appendChild(
      link
    );


    /* -----------------------------------------
       STREAM TEMİZLE
    ----------------------------------------- */

    try{

      canvasStream
        .getTracks()
        .forEach(
          function(track){

            track.stop();

          }
        );

    }catch(e){}


    try{

      finalStream
        .getTracks()
        .forEach(
          function(track){

            track.stop();

          }
        );

    }catch(e){}


    try{

      await audioContext.close();

    }catch(e){}


    setProgress(
      100
    );


    setStatus(
      "🎉 VİDEO HAZIR!\n\n" +
      "Sahne: " +
      scenes.length +
      "\n" +
      "Toplam süre: " +
      formatTime(
        totalDuration
      ) +
      "\n" +
      "Render: 24 FPS / VP8 + Opus\n\n" +
      "Akıcı oynatma için optimize edildi."
    );


  }catch(error){

    console.error(error);

    setStatus(
      "❌ VİDEO RENDER HATASI:\n" +
      error.message
    );

  }

}


/* =========================================================
   HER ŞEYİ DURDUR
========================================================= */

function stopEverything(){

  stopRequested =
    true;

  speechSynthesis.cancel();


  if(currentAudio){

    try{

      currentAudio.pause();

      currentAudio.currentTime =
        0;

    }catch(e){}

  }


  if(
    mediaRecorder &&
    mediaRecorder.state !==
    "inactive"
  ){

    try{

      mediaRecorder.stop();

    }catch(e){}

  }


  setStatus(
    "⏹ İşlem durduruluyor..."
  );

}
